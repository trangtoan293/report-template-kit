    """Private S3 storage using SigV4 and existing requests dependency."""
    import hashlib
    import hmac
    import json
    import logging
    import os
    from concurrent.futures import ThreadPoolExecutor
    from datetime import datetime, timezone
    from urllib.parse import quote, urlsplit
    from xml.etree import ElementTree
    
    import requests
    from flask import current_app, g
    
    from customsso.report_builder import ReportError
    from customsso.reporting_s3_lock import guarded_put, write_mode
    
    LOG = logging.getLogger("hanas.report_builder")
    
    
    class StoreError(ReportError):
        pass
    
    
    class Conflict(StoreError):
        pass
    
    
    class Missing(StoreError):
        pass
    
    
    def setting(name, fallback=""):
        own = current_app.config.get("REPORT_BUILDER_S3_" + name)
        return str(own if own is not None else os.environ.get("REPORT_BUILDER_S3_" + name,
                   os.environ.get("ATTEST_S3_" + name, fallback))).strip()
    
    
    class Store:
        def __init__(self, user_id=None):
            self.endpoint = setting("ENDPOINT").rstrip("/")
            self.bucket = setting("BUCKET", "superset-attestation")
            self.access = setting("ACCESS_KEY")
            self.secret = setting("SECRET_KEY")
            self.token = setting("SESSION_TOKEN")
            self.region = setting("REGION", "us-east-1")
            self.verify = setting("VERIFY_TLS", "true").lower() not in ("0", "false", "no")
            self.timeout = min(60, max(3, int(setting("TIMEOUT", "15"))))
            # Never inherit ATTEST_S3_PREFIX: these objects have a different schema.
            self.prefix = str(current_app.config.get("REPORT_BUILDER_S3_PREFIX", "report-builder/v2")).strip("/")
            self.user = str(g.user.id if user_id is None else user_id)
            parsed = urlsplit(self.endpoint)
            if parsed.scheme not in ("http", "https") or not parsed.netloc or parsed.query or parsed.fragment or parsed.username or not self.access or not self.secret:
                raise StoreError("S3 is not configured for Report Builder. Check the server endpoint, bucket and credentials.")
            self.host = parsed.netloc
            self.path = parsed.path.rstrip("/")
            self.write_mode = write_mode(self.endpoint, StoreError)
    
        def user_key(self, kind, identifier, extension="json"):
            return f"{self.prefix}/users/{self.user}/{kind}/{identifier}.{extension}"
    
        def snapshot_key(self, identifier):
            return f"{self.prefix}/snapshots/{self.user}/{identifier}.json"
    
        def open(self, method, key, body=b"", query=None, headers=None, allow_range_error=False):
            # File uploads are hashed in chunks, then streamed by requests.
            digest = hashlib.sha256()
            if hasattr(body, "read"):
                body.seek(0)
                for chunk in iter(lambda: body.read(1024 * 1024), b""):
                    digest.update(chunk)
                body.seek(0)
            else:
                digest.update(body)
            now = datetime.now(timezone.utc)
            amzdate, day = now.strftime("%Y%m%dT%H%M%SZ"), now.strftime("%Y%m%d")
            path = quote(self.path + "/" + self.bucket + ("/" + key if key else ""), safe="/-_.~")
            qs = "&".join(quote(str(k), safe="-_.~") + "=" + quote(str(v), safe="-_.~") for k,v in sorted((query or {}).items()))
            outgoing = {"host":self.host, "x-amz-date":amzdate,
                        "x-amz-content-sha256":digest.hexdigest()}
            if self.token:
                outgoing["x-amz-security-token"] = self.token
            outgoing.update({k.lower(): str(v).strip() for k,v in (headers or {}).items()})
            signed = ";".join(sorted(outgoing))
            canonical_headers = "".join(k + ":" + outgoing[k] + "\n" for k in sorted(outgoing))
            canonical = "\n".join((method, path, qs, canonical_headers, signed, outgoing["x-amz-content-sha256"]))
            scope = f"{day}/{self.region}/s3/aws4_request"
            to_sign = "\n".join(("AWS4-HMAC-SHA256", amzdate, scope, hashlib.sha256(canonical.encode()).hexdigest()))
            signing_key = ("AWS4" + self.secret).encode()
            for part in (day, self.region, "s3", "aws4_request"):
                signing_key = hmac.new(signing_key, part.encode(), hashlib.sha256).digest()
            signature = hmac.new(signing_key, to_sign.encode(), hashlib.sha256).hexdigest()
            outgoing["Authorization"] = f"AWS4-HMAC-SHA256 Credential={self.access}/{scope}, SignedHeaders={signed}, Signature={signature}"
            origin = urlsplit(self.endpoint).scheme + "://" + self.host
            try:
                response = requests.request(method, origin + path + ("?" + qs if qs else ""), data=body,
                                            headers=outgoing, timeout=(5, self.timeout), verify=self.verify,
                                            allow_redirects=False, stream=True)
                code = response.status_code
                if 200 <= code < 300 or (allow_range_error and code == 416):
                    return response
                response.close()
                if code == 404:
                    raise Missing("The S3 object or bucket was not found.")
                if code in (409, 412):
                    raise Conflict("Content was changed in another window. Reload it or save a copy.")
                LOG.error("Report storage %s failed: HTTP %s", method, code)
                raise StoreError(f"S3 returned {code}. Check connectivity and GET/PUT/LIST permissions on the report-builder prefix.")
            except requests.RequestException as ex:
                raise StoreError("Unable to connect to S3. Check the endpoint and pod network access.") from ex
    
        def request(self, method, key, body=b"", query=None, headers=None, limit=24 * 1024 * 1024):
            try:
                with self.open(method, key, body, query, headers) as response:
                    chunks, size = [], 0
                    for chunk in response.iter_content(65536):
                        size += len(chunk)
                        if size > limit:
                            raise StoreError("The S3 object exceeds the allowed size.")
                        chunks.append(chunk)
                    return b"".join(chunks), response.headers.get("ETag", "")
            except requests.RequestException as ex:
                LOG.warning("Report storage network failure: %s", type(ex).__name__)
                raise StoreError("Unable to connect to S3. Check the endpoint and pod network access.") from ex
    
        def get(self, key, limit=24 * 1024 * 1024):
            return self.request("GET", key, limit=limit)
    
        def head(self, key):
            with self.open("HEAD", key) as response:
                return response.headers.copy()
    
        def keys(self, prefix):
            """Paginate the durable export queue, independently of UI catalog limits."""
            query = {"list-type":"2", "prefix":prefix, "max-keys":"1000"}
            while True:
                content, _ = self.request("GET", "", query=query, limit=2000000)
                if b"<!DOCTYPE" in content or b"<!ENTITY" in content:
                    raise StoreError("Invalid S3 response.")
                root = ElementTree.fromstring(content)
                ns = {"s":"http://s3.amazonaws.com/doc/2006-03-01/"}
                for node in root.findall("s:Contents/s:Key", ns):
                    if node.text and node.text.startswith(prefix):
                        yield node.text
                if root.findtext("s:IsTruncated", namespaces=ns) != "true":
                    return
                token = root.findtext("s:NextContinuationToken", namespaces=ns)
                if not token or token == query.get("continuation-token"):
                    raise StoreError("Invalid S3 pagination token.")
                query["continuation-token"] = token
    
        def put(self, key, data, mime, etag=None, create=False):
            if self.write_mode == "postgres_advisory":
                return guarded_put(self, key, data, mime, etag, create, StoreError, Conflict, Missing)
            headers = {"Content-Type":mime}
            if create:
                headers["If-None-Match"] = "*"
            elif etag:
                headers["If-Match"] = etag
            else:
                raise StoreError("Missing ETag for a safe update. Reload this item from S3.")
            return self.request("PUT", key, body=data, headers=headers)[1]
    
        def get_json(self, key):
            content, etag = self.get(key)
            if not etag:
                raise StoreError("S3 did not return an ETag. Check the reverse proxy before editing data.")
            return json.loads(content), etag
    
        def put_json(self, key, value, etag=None, create=False):
            from superset.utils import json as superset_json
            data = superset_json.dumps(value).encode("utf-8")
            return self.put(key, data, "application/json; charset=utf-8", etag=etag, create=create)
    
        def listing(self, kind):
            prefix = f"{self.prefix}/users/{self.user}/{kind}/"
            content, _ = self.request("GET", "", query={"list-type":"2", "prefix":prefix, "max-keys":"1000"}, limit=2000000)
            if b"<!DOCTYPE" in content or b"<!ENTITY" in content:
                raise StoreError("Invalid S3 response.")
            root = ElementTree.fromstring(content)
            ns = {"s":"http://s3.amazonaws.com/doc/2006-03-01/"}
            if root.findtext("s:IsTruncated", namespaces=ns) == "true":
                raise StoreError("The catalog exceeds 1,000 entries. Archive deleted entries in S3.")
            keys = [n.text for n in root.findall("s:Contents/s:Key", ns) if n.text and n.text.startswith(prefix) and n.text.endswith(".json")]
            def read(key):
                value, etag = self.get_json(key)
                if value.get("owner_id") != int(self.user) or value.get("deleted"):
                    return None
                return {"id":value["id"], "name":value["name"], "filename":value.get("filename"),
                        "extension":value.get("extension"), "variables":value.get("variables", []),
                        "dataset":value.get("dataset"), "template_name":value.get("template_name"),
                        "source":value.get("source", "dataset"), "dashboard_title":value.get("dashboard_title"),
                        "filter_labels":value.get("filter_labels", []),
                        "report_mode":value.get("report_mode", "per_row"), "group_by":value.get("group_by", []),
                        "updated_at":value.get("updated_at"), "etag":etag}
            with ThreadPoolExecutor(max_workers=8) as pool:
                items = [item for item in pool.map(read, keys) if item is not None]
            return sorted(items, key=lambda item:item.get("updated_at") or "", reverse=True)
