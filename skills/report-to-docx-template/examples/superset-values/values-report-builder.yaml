    """Report display formats and bounded arithmetic summaries; standard library only."""
    import ast
    import re
    from datetime import date, datetime
    from decimal import Decimal, DecimalException, InvalidOperation, localcontext
    from functools import lru_cache
    
    from customsso.rt_office import OfficeError, display
    
    SUMMARY_FUNCTIONS = ('SUM', 'AVG', 'MIN', 'MAX', 'COUNT', 'FIRST')
    DATE_TOKENS = re.compile(r'\[[^\[\]\r\n]*\]|YYYY|YY|MM|DD|HH|mm|ss')
    NUMBER_MASK = re.compile(r'(?:#,##0|#\.##0|0)(?:[.,]0{1,6})?')
    
    
    def numeric(value, variable):
        if isinstance(value, bool):
            raise OfficeError('Use a numeric dataset column for ' + variable + '.')
        try:
            result = Decimal(str(value))
        except (InvalidOperation, ValueError, TypeError) as ex:
            raise OfficeError('Use unformatted numeric values for ' + variable + '; formatted text cannot be summarized or reformatted.') from ex
        if not result.is_finite() or abs(result.adjusted()) > 100:
            raise OfficeError('The number for ' + variable + ' is not finite or is too large.')
        return result
    
    
    def bounded_text(value, name, limit):
        if not isinstance(value, str) or not value.strip() or len(value) > limit or any(ord(c) < 32 for c in value):
            raise OfficeError(name + f' must contain between 1 and {limit} characters on one line.')
        return value
    
    
    @lru_cache(maxsize=256)
    def number_masks(pattern):
        bounded_text(pattern, 'Custom number format', 120)
        sections = pattern.split(';')
        if len(sections) > 2:
            raise OfficeError('Use a positive number format, optionally followed by ; and a negative number format.')
        result = []
        for section in sections:
            matches = list(NUMBER_MASK.finditer(section))
            if len(matches) != 1:
                raise OfficeError('Use a number pattern such as #,##0.00, #.##0,00 or 0.00%.')
            match = matches[0]
            prefix, suffix, mask = section[:match.start()], section[match.end():], match[0]
            if any(c in prefix + suffix for c in '0#.,;') or (prefix + suffix).count('%') > 1:
                raise OfficeError('Invalid custom number format. Example: #,##0.00;(#,##0.00).')
            grouping = ',' if mask.startswith('#,') else '.' if mask.startswith('#.') else ''
            tail = mask[5:] if grouping else mask[1:]
            separator = tail[:1] if tail else (',' if grouping == '.' else '.')
            if tail and separator == grouping:
                raise OfficeError('Use different decimal and thousands separators.')
            result.append((prefix, suffix, grouping, separator, len(tail[1:]), '%' in prefix + suffix))
        return tuple(result)
    
    
    def date_pattern(pattern):
        bounded_text(pattern, 'Date format', 120)
        remaining = DATE_TOKENS.sub('', pattern)
        if '[' in remaining or ']' in remaining or not any(not m[0].startswith('[') for m in DATE_TOKENS.finditer(pattern)):
            raise OfficeError('Use date tokens YYYY, YY, MM, DD, HH, mm or ss. Example: DD/MM/YYYY.')
        return pattern
    
    
    def parsed_date(value, variable):
        if isinstance(value, datetime):
            return value
        if isinstance(value, date):
            return datetime.combine(value, datetime.min.time())
        if isinstance(value, str) and len(value) <= 80:
            value = value.strip()
            try:
                return datetime.fromisoformat(value[:-1] + '+00:00' if value.endswith('Z') else value)
            except ValueError:
                pass
            for pattern in ('%d/%m/%Y', '%d/%m/%Y %H:%M', '%d/%m/%Y %H:%M:%S'):
                try:
                    return datetime.strptime(value, pattern)
                except ValueError:
                    pass
        raise OfficeError('Use an ISO date/time or DD/MM/YYYY value for ' + variable + '. Unix timestamps must be converted to dates in the dataset.')
    
    
    def format_date(value, pattern, variable):
        value = parsed_date(value, variable)
        parts = {'YYYY':f'{value.year:04d}', 'YY':f'{value.year % 100:02d}', 'MM':f'{value.month:02d}',
                 'DD':f'{value.day:02d}', 'HH':f'{value.hour:02d}', 'mm':f'{value.minute:02d}', 'ss':f'{value.second:02d}'}
        return DATE_TOKENS.sub(lambda m: m[0][1:-1] if m[0].startswith('[') else parts[m[0]], date_pattern(pattern))
    
    
    def format_number(value, pattern, variable):
        number = numeric(value, variable)
        masks = number_masks(pattern)
        prefix, suffix, grouping, separator, decimals, percent = masks[1 if number < 0 and len(masks) == 2 else 0]
        with localcontext() as context:
            context.prec = 120
            magnitude = number.copy_abs() * (100 if percent else 1)
            result = format(magnitude, (',' if grouping else '') + '.' + str(decimals) + 'f')
        result = result.translate(str.maketrans({',':grouping, '.':separator}))
        return ('-' if number < 0 and len(masks) == 1 else '') + prefix + result + suffix
    
    
    def formatted(value, binding, variable):
        fmt = binding.get('number_format', 'raw')
        if value is None or value == '' or fmt == 'raw':
            return value
        if fmt in ('en', 'vi'):
            number = numeric(value, variable)
            result = format(number, ',.' + str(binding.get('decimals', 0)) + 'f')
            return result.translate(str.maketrans(',.', '.,')) if fmt == 'vi' else result
        if fmt == 'date':
            return format_date(value, binding.get('date_format', 'DD/MM/YYYY'), variable)
        if fmt == 'custom':
            kind, pattern = binding.get('custom_type', 'number'), binding.get('custom_format', '#,##0.00')
            if kind == 'number':
                return format_number(value, pattern, variable)
            if kind == 'date':
                return format_date(value, pattern, variable)
            if kind == 'text':
                return pattern.replace('{value}', display(value))
        raise OfficeError('Invalid data format for ' + variable + '.')
    
    
    @lru_cache(maxsize=256)
    def formula_tree(expression):
        bounded_text(expression, 'Custom summary', 256)
        try:
            tree = ast.parse(expression.strip(), mode='eval').body
        except (SyntaxError, ValueError, RecursionError) as ex:
            raise OfficeError('Invalid custom summary. Example: SUM("amount") / COUNT("amount").') from ex
        count = [0]
        def validate(node, depth=0):
            count[0] += 1
            if depth > 12 or count[0] > 80:
                raise OfficeError('The custom summary is too complex.')
            if isinstance(node, ast.BinOp) and type(node.op) in (ast.Add, ast.Sub, ast.Mult, ast.Div):
                validate(node.left, depth + 1)
                validate(node.right, depth + 1)
            elif isinstance(node, ast.UnaryOp) and type(node.op) in (ast.UAdd, ast.USub):
                validate(node.operand, depth + 1)
            elif isinstance(node, ast.Constant) and type(node.value) in (int, float):
                numeric(ast.get_source_segment(expression.strip(), node), 'custom summary')
            elif isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id.upper() in SUMMARY_FUNCTIONS:
                if node.keywords or len(node.args) > 1 or any(not isinstance(arg, ast.Constant) or type(arg.value) is not str for arg in node.args):
                    raise OfficeError('Summary functions accept one quoted column name, or no argument for the mapped column.')
            else:
                raise OfficeError('Custom summaries support SUM, AVG, MIN, MAX, COUNT, FIRST, numbers, parentheses and + - * / only.')
        validate(tree)
        return tree
    
    
    def formula_columns(expression):
        return list(dict.fromkeys(node.args[0].value for node in ast.walk(formula_tree(expression))
                                 if isinstance(node, ast.Call) and node.args))
    
    
    def expression_columns(mapping):
        return list(dict.fromkeys(column for binding in mapping.values()
                                 if binding.get('aggregate') == 'custom' and 'column' in binding
                                 for column in formula_columns(binding['expression'])))
    
    
    def normalize_bindings(payload, mapping, names, mode):
        for variable, binding in mapping.items():
            if 'column' not in binding:
                continue
            original = payload.get('mapping', {}).get(variable, {})
            aggregate = original.get('aggregate', 'constant') if mode == 'multi_row' else 'constant'
            fmt, decimals = original.get('number_format', 'raw'), original.get('decimals', 0)
            if aggregate not in ('constant', 'first', 'sum', 'avg', 'min', 'max', 'count', 'custom'):
                raise OfficeError('Invalid summary operation for ' + variable + '.')
            if fmt not in ('raw', 'en', 'vi', 'date', 'custom') or type(decimals) is not int or not 0 <= decimals <= 6:
                raise OfficeError('Invalid data format for ' + variable + '.')
            binding.update(aggregate=aggregate, number_format=fmt, decimals=decimals)
            if fmt == 'date':
                binding['date_format'] = date_pattern(original.get('date_format', 'DD/MM/YYYY'))
            if fmt == 'custom':
                kind, pattern = original.get('custom_type', 'number'), original.get('custom_format', '#,##0.00')
                bounded_text(pattern, 'Custom format for ' + variable, 120)
                if kind == 'number':
                    number_masks(pattern)
                elif kind == 'date':
                    date_pattern(pattern)
                elif kind == 'text':
                    if '{value}' not in pattern or re.search(r'[{}]', pattern.replace('{value}', '')):
                        raise OfficeError('Custom text format must use {value}. Example: Balance: {value}.')
                else:
                    raise OfficeError('Select Number, Date / time or Text as the custom format type.')
                binding.update(custom_type=kind, custom_format=pattern)
            if aggregate == 'custom':
                expression = bounded_text(original.get('expression', ''), 'Custom summary for ' + variable, 256).strip()
                if any(column not in names for column in formula_columns(expression)):
                    raise OfficeError('The custom summary for ' + variable + ' refers to a column that is not in this dataset.')
                binding['expression'] = expression
    
    
    def summary_value(operation, column, rows, variable):
        if operation == 'COUNT' and column is None:
            return Decimal(len(rows))
        items = [row.get(column) for row in rows]
        if operation == 'FIRST':
            return items[0] if items else None
        items = [item for item in items if item is not None and item != '']
        if operation == 'COUNT':
            return Decimal(len(items))
        numbers = [numeric(item, variable) for item in items]
        if operation == 'SUM':
            return sum(numbers, Decimal(0))
        if not numbers:
            return None
        if operation == 'AVG':
            return sum(numbers, Decimal(0)) / len(numbers)
        return min(numbers) if operation == 'MIN' else max(numbers)
    
    
    def custom_value(expression, column, rows, variable):
        expression = expression.strip()
        cache = {}
        def visit(node):
            if isinstance(node, ast.Constant):
                return numeric(ast.get_source_segment(expression, node), variable)
            if isinstance(node, ast.Call):
                operation = node.func.id.upper()
                field = node.args[0].value if node.args else (None if operation == 'COUNT' else column)
                cache_key = (operation, field)
                if cache_key not in cache:
                    cache[cache_key] = summary_value(operation, field, rows, variable)
                value = cache[cache_key]
                return None if value is None or value == '' else numeric(value, variable)
            if isinstance(node, ast.UnaryOp):
                value = visit(node.operand)
                return None if value is None else numeric(-value if isinstance(node.op, ast.USub) else value, variable)
            left, right = visit(node.left), visit(node.right)
            if left is None or right is None:
                return None
            if isinstance(node.op, ast.Div):
                if right == 0:
                    raise OfficeError('Custom summary for ' + variable + ' divides by zero. Adjust the formula or selected data.')
                result = left / right
            elif isinstance(node.op, ast.Add):
                result = left + right
            elif isinstance(node.op, ast.Sub):
                result = left - right
            else:
                result = left * right
            return numeric(result, variable)
        with localcontext() as context:
            context.prec = 120
            try:
                return visit(formula_tree(expression))
            except DecimalException as ex:
                raise OfficeError('Unable to calculate custom summary for ' + variable + '.') from ex
    
    
    def aggregate_value(binding, rows, variable):
        operation = binding.get('aggregate', 'constant')
        items = [row.get(binding['column']) for row in rows]
        if operation in ('constant', 'first'):
            value = items[0]
            if operation == 'constant' and any(display(item) != display(value) for item in items[1:]):
                raise OfficeError('Variable ' + variable + ' has different values in one report. Add a group column, choose First value or configure a summary.')
            return value
        if operation == 'custom':
            return custom_value(binding['expression'], binding['column'], rows, variable)
        with localcontext() as context:
            context.prec = 120
            return summary_value(operation.upper(), None if operation == 'count' else binding['column'], rows, variable)
