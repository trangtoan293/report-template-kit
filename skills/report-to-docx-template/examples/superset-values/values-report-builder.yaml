            ${(state.template.repeat_candidates||[]).map(row=>{const rule=state.repeatRows.find(r=>r.id===row.id);return `<div class="repeat-choice"><label class="row"><input type="checkbox" data-repeat-id="${esc(row.id)}"${rule?' checked':''}${row.reason?' disabled':''}>${esc(row.label)}</label><small>${row.variables.map(esc).join(', ')}</small>
