                navigation_settings=[item for item in items if item.get("name") in settings_names],
                navigation_account=menu_data.get("navbar_right") or {},
                navigation_active="Report Templates" if cfg["view"] == "templates" else "Dataset Reports",
                navigation_url=lambda value: navigation_url(value, prefix))
