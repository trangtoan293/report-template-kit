    * {{ "{{" }}box-sizing:border-box;}} body {{ "{{" }}margin:0;background:#e8edf2;font-family:Arial,sans-serif;color:#152335;}}
    main {{ "{{" }}width:{width}mm;min-height:210mm;margin:16px auto;background:white;padding:{page['margin']}mm;}}
    section {{ "{{" }}display:inline-block;vertical-align:top;padding:0 3mm 4mm;overflow-wrap:anywhere;}}
    .text {{ "{{" }}white-space:pre-wrap;}} h3 {{ "{{" }}margin:0 0 3mm;font-size:1.1em;}}
    table {{ "{{" }}border-collapse:collapse;table-layout:fixed;width:100%;font-size:inherit;text-align:inherit;}}
    th,td {{ "{{" }}border:1px solid #c7d1dc;padding:2mm;vertical-align:top;overflow-wrap:anywhere;}}
    th {{ "{{" }}background:#eaf1f7;}} thead {{ "{{" }}display:table-header-group;}} tr {{ "{{" }}break-inside:avoid;}}
    .warning {{ "{{" }}color:#a34000;}} @media print {{ "{{" }}body {{ "{{" }}background:white;}} main {{ "{{" }}width:auto;min-height:0;margin:0;padding:0;}}}}
    </style></head><body><main>{''.join(blocks)}</main></body></html>'''
    
    
