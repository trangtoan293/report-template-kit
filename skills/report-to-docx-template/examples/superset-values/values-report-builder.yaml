    """Init-container font loader. Only contacts the configured internal S3 server."""
    import base64
    import hashlib
    import io
    import json
    import os
    from pathlib import Path
    import zipfile
    
    ROOT = Path('/app/report-pdf')
    MAX_BUNDLE = 128 * 1024 * 1024
    MAX_EXPANDED = 256 * 1024 * 1024
    
    
    def main():
        ROOT.mkdir(parents=True, exist_ok=True)
        # The chart puts extraEnv directly on the web container. Mirror only the S3
        # settings for this init container, while retaining credentials from Secret.
        overrides = json.loads(base64.b64decode(os.environ.get('REPORT_PDF_EXTRA_ENV_B64', 'e30='))) or {}
        for name, value in overrides.items():
            if name.startswith(('REPORT_BUILDER_S3_', 'ATTEST_S3_')):
                os.environ[name] = str(value)
        os.environ.pop('REPORT_PDF_EXTRA_ENV_B64', None)
        key = os.environ.get('REPORT_PDF_FONT_KEY', '').strip()
        if key:
            from types import SimpleNamespace
            from flask import Flask, g
            from customsso.rt_storage import Store
            app = Flask('report-pdf-fonts')
            with app.app_context():
                g.user = SimpleNamespace(id=0)
                content, _ = Store().get(key, limit=MAX_BUNDLE)
            expected = os.environ.get('REPORT_PDF_FONT_SHA256', '').strip().lower()
            if expected and hashlib.sha256(content).hexdigest() != expected:
                raise ValueError('PDF font bundle SHA-256 does not match the configured value.')
            with zipfile.ZipFile(io.BytesIO(content)) as archive:
                items = [item for item in archive.infolist() if not item.is_dir()]
                if not 1 <= len(items) <= 256 or sum(item.file_size for item in items) > MAX_EXPANDED:
                    raise ValueError('PDF font bundle must contain 1-256 files and expand to at most 256 MB.')
                for i, item in enumerate(items):
                    suffix = Path(item.filename).suffix.lower()
                    if suffix not in ('.ttf', '.otf', '.ttc') or item.file_size > 64 * 1024 * 1024:
                        raise ValueError('PDF font bundle must contain only TTF, OTF or TTC fonts, up to 64 MB each.')
                    raw = archive.read(item)
                    if raw[:4] not in (b'\x00\x01\x00\x00', b'OTTO', b'ttcf', b'true'):
                        raise ValueError('PDF font bundle contains an invalid font file.')
                    # Generated flat paths: zip member names never become filesystem paths.
                    target = ROOT / ('font-' + str(i) + '-' + hashlib.sha256(raw).hexdigest()[:16] + suffix)
                    target.write_bytes(raw)
                    target.chmod(0o644)
            print('PDF font bundle installed: ' + str(len(items)) + ' files.', flush=True)
        else:
            print('No custom PDF font bundle configured. Only bundled converter fonts are available.', flush=True)
        ROOT.chmod(0o755)
        os.chown(ROOT, 1001, 1001)
    
    
    if __name__ == '__main__':
        main()
