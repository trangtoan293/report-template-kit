          if(!ex.snapshot)throw new Error('Apply filters to load data first.');
          const indices=all?ex.snapshot.rows.map((_,i)=>i):[...ex.selected].sort((a,b)=>a-b);
          if(!indices.length)throw new Error('Select at least one row.');
          byId('rt-export-progress').textContent='Preparing report groups…';
          const signature=JSON.stringify([ex.snapshot.snapshot_id,indices]);
          if(ex.pendingPlan?.signature!==signature)ex.pendingPlan={signature,plan:await api('/export-plan','POST',{snapshot_id:ex.snapshot.snapshot_id,indices})};
          byId('rt-export-progress').textContent='Submitting background export…';
          await api('/exports','POST',{snapshot_id:ex.pendingPlan.plan.snapshot_id});
          byId('rt-export').close();
          await openJobs();
          toast('Export accepted. You can close this page and download it later from Export history.');
