    W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main"
    X = "http://schemas.openxmlformats.org/spreadsheetml/2006/main"
    R = "http://schemas.openxmlformats.org/officeDocument/2006/relationships"
    TOKEN = re.compile(r"\{#\s*([^#{}\[\]\r\n]{1,128}?)\s*#\}|\[#\s*([^#{}\[\]\r\n]{1,128}?)\s*#\]")
    MAX_FILE = 10 * 1024 * 1024
    MAX_EXPANDED = 60 * 1024 * 1024
    
    
    class OfficeError(ValueError):
        pass
    
    
    def key(match):
        return (match.group(1) or match.group(2)).strip()
    
    
    def xml(data):
        if len(data) > 12 * 1024 * 1024 or b"\x00" in data or re.search(br"<!\s*(DOCTYPE|ENTITY)", data, re.I):
            raise OfficeError("The file contains unsupported or oversized XML.")
        try:
            return minidom.parseString(data)
        except Exception as ex:
            raise OfficeError("The Office file contains invalid XML.") from ex
    
    
    def children(node, ns=None, name=None):
        return [n for n in node.childNodes if n.nodeType == n.ELEMENT_NODE
                and (ns is None or n.namespaceURI == ns) and (name is None or n.localName == name)]
    
    
    def first(node, ns, name):
        return next(iter(children(node, ns, name)), None) if node is not None else None
    
    
    def val(node, ns=W, name="val", default=""):
        return node.getAttributeNS(ns, name) or default if node is not None else default
    
    
    def text(node):
        return "".join(n.data for n in node.childNodes if n.nodeType in (n.TEXT_NODE, n.CDATA_SECTION_NODE))
    
    
    def set_text(node, value):
        for child in list(node.childNodes):
            node.removeChild(child)
        node.appendChild(node.ownerDocument.createTextNode(value))
        node.setAttribute("xml:space", "preserve")
    
    
    def display(value):
        if value is None:
            return ""
        if isinstance(value, (datetime, date)):
            return value.isoformat()
        if isinstance(value, bool):
            return "true" if value else "false"
        if isinstance(value, float) and not math.isfinite(value):
            return ""
        return str(value)
    
    
    def groups(dom, extension):
        """A token may span Word runs or rich Excel runs, never paragraphs/cells."""
        if extension == "docx":
            result = {}
            for node in dom.getElementsByTagNameNS(W, "t"):
                parent = node.parentNode
                while parent and not (parent.namespaceURI == W and parent.localName == "p"):
                    parent = parent.parentNode
                if parent is not None:
                    result.setdefault(parent, []).append(node)
            return list(result.values())
        return [[t for t in node.getElementsByTagNameNS(X, "t")]
                for name in ("si", "is") for node in dom.getElementsByTagNameNS(X, name)]
    
    
    def merge_nodes(nodes, values):
        contents = [text(node) for node in nodes]
        joined = "".join(contents)
        spans, cursor = [], 0
        for item in contents:
            spans.append((cursor, cursor + len(item)))
            cursor += len(item)
        for match in reversed(list(TOKEN.finditer(joined))):
            replacement = display(values.get(key(match), ""))
            inserted = False
            for index, (start, end) in enumerate(spans):
                if start >= match.end() or end <= match.start():
                    continue
                a, b = max(0, match.start() - start), min(end - start, match.end() - start)
                contents[index] = contents[index][:a] + (replacement if not inserted else "") + contents[index][b:]
                inserted = True
        for node, content in zip(nodes, contents):
            set_text(node, content)
    
    
    def word_line_breaks(nodes):
        for node in nodes:
            segments = re.split(r"\r\n|\r|\n", text(node))
            if len(segments) < 2:
                continue
            set_text(node, segments[0])
            parent, anchor = node.parentNode, node.nextSibling
            prefix = node.prefix + ":" if node.prefix else ""
            for segment in segments[1:]:
                parent.insertBefore(node.ownerDocument.createElementNS(W, prefix + "br"), anchor)
                sibling = node.cloneNode(False)
                set_text(sibling, segment)
                parent.insertBefore(sibling, anchor)
    
    
    class OfficeTemplate:
        def __init__(self, data, extension):
            self.extension = extension.lower()
            if self.extension not in ("docx", "xlsx"):
                raise OfficeError("Only .docx and .xlsx files are supported. Convert .doc or .xls files using Save As.")
            if not data or len(data) > MAX_FILE:
                raise OfficeError("Template files must not exceed 10 MB.")
            self.data = data
            try:
                with zipfile.ZipFile(io.BytesIO(data)) as archive:
                    infos = archive.infolist()
                    names = [i.filename for i in infos]
                    if len(infos) > 1500 or sum(i.file_size for i in infos) > MAX_EXPANDED or len(names) != len(set(names)):
                        raise OfficeError("The Office file contains too many parts or is too large when extracted.")
                    if any(i.flag_bits & 1 or i.filename.startswith(("/", "\\")) or ".." in i.filename.replace("\\", "/").split("/") for i in infos):
                        raise OfficeError("Encrypted files or unsupported ZIP structures are not supported.")
                    if any(re.search(r"vbaProject|/embeddings/|externalLinks/|activeX/", name, re.I) for name in names):
                        raise OfficeError("Templates must not contain macros, external data links or embedded objects.")
                    needed = "word/document.xml" if self.extension == "docx" else "xl/workbook.xml"
                    if needed not in names or "[Content_Types].xml" not in names:
                        raise OfficeError("The file content does not match the Office format.")
                    self.parts = {i.filename: archive.read(i) for i in infos}
            except (zipfile.BadZipFile, RuntimeError) as ex:
                raise OfficeError("The file is not a valid DOCX/XLSX file or is password protected.") from ex
            # Parse relevant XML before accepting a template, with DTD/entity expansion disabled.
            self.doms = {}
            for name, content in self.parts.items():
                if self.relevant(name):
                    self.doms[name] = xml(content)
                elif name.endswith(".rels"):
                    rels = xml(content)
                    for rel in rels.documentElement.childNodes:
                        if rel.nodeType == rel.ELEMENT_NODE and rel.getAttribute("TargetMode") == "External" and not rel.getAttribute("Type").endswith("/hyperlink"):
                            raise OfficeError("The template contains externally linked content. Include the content in the file before uploading.")
            variables = set()
            for dom in self.doms.values():
                for nodes in groups(dom, self.extension):
                    variables.update(key(m) for m in TOKEN.finditer("".join(text(n) for n in nodes)))
            if not variables:
                raise OfficeError("No variables found. Use {#column_name#} in document text or Excel cells.")
            if len(variables) > 200:
                raise OfficeError("A template can contain up to 200 distinct variables.")
            self.variables = sorted(variables)
    
        def relevant(self, name):
            if self.extension == "docx":
                return bool(re.fullmatch(r"word/(document|header\d*|footer\d*|footnotes|endnotes)\.xml", name))
            return name == "xl/sharedStrings.xml" or bool(re.fullmatch(r"xl/worksheets/sheet\d+\.xml", name))
    
        def merge(self, values):
            if any(len(display(value)) > 50000 for value in values.values()):
                raise OfficeError("A data value exceeds 50,000 characters.")
            output = dict(self.parts)
            if self.extension == "docx":
                for name, original in self.doms.items():
                    dom = original.cloneNode(True)
                    for nodes in groups(dom, "docx"):
                        merge_nodes(nodes, values)
                        word_line_breaks(nodes)
                    output[name] = dom.toxml(encoding="utf-8")
            else:
                strings_dom = self.doms.get("xl/sharedStrings.xml")
                shared = list(strings_dom.getElementsByTagNameNS(X, "si")) if strings_dom else []
                for name, original in self.doms.items():
                    if not name.startswith("xl/worksheets/"):
                        continue
                    dom = original.cloneNode(True)
                    for cell in dom.getElementsByTagNameNS(X, "c"):
                        # Formulas remain formulas; data text is always stored as text, never evaluated.
                        formula = first(cell, X, "f")
                        if formula is not None:
                            cached = first(cell, X, "v")
                            if cached is not None:
                                cell.removeChild(cached)
                            continue
                        rich = first(cell, X, "is")
                        if cell.getAttribute("t") == "s":
                            index = first(cell, X, "v")
                            if index is None or not text(index).isdigit() or int(text(index)) >= len(shared):
                                raise OfficeError("The Excel shared strings table is invalid.")
                            rich = shared[int(text(index))]
                        if rich is None:
                            continue
                        whole = "".join(text(n) for n in rich.getElementsByTagNameNS(X, "t"))
                        if not TOKEN.search(whole):
                            continue
                        for child in list(children(cell, X)):
                            if child.localName in ("v", "is"):
                                cell.removeChild(child)
                        full = TOKEN.fullmatch(whole)
                        raw = values.get(key(full)) if full else None
                        if full and type(raw) in (int, float, Decimal, bool) and not (isinstance(raw, float) and not math.isfinite(raw)):
                            cell.setAttribute("t", "b" if isinstance(raw, bool) else "n")
                            node = dom.createElementNS(X, (cell.prefix + ":" if cell.prefix else "") + "v")
                            node.appendChild(dom.createTextNode("1" if raw is True else "0" if raw is False else str(raw)))
                            cell.appendChild(node)
                        else:
                            cell.setAttribute("t", "inlineStr")
                            node = dom.createElementNS(X, (cell.prefix + ":" if cell.prefix else "") + "is")
                            for child in rich.childNodes:
                                node.appendChild(dom.importNode(child, True))
                            merge_nodes(list(node.getElementsByTagNameNS(X, "t")), values)
                            cell.appendChild(node)
                    output[name] = dom.toxml(encoding="utf-8")
                if strings_dom is not None:
                    updated_strings = strings_dom.cloneNode(True)
                    for nodes in groups(updated_strings, "xlsx"):
                        merge_nodes(nodes, values)
                    output["xl/sharedStrings.xml"] = updated_strings.toxml(encoding="utf-8")
                workbook = xml(output["xl/workbook.xml"])
                calc = first(workbook.documentElement, X, "calcPr")
                if calc is None:
                    root_prefix = workbook.documentElement.prefix
                    calc = workbook.createElementNS(X, (root_prefix + ":" if root_prefix else "") + "calcPr")
                    workbook.documentElement.appendChild(calc)
                calc.setAttribute("fullCalcOnLoad", "1")
                calc.setAttribute("forceFullCalc", "1")
                calc.setAttribute("calcMode", "auto")
                output["xl/workbook.xml"] = workbook.toxml(encoding="utf-8")
                # Drop stale calcChain so Excel rebuilds dependencies after binding.
                output.pop("xl/calcChain.xml", None)
                for part in ("[Content_Types].xml", "xl/_rels/workbook.xml.rels"):
                    if part in output:
                        dom = xml(output[part])
                        for node in list(children(dom.documentElement)):
                            if "calcChain" in (node.getAttribute("PartName") + node.getAttribute("Type")):
                                node.parentNode.removeChild(node)
                        output[part] = dom.toxml(encoding="utf-8")
            stream = io.BytesIO()
            with zipfile.ZipFile(stream, "w", zipfile.ZIP_DEFLATED) as archive:
                for name, data in output.items():
                    archive.writestr(name, data)
            return stream.getvalue()
    
        def preview(self, values=None):
            if values is None:
                parts = self.parts
            else:
                with zipfile.ZipFile(io.BytesIO(self.merge(values))) as archive:
                    parts = {name: archive.read(name) for name in archive.namelist()}
            renderer = HtmlPreview(parts, self.extension, interactive=values is None)
            return renderer.render()
    
    
    class HtmlPreview:
        """Safe data preview. Native downloads retain Office layout; HTML is approximate."""
        def __init__(self, parts, extension, interactive):
            self.parts, self.extension, self.interactive = parts, extension, interactive
            self.styles, self.relationships, self.theme_fonts = {}, {}, {}
            self.part, self.default_style = "word/document.xml", "Normal"
            self.default_p = self.default_r = None
            if "word/styles.xml" in parts:
                style_dom = xml(parts["word/styles.xml"])
                defaults = first(style_dom.documentElement, W, "docDefaults")
                self.default_p = first(first(defaults, W, "pPrDefault"), W, "pPr")
                self.default_r = first(first(defaults, W, "rPrDefault"), W, "rPr")
                for item in style_dom.getElementsByTagNameNS(W, "style"):
                    self.styles[val(item, name="styleId")] = item
                    if val(item, name="type") == "paragraph" and val(item, name="default") in ("1","true"):
                        self.default_style = val(item, name="styleId")
            if "word/theme/theme1.xml" in parts:
                theme = xml(parts["word/theme/theme1.xml"])
                ns = "http://schemas.openxmlformats.org/drawingml/2006/main"
                for kind in ("major", "minor"):
                    fonts = theme.getElementsByTagNameNS(ns, kind + "Font")
                    latin = first(fonts[0], ns, "latin") if fonts else None
                    if latin is not None:
                        self.theme_fonts[kind] = latin.getAttribute("typeface")
    
        def marked(self, content):
            if not self.interactive:
                return escape(content)
            output, cursor = [], 0
            for match in TOKEN.finditer(content):
                output.append(escape(content[cursor:match.start()]))
                variable = key(match)
                output.append('<mark tabindex="0" data-key="' + escape(variable, quote=True) + '">' + escape(match.group()) + '</mark>')
                cursor = match.end()
            return "".join(output) + escape(content[cursor:])
    
        def numeric(self, value, divisor=1, fallback=0):
            try:
                return max(-1000, min(2000, float(value) / divisor))
            except (ValueError, TypeError):
                return fallback
    
        def style_chain(self, style_id):
            chain, seen = [], set()
            while style_id and style_id not in seen and style_id in self.styles:
                seen.add(style_id)
                item = self.styles[style_id]
                chain.insert(0, item)
                style_id = val(first(item, W, 'basedOn'))
            return chain
    
        def run_css(self, props):
            if props is None:
                return ''
            result = []
            for tag, name, yes, no in (('b','font-weight','bold','normal'), ('i','font-style','italic','normal')):
                node = first(props, W, tag)
                if node is not None:
                    result.append(name + ':' + (no if val(node) in ('0','false','off') else yes))
            underline = first(props, W, 'u')
            if underline is not None:
                result.append('text-decoration:' + ('none' if val(underline) in ('0','false','none') else 'underline'))
            size = first(props, W, 'sz')
            if size is not None:
                result.append(f'font-size:{max(1, self.numeric(val(size), 2, 11))}pt')
            fonts = first(props, W, 'rFonts')
            if fonts is not None:
                family = val(fonts, name='ascii') or val(fonts, name='hAnsi') or val(fonts, name='eastAsia')
                if not family:
                    theme = val(fonts, name='asciiTheme') or val(fonts, name='hAnsiTheme')
                    family = self.theme_fonts.get('major' if theme.startswith('major') else 'minor', '')
                if family:
                    # Font names are data, never raw CSS or an external font URL.
                    family = ''.join(c if c.isalnum() or c in ' -_' else '\\' + format(ord(c), 'x') + ' ' for c in family[:200])
                    result.append('font-family:"' + family + '",serif')
            color = val(first(props, W, 'color'))
            if re.fullmatch(r'[0-9a-fA-F]{6}', color):
                result.append('color:#' + color)
            align = val(first(props, W, 'vertAlign'))
            if align in ('superscript','subscript'):
                result.extend(['vertical-align:' + ('super' if align == 'superscript' else 'sub'), 'font-size:smaller'])
            return ';'.join(result)
    
        def relation(self, part, ident, kind):
            import posixpath
            if part not in self.relationships:
                path = posixpath.join(posixpath.dirname(part), '_rels', posixpath.basename(part) + '.rels')
                result = {}
                if path in self.parts:
                    for rel in xml(self.parts[path]).documentElement.childNodes:
                        if rel.nodeType != rel.ELEMENT_NODE or rel.getAttribute('TargetMode') == 'External':
                            continue
                        target = rel.getAttribute('Target')
                        if '\\' in target or ':' in target:
                            continue
                        resolved = posixpath.normpath(posixpath.join(posixpath.dirname(part), target)) if not target.startswith('/') else target.lstrip('/')
                        if resolved in self.parts and not resolved.startswith('../'):
                            result[rel.getAttribute('Id')] = (resolved, rel.getAttribute('Type'))
                self.relationships[part] = result
            path, rel_type = self.relationships[part].get(ident, ('',''))
            return path if rel_type.endswith('/' + kind) else ''
    
        def picture(self, node):
            drawing = 'http://schemas.openxmlformats.org/drawingml/2006/main'
            word_drawing = 'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing'
            refs = node.getElementsByTagNameNS(drawing, 'blip')
            ident = refs[0].getAttributeNS(R, 'embed') if refs else ''
            if not ident:
                refs = node.getElementsByTagNameNS('urn:schemas-microsoft-com:vml', 'imagedata')
                ident = refs[0].getAttributeNS(R, 'id') if refs else ''
            path = self.relation(self.part, ident, 'image')
            data = self.parts.get(path, b'')
            mime = ('image/png' if data.startswith(b'\x89PNG\r\n\x1a\n') else
                    'image/jpeg' if data.startswith(b'\xff\xd8\xff') else
                    'image/gif' if data.startswith((b'GIF87a', b'GIF89a')) else
                    'image/webp' if data[:4] == b'RIFF' and data[8:12] == b'WEBP' else '')
            if not mime or len(data) > 1024 * 1024:
                return '<span class="image-placeholder">[Image available in original / PDF]</span>'
            extent = node.getElementsByTagNameNS(word_drawing, 'extent')
            css = 'max-width:100%;vertical-align:middle;object-fit:contain'
            if extent:
                width = max(1, self.numeric(extent[0].getAttribute('cx'), 12700, 90))
                height = max(1, self.numeric(extent[0].getAttribute('cy'), 12700, 45))
                css += f';width:{width}pt;height:{height}pt'
            return '<img alt="Template image" style="' + css + '" src="data:' + mime + ';base64,' + base64.b64encode(data).decode('ascii') + '">'
    
        def paragraph(self, node):
            props = first(node, W, 'pPr')
            chain = self.style_chain(val(first(props, W, 'pStyle')) or self.default_style)
            settings = [self.default_p] + [first(s, W, 'pPr') for s in chain] + [props]
            css = [self.run_css(first(s, W, 'rPr')) for s in chain]
            css.append(self.run_css(first(props, W, 'rPr')))
            for setting in settings:
                if setting is None:
                    continue
                align = val(first(setting, W, 'jc'))
                if align in ('left','center','right','both','start','end'):
                    css.append('text-align:' + ('justify' if align == 'both' else align))
                spacing = first(setting, W, 'spacing')
                if spacing is not None:
                    for name, side in [('before','top'),('after','bottom')]:
                        amount = val(spacing, name=name)
                        if amount:
                            css.append(f'margin-{side}:{max(0,self.numeric(amount,20))}pt')
                    line = val(spacing, name='line')
                    if line:
                        rule = val(spacing, name='lineRule', default='auto')
                        if rule == 'auto':
                            css.append(f'line-height:{max(.5,self.numeric(line,240,1))}')
                        else:
                            css.append(f'line-height:{max(1,self.numeric(line,20,12))}pt')
                indent = first(setting, W, 'ind')
                if indent is not None:
                    for side in ('left','right'):
                        amount = val(indent, name=side)
                        if amount:
                            css.append(f'margin-{side}:{self.numeric(amount,20)}pt')
                    if val(indent, name='firstLine'):
                        css.append(f'text-indent:{self.numeric(val(indent,name="firstLine"),20)}pt')
                    if val(indent, name='hanging'):
                        css.append(f'text-indent:{-self.numeric(val(indent,name="hanging"),20)}pt')
                if first(setting, W, 'pageBreakBefore') is not None:
                    css.append('break-before:page')
            # Highlight across runs without dropping the other runs' fonts or styling.
            runs = []
            for run in node.getElementsByTagNameNS(W, 'r'):
                parent = run.parentNode
                while parent is not None and not (parent.namespaceURI == W and parent.localName == 'p'):
                    parent = parent.parentNode
                if parent is node:
                    runs.append(run)
            texts = [t for run in runs for t in children(run, W, 't')]
            whole = ''.join(text(t) for t in texts)
            matches = list(TOKEN.finditer(whole)) if self.interactive else []
            cursor, pieces, field = 0, [], None
            for run in runs:
                value = []
                for child in children(run, W):
                    if child.localName == 't':
                        raw, begin = text(child), cursor
                        cursor += len(raw)
                        pos = begin
                        for match in matches:
                            if match.end() <= begin or match.start() >= cursor:
                                continue
                            start = max(begin, match.start())
                            value.append(escape(raw[pos-begin:start-begin]))
                            if match.start() >= begin:
                                value.append(self.marked(match.group()))
                            pos = min(cursor, match.end())
                        value.append(escape(raw[pos-begin:]))
                        if field is not None and raw:
                            field['value'] = True
                    elif child.localName in ('br','cr'):
                        value.append('<br>')
                    elif child.localName == 'tab':
                        value.append('<span style="display:inline-block;width:2em"></span>')
                    elif child.localName in ('drawing','pict'):
                        value.append(self.picture(child))
                    elif child.localName == 'fldChar':
                        kind = val(child, name='fldCharType')
                        if kind == 'begin':
                            field = {'instruction':'', 'value':False}
                        elif kind == 'end' and field is not None:
                            instruction = field['instruction'].strip().split()
                            if not field['value'] and instruction and instruction[0] in ('PAGE','NUMPAGES'):
                                value.append('<span title="Page numbers are calculated in the exported PDF">' + ('1' if instruction[0] == 'PAGE' else '…') + '</span>')
                            field = None
                    elif child.localName == 'instrText' and field is not None:
                        field['instruction'] += text(child)
                if value:
                    rprops = first(run, W, 'rPr')
                    rchain = self.style_chain(val(first(rprops, W, 'rStyle')))
                    rcss = ';'.join([self.run_css(first(s, W, 'rPr')) for s in rchain] + [self.run_css(rprops)])
                    pieces.append('<span style="' + escape(rcss, quote=True) + '">' + ''.join(value) + '</span>')
            return '<p style="' + escape(';'.join(css), quote=True) + '">' + (''.join(pieces) or '<br>') + '</p>'
    
        def word_body(self, parent):
            result = []
            for node in children(parent, W):
                if node.localName == 'p':
                    result.append(self.paragraph(node))
                elif node.localName == 'tbl':
                    result.append(self.word_table(node))
                elif node.localName in ('sdt','sdtContent','customXml','ins'):
                    result.append(self.word_body(node))
            return ''.join(result)
    
        def border(self, node):
            if node is None or val(node) in ('none','nil','0'):
                return 'none'
            styles = {'double':'double','dotted':'dotted','dashed':'dashed','dashSmallGap':'dashed'}
            color = val(node, name='color')
            color = '#' + color if re.fullmatch(r'[0-9a-fA-F]{6}',color) else '#000'
            return f'{max(.25,self.numeric(val(node,name="sz"),8,.5))}pt {styles.get(val(node),"solid")} {color}'
    
        def word_table(self, table):
            props = first(table, W, 'tblPr')
            chain = self.style_chain(val(first(props, W, 'tblStyle')) or 'TableNormal')
            sources = [first(s,W,'tblPr') for s in chain] + [props]
            borders, margins = {}, {'top':0,'left':5.4,'bottom':0,'right':5.4}
            for source in sources:
                for border in children(first(source,W,'tblBorders'), W) if first(source,W,'tblBorders') is not None else []:
                    borders[border.localName] = border
                cell_margins = first(source,W,'tblCellMar')
                for side in margins:
                    margin = first(cell_margins,W,side)
                    if margin is not None:
                        margins[side] = max(0,self.numeric(val(margin,name='w'),20))
            grid_node = first(table,W,'tblGrid')
            grid = [max(0,self.numeric(val(c,name='w'),20)) for c in children(grid_node,W,'gridCol')] if grid_node is not None else []
            width = first(props,W,'tblW')
            css = ['table-layout:fixed']
            if val(width,name='type') == 'dxa' and self.numeric(val(width,name='w')) > 0:
                css.append(f'width:{self.numeric(val(width,name="w"),20)}pt')
            elif val(width,name='type') == 'pct':
                css.append(f'width:{self.numeric(val(width,name="w"),50,100)}%')
            else:
