    """Durable, owner-scoped PDF exports. Queue, checkpoints and results live in S3."""
    import logging
    import re
    import tempfile
    import time
    import zipfile
    from functools import wraps
    from urllib.parse import quote
    
    from flask import Response, current_app, g, request
    
    from customsso.report_builder import ReportError, dataset, reply
    from customsso.rt_pdf import MAX_PDF, convert_pdf
    from customsso.rt_multi import merge_report
    from customsso.rt_storage import Store, Conflict, Missing
    
    LOG = logging.getLogger("hanas.report_builder.jobs")
    LEASE_SECONDS = 300
    MAX_ATTEMPTS = 3
    
    
    def job_key(store, job_id):
        return f"{store.prefix}/exports/jobs/{store.user}/{job_id}.json"
    
    
    def data_key(store, job_id, name):
        return f"{store.prefix}/exports/data/{store.user}/{job_id}/{name}"
    
    
    def public(job):
        result = {key:job[key] for key in ("id", "name", "state", "created", "updated", "expires",
                  "completed", "report_count", "row_count", "error")}
        if time.time() >= job["expires"]:
            result["state"] = "expired"
        return result
    
    
    def load_job(store, job_id):
        from customsso.report_workflow import identifier
        job, etag = store.get_json(job_key(store, identifier(job_id)))
        if job.get("owner_id") != g.user.id:
            raise ReportError("Export not found in your account.")
        return job, etag
    
    
    def check_access(store, job):
        from customsso.report_workflow import load_record, scope
        if time.time() >= job["expires"]:
            raise ReportError("This export has expired. Create a new export from the report.")
        load_record(store, "reports", job["report_id"])
        if scope(dataset(job["dataset"])) != job["scope"]:
            raise ReportError("Data permissions or the dataset changed. Create a new export.")
    
    
    def register_routes(bp, api, protected):
        from customsso.report_workflow import body, identifier, load_record, scope
    
        def background_enabled(fn):
            @protected
            @wraps(fn)
            def guarded(*args, **kwargs):
                if not current_app.config.get("REPORT_BUILDER_BACKGROUND_EXPORTS", False):
                    return reply({"message":"Background exports are disabled. Use direct export from the report."}, 404)
                return fn(*args, **kwargs)
            return guarded
    
        @bp.post(api + "/exports")
        @background_enabled
        def enqueue():
            payload, store = body(), Store()
            # The prepared snapshot ID is also the idempotency key. A lost response
            # can be retried without creating another job or resetting its progress.
            job_id = identifier(payload.get("snapshot_id"))
            try:
                existing, _ = load_job(store, job_id)
            except Missing:
                existing = None
            if existing:
                return reply(public(existing))
            snapshot, _ = store.get_json(store.snapshot_key(job_id))
            if (snapshot.get("purpose") != "export" or snapshot.get("owner_id") != g.user.id
                    or time.time() - snapshot.get("created", 0) > 1800):
                raise ReportError("The data snapshot expired. Reload the table and export again.")
            record, _ = load_record(store, "reports", snapshot["report_id"])
            definition = snapshot["definition"]
            if scope(dataset(definition["dataset"])) != snapshot["scope"]:
                raise ReportError("Data permissions changed. Reload the table.")
            # Copy the input out of the short-lived snapshots prefix BEFORE publishing
            # the job. A worker can never claim a job whose input is not yet durable.
            try:
                store.put_json(data_key(store, job_id, "input.json"), snapshot, create=True)
            except Conflict:
                pass  # Immutable input from an earlier attempt with this same ID.
            created = time.time()
            hours = min(168, max(1, int(current_app.config.get("REPORT_BUILDER_EXPORT_TTL_HOURS", 24))))
            job = {"id":job_id, "owner_id":g.user.id, "report_id":record["id"], "name":record["name"],
                   "dataset":definition["dataset"], "scope":snapshot["scope"], "state":"queued",
                   "created":created, "updated":created, "expires":created + hours * 3600,
                   "completed":0, "report_count":len(snapshot["groups"]), "row_count":len(snapshot["rows"]),
                   "bytes":0, "attempts":0, "lease_until":0, "next_try":0, "error":""}
            try:
                store.put_json(job_key(store, job_id), job, create=True)
            except Conflict:
                job, _ = load_job(store, job_id)
            return reply(public(job), 202)
    
        @bp.get(api + "/exports")
        @background_enabled
        def exports():
            store, jobs = Store(), []
            for key in store.keys(f"{store.prefix}/exports/jobs/{store.user}/"):
                if not key.endswith(".json"):
                    continue
                try:
                    job, _ = store.get_json(key)
                except Missing:
                    continue  # Lifecycle may remove an object during listing.
                if job.get("owner_id") == g.user.id:
                    jobs.append(public(job))
            return reply({"result":sorted(jobs, key=lambda job:job["created"], reverse=True)[:100]})
    
        @bp.get(api + "/exports/<job_id>")
        @background_enabled
        def status(job_id):
            job, _ = load_job(Store(), job_id)
            return reply(public(job))
    
        @bp.post(api + "/exports/<job_id>/retry")
        @background_enabled
        def retry(job_id):
            store = Store()
            job, etag = load_job(store, job_id)
            check_access(store, job)
            if job["state"] == "failed":
                job.update(state="queued", error="", attempts=0, next_try=0, updated=time.time())
                store.put_json(job_key(store, job["id"]), job, etag=etag)
            return reply(public(job))
    
        @bp.get(api + "/exports/<job_id>/download")
        @background_enabled
        def download(job_id):
            store = Store()
            job, _ = load_job(store, job_id)
            check_access(store, job)
            if job["state"] != "ready":
                raise ReportError("The export is not ready yet. Check Export history.")
            extension = "pdf" if job["report_count"] == 1 else "zip"
            headers = {"Accept-Encoding":"identity"}
