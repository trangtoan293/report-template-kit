      function autoMapping() {
        const exact=new Set(state.columns.map(c=>c.name)),lower=new Map();
        for(const c of state.columns) {
          const key=c.name.trim().toLocaleLowerCase();lower.set(key,[...(lower.get(key)||[]),c.name]);
        }
        const result={};
        for(const key of state.template.variables) {
          const candidates=lower.get(key.trim().toLocaleLowerCase())||[];
          const column=exact.has(key)?key:candidates.length===1?candidates[0]:null;
          result[key]=column!==null?{column}:{blank:true};
        }
        return result;
      }
      function fitPreview(frame) {
