        return fingerprint({"user":g.user.id, "username":g.user.username,
                            "roles":sorted(r.name for r in g.user.roles),
                            "rls":security_manager.get_rls_cache_key(ds),
                            "changed":str(ds.changed_on), "sql":ds.sql})
    
    
    def query_rows(definition, limit):
        from superset.charts.schemas import ChartDataQueryContextSchema
        from superset.commands.chart.data.get_data_command import ChartDataCommand
        columns = list(dict.fromkeys([item["column"] for item in definition["mapping"].values() if "column" in item]
                                    + expression_columns(definition["mapping"])
                                    + definition["display_columns"] + [definition["order"]]
                                    + definition.get("group_by", [])
                                    + [r["filter_column"] for r in definition.get("repeat_rows", []) if r.get("filter_column")]))
        query = {"columns":columns, "metrics":None, "row_limit":limit, "row_offset":0,
                 "time_range":"No filter", "is_timeseries":False,
                 "filters":[{"col":f["field"], "op":f["op"], "val":f["value"]} for f in definition["filters"]],
                 "orderby":[[definition["order"], not definition["descending"]]], "extras":{}}
        context = ChartDataQueryContextSchema().load({"datasource":{"id":definition["dataset"], "type":"table"},
            "queries":[query], "result_format":"json", "result_type":"full", "force":True, "custom_cache_timeout":-1})
        command = ChartDataCommand(context)
        command.validate()
        result = command.run()["queries"][0]
        if result.get("error") or not isinstance(result.get("data"), list):
            raise ReportError("Unable to read dataset data. Check the filters and connection.")
