      function combinedZip(buffers) {
        const files=[],directory=[];let total=0,count=0,dirSize=0;
        for(const buffer of buffers) {
          const view=new DataView(buffer),bytes=new Uint8Array(buffer),end=bytes.length-22;
          if(end<0||view.getUint32(end,true)!==0x06054b50)throw new Error('An export batch is invalid. No file was downloaded.');
          const offset=view.getUint32(end+16,true),size=view.getUint32(end+12,true),entries=view.getUint16(end+10,true);
          if(offset+size!==end)throw new Error('Unsupported ZIP structure.');
          files.push(bytes.subarray(0,offset));let cursor=offset;
          for(let i=0;i<entries;i++) {
            if(view.getUint32(cursor,true)!==0x02014b50)throw new Error('Invalid ZIP directory.');
            const length=46+view.getUint16(cursor+28,true)+view.getUint16(cursor+30,true)+view.getUint16(cursor+32,true);
            const entry=bytes.slice(cursor,cursor+length),entryView=new DataView(entry.buffer);
            entryView.setUint32(42,view.getUint32(cursor+42,true)+total,true);directory.push(entry);dirSize+=length;cursor+=length;
          }
          if(cursor!==end)throw new Error('Incomplete ZIP directory.');
          total+=offset;count+=entries;
        }
        if(count>65535)throw new Error('The number of files exceeds the ZIP limit.');
        const end=new Uint8Array(22),view=new DataView(end.buffer);
        view.setUint32(0,0x06054b50,true);view.setUint16(8,count,true);view.setUint16(10,count,true);
        view.setUint32(12,dirSize,true);view.setUint32(16,total,true);
        return new Blob([...files,...directory,end],{type:'application/zip'});
      }
      async function exportDirectRows(all) {
        const ex=state.export;
        exportController=new AbortController();
        const signal=exportController.signal;
        byId('rt-export-body').inert=true;byId('rt-export-cancel').hidden=false;
        byId('rt-export-all').disabled=true;byId('rt-export-selected').disabled=true;
        try {
          if(all)await loadRows('all',signal);
          if(!ex.snapshot)throw new Error('Apply filters to load data first.');
          const indices=all?ex.snapshot.rows.map((_,i)=>i):[...ex.selected].sort((a,b)=>a-b);
          if(!indices.length)throw new Error('Select at least one row.');
          byId('rt-export-progress').textContent='Preparing report groups…';
          const plan=await api('/export-plan','POST',{snapshot_id:ex.snapshot.snapshot_id,indices},false,signal);
          let size=0;const parts=[];
          for(let index=0;index<plan.report_count;index++) {
            if(signal.aborted)throw new DOMException('Canceled','AbortError');
            byId('rt-export-progress').textContent=`Generating PDF ${index+1} / ${plan.report_count}…`;
            const part=await api('/export','POST',{snapshot_id:plan.snapshot_id,indices:[index],single_pdf:plan.report_count===1},true,signal);
            size+=part.byteLength;
            if(size>cfg.maxArchiveMB*1024*1024)throw new Error(`The export exceeds ${cfg.maxArchiveMB} MB. Select fewer rows; no incomplete file was downloaded.`);
            parts.push(part);
          }
          if(signal.aborted)throw new DOMException('Canceled','AbortError');
          const single=plan.report_count===1;
          const blob=single?new Blob(parts,{type:'application/pdf'}):combinedZip(parts);
          const saveButton=document.createElement('button');saveButton.type='button';saveButton.className='primary';
          saveButton.textContent=single?'Save PDF…':'Save ZIP…';
          saveButton.onclick=()=>task('Saving report…',async()=>toast(await downloadFile(blob,window.__hanasReportFiles.name(ex.report.name,single?'pdf':'zip'))));
          byId('rt-export-progress').replaceChildren(document.createTextNode('Export ready. Choose where to save the file. '),saveButton);
          toast(`Created ${plan.report_count} PDF${single?'':'s'} from ${plan.row_count} data rows.`);
        } catch(error) {
          byId('rt-export-progress').textContent=error.name==='AbortError'?'Export canceled.':error.message;
          throw error;
        } finally {
          exportController=null;byId('rt-export-body').inert=false;byId('rt-export-cancel').hidden=true;byId('rt-export-all').disabled=false;renderRows();
        }
      }
      function exportRows(all) {
