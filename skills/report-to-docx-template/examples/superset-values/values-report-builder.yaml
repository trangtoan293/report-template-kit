          <hr><details id="rt-drag-columns"><summary>Drag columns (optional)</summary><h3 id="rt-column-title">Select a dataset</h3><input id="rt-column-search" type="search" placeholder="Search columns…" aria-label="Search columns"><div id="rt-columns" class="columns"></div><p class="form-help">Drag a column onto a highlighted variable, or select a column in the mapping panel.</p></details></aside>
          <section class="document-area">${state.template.deleted?'<p class="preview-note">This template was removed from the Template list. Its original file is retained, so this saved report can still be edited and exported.</p>':''}<div class="hint"><span>Template preview · drag columns onto variables</span><span class="preview-tools"><select id="rt-preview-scale" aria-label="Template preview zoom"><option value="fit">Fit width</option><option value="actual">100%</option></select><a href="${cfg.api}/templates/${state.template.id}/download">Download original</a></span></div><iframe id="rt-document" title="Report template" sandbox="allow-same-origin"></iframe></section>
