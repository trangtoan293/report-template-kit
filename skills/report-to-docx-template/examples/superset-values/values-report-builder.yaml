            if payload.get('etag') != etag:
                raise Conflict('The template changed. Refresh the list and try again.')
            enabled = payload.get('published')
            if type(enabled) is not bool:
                raise ReportError('Choose Publish or Unpublish.')
            if enabled:
                if record['extension'] != 'docx' or 'dashboard' not in office.variables:
                    raise ReportError('Only a DOCX template with {#dashboard#} can be published for dashboard exports.')
                from customsso.dr_docx import slot
                from customsso.dr_errors import ExportError
                try:
                    slot(office)
                except ExportError as error:
                    raise ReportError(str(error)) from error
            previous, publication_etag = publication(store, template_id)
            if payload.get('publication_etag') != publication_etag:
                raise Conflict('Publication changed. Refresh the list and try again.')
            if previous and previous.get('owner_id') != g.user.id:
                raise ReportError('You can only publish your own templates.')
            entry = {'id':record['id'], 'owner_id':g.user.id, 'sha256':record['sha256'],
                     'published':enabled, 'updated_at':now(),
                     'publication_id':previous['publication_id'] if previous and previous.get('published') == enabled else str(uuid4())}
            new_etag = store.put_json(publication_key(store, template_id), entry,
                                      etag=publication_etag, create=publication_etag is None)
            return reply({'published':enabled, 'publication_etag':new_etag})
    
        @bp.post(api + "/templates")
        @protected
        def upload():
            if not request.content_length or request.content_length > MAX_FILE + 512000:
                raise ReportError("Uploads must not exceed 10 MB.")
            uploaded = request.files.get("file")
            if uploaded is None:
                raise ReportError("Select a Word .docx or Excel .xlsx file.")
            filename = (uploaded.filename or "").replace("\\", "/").rsplit("/",1)[-1]
            filename = label(filename)
            extension = filename.rsplit(".",1)[-1].lower()
            data = uploaded.stream.read(MAX_FILE + 1)
            office = OfficeTemplate(data, extension)
            name = label(request.form.get("name") or filename.rsplit(".",1)[0])
            store, item_id = Store(), str(uuid4())
            record = {"schema_version":2, "id":item_id, "owner_id":g.user.id, "name":name,
                      "filename":filename, "extension":extension, "variables":office.variables,
                      "sha256":hashlib.sha256(data).hexdigest(), "created_at":now(), "updated_at":now(), "deleted":False}
            store.put(store.user_key("files", item_id, extension), data, MIMES[extension], create=True)
            etag = store.put_json(store.user_key("templates", item_id), record, create=True)
            return reply({**record, "etag":etag}, 201)
    
        @bp.get(api + "/templates/<template_id>")
        @protected
        def get_template(template_id):
            template, office, etag = load_template(Store(), template_id)
            return reply({**template, "etag":etag, "html":office.preview(), **layout_metadata(office)})
    
        @bp.get(api + "/templates/<template_id>/download")
        @protected
        def download_template(template_id):
            template, office, _ = load_template(Store(), template_id, True)
            return Response(office.data, mimetype=MIMES[template["extension"]],
                            headers={"Cache-Control":"no-store", "Content-Disposition":f'attachment; filename="template-{template["id"]}.{template["extension"]}"'})
    
        @bp.get(api + "/reports")
        @protected
        def reports():
            return reply({"result":Store().listing("reports")})
    
        @bp.get(api + "/reports/<report_id>")
        @protected
        def get_report(report_id):
            store = Store()
            record, etag = load_record(store, "reports", report_id)
            if record.get("source") == "dashboard":
                raise ReportError("This is a dashboard report. Refresh the Report list and choose Edit report or Export reports to open the dashboard report editor.")
            dataset(record["dataset"])
            template, office, _ = load_template(store, record["template_id"], True)
            return reply({"report":{**record, "etag":etag}, "template":{**template, "html":office.preview(), **layout_metadata(office)}})
    
        @bp.delete(api + "/<kind>/<record_id>")
        @protected
        def archive_record(kind, record_id):
            if kind not in ("templates", "reports"):
                return reply({"message":"Not found"}, 404)
            store, payload = Store(), body()
            record, etag = load_record(store, kind, record_id)
            if payload.get("etag") != etag:
                raise Conflict("This item has changed. Reload it before deleting.")
            record.update(deleted=True, updated_at=now())
            store.put_json(store.user_key(kind, record["id"]), record, etag=etag)
            return reply({"deleted":True})
    
        @bp.post(api + "/preview")
        @protected
        def preview():
            payload, store = body(), Store()
            existing, _ = load_record(store, "reports", payload["id"]) if payload.get("id") else (None, None)
            allow_deleted = bool(existing and existing["template_id"] == payload.get("template_id"))
            definition, ds = normalized(payload, store, allow_deleted)
            rows = query_rows(definition, 6)
            has_more = len(rows) > 5
            rows = rows[:5]
            if not rows:
                raise ReportError("No matching rows. Adjust the filters before previewing.")
            template, office, _ = load_template(store, definition["template_id"], allow_deleted)
            report_groups = group_indices(definition, rows)
            limit = int(current_app.config.get("REPORT_BUILDER_MAX_ROWS_PER_REPORT", 2000))
            pages = [preview_report(office, definition, [rows[i] for i in group], limit) for group in report_groups]
            labels = [f"Report {i+1} ({len(group)} rows)" if definition["report_mode"] == "multi_row" else f"Row {group[0]+1}"
                      for i, group in enumerate(report_groups)]
            if sum(len(item.encode()) for item in pages) > 8000000:
                raise ReportError("The preview is too large. Use a smaller template.")
            # A PDF preview uses exactly the rows shown here, even if source data
            # changes before the user asks to download one of the five previews.
            snapshot_id = str(uuid4())
            snapshot = {"purpose":"preview", "owner_id":g.user.id, "created":time.time(),
                        "scope":scope(ds), "definition":definition, "rows":rows, "groups":report_groups}
            from superset.utils import json as superset_json
            raw = superset_json.dumps(snapshot).encode()
            if len(raw) > 20 * 1024 * 1024:
                raise ReportError("Preview data exceeds 20 MB. Reduce the selected columns.")
            store.put(store.snapshot_key(snapshot_id), raw, "application/json", create=True)
            token = signer().dumps({"owner":g.user.id, "definition":fingerprint(definition), "scope":scope(ds)})
            return reply({"documents":pages, "count":len(rows), "labels":labels, "has_more":has_more,
                          "report_count":len(report_groups), "preview_token":token, "snapshot_id":snapshot_id})
    
        @bp.post(api + "/preview-pdf")
        @protected
        def preview_pdf():
            payload, store = body(), Store()
            snapshot, _ = store.get_json(store.snapshot_key(identifier(payload.get("snapshot_id"))))
            if snapshot.get("purpose") != "preview" or snapshot.get("owner_id") != g.user.id or time.time()-snapshot.get("created",0) > 1800:
                raise ReportError("The preview has expired. Preview the first 5 rows again.")
            definition = snapshot["definition"]
            ds = dataset(definition["dataset"])
            if scope(ds) != snapshot["scope"]:
                raise ReportError("The dataset or access permissions have changed. Preview again.")
            report_groups = snapshot.get("groups") or [[i] for i in range(len(snapshot["rows"]))]
            index = integer(payload.get("index"), 0, len(report_groups)-1, "Preview report")
            template, office, _ = load_template(store, definition["template_id"], True)
            if template["sha256"] != definition["template_sha256"]:
                raise ReportError("The template has changed. Reopen and preview the report again.")
            document = merge_report(office, definition, [snapshot["rows"][i] for i in report_groups[index]],
                                    int(current_app.config.get("REPORT_BUILDER_MAX_ROWS_PER_REPORT", 2000)))
            content = convert_pdf(document, template["extension"])
            return Response(content, mimetype="application/pdf", headers={"Cache-Control":"no-store",
                            "X-Content-Type-Options":"nosniff",
                            "Content-Disposition":f'attachment; filename="report-preview-{index+1}.pdf"'})
    
        @bp.post(api + "/reports")
        @bp.put(api + "/reports/<report_id>")
        @protected
        def save_report(report_id=None):
            payload, store = body(), Store()
            existing, etag = load_record(store, "reports", report_id) if report_id else (None, None)
            definition, ds = normalized(payload, store, bool(existing and existing["template_id"] == payload.get("template_id")))
            if existing and payload.get("etag") != etag:
                raise Conflict("The report has changed. Reopen it or save a copy.")
            try:
                proof = signer().loads(payload.get("preview_token", ""), max_age=1800)
            except (BadSignature, TypeError):
                raise ReportError("Preview the first 5 rows with the current configuration before saving.")
            if proof != {"owner":g.user.id, "definition":fingerprint(definition), "scope":scope(ds)}:
                raise ReportError("Configuration or data permissions have changed. Preview again before saving.")
            item_id = existing["id"] if existing else str(uuid4())
            record = {**definition, "id":item_id, "owner_id":g.user.id, "created_at":existing["created_at"] if existing else now(),
                      "updated_at":now(), "deleted":False}
            new_etag = store.put_json(store.user_key("reports", item_id), record, etag=etag, create=existing is None)
            return reply({**record, "etag":new_etag}, 200 if existing else 201)
    
        @bp.post(api + "/reports/<report_id>/rows")
        @protected
        def rows(report_id):
            payload, store = body(), Store()
            record, _ = load_record(store, "reports", report_id)
            if payload.get("mode") == "all":
                record["filters"] = []
            elif "filters" in payload:
                record["filters"] = payload["filters"]
            definition, ds = normalized(record, store, True)
            cap = min(int(current_app.config.get("REPORT_BUILDER_MAX_EXPORT_ROWS",5000)), int(current_app.config.get("SQL_MAX_ROW",50000))-1)
            if cap < 1:
                raise ReportError("The Superset row limit is too low to export reports.")
            data = query_rows(definition, cap + 1)
            if len(data) > cap:
                raise ReportError(f"Results exceed {cap:,} rows. Narrow your filters or increase REPORT_BUILDER_MAX_EXPORT_ROWS; no rows have been exported.")
            if not data:
                raise ReportError("No data matches the filters.")
            snap_id = str(uuid4())
            snapshot = {"id":snap_id, "owner_id":g.user.id, "report_id":record["id"], "created":time.time(),
                        "scope":scope(ds), "definition":definition, "rows":data}
            from superset.utils import json as superset_json
            raw = superset_json.dumps(snapshot).encode()
            if len(raw) > 20 * 1024 * 1024:
                raise ReportError("Data exceeds 20 MB. Narrow your filters or select fewer display columns.")
            store.put(store.snapshot_key(snap_id), raw, "application/json", create=True)
            return reply({"snapshot_id":snap_id, "expires_in":1800, "rows":data,
                          "columns":definition["display_columns"], "count":len(data), "mode":payload.get("mode", "filtered")})
    
        @bp.post(api + "/export-plan")
        @protected
        def export_plan():
            payload, store = body(), Store()
            snapshot, _ = store.get_json(store.snapshot_key(identifier(payload.get("snapshot_id"))))
            if snapshot.get("purpose") in ("preview", "export") or snapshot.get("owner_id") != g.user.id or time.time()-snapshot.get("created",0) > 1800:
                raise ReportError("The data snapshot has expired. Reload the table before exporting.")
            load_record(store, "reports", snapshot["report_id"])
            definition = snapshot["definition"]
            ds = dataset(definition["dataset"])
            if scope(ds) != snapshot["scope"]:
                raise ReportError("The dataset or access permissions have changed. Reload the data.")
            indices = payload.get("indices")
            if not isinstance(indices, list) or not 1 <= len(indices) <= len(snapshot["rows"]):
                raise ReportError("Select one or more data rows before exporting.")
            for index in indices:
                integer(index, 0, len(snapshot["rows"])-1, "Selected row")
            if len(set(indices)) != len(indices):
                raise ReportError("The row selection contains duplicates.")
            # Preserve the dataset sort order, including duplicate source records.
            selected = [snapshot["rows"][i] for i in sorted(indices)]
            report_groups = group_indices(definition, selected)
            template, office, _ = load_template(store, definition["template_id"], True)
            if template["sha256"] != definition["template_sha256"]:
                raise ReportError("The template has changed. Reopen and preview the report again.")
            if definition.get("report_mode") == "multi_row":
                limit = int(current_app.config.get("REPORT_BUILDER_MAX_ROWS_PER_REPORT", 2000))
                for group in report_groups:
                    prepare_report(office, definition, [selected[i] for i in group], limit)
            snap_id = str(uuid4())
            prepared = {**snapshot, "id":snap_id, "purpose":"export", "rows":selected, "groups":report_groups}
            # Do not refresh the source expiry when creating a plan.
            from superset.utils import json as superset_json
            raw = superset_json.dumps(prepared).encode()
            if len(raw) > 20 * 1024 * 1024:
                raise ReportError("The export plan exceeds 20 MB. Select fewer rows.")
            store.put(store.snapshot_key(snap_id), raw, "application/json", create=True)
            return reply({"snapshot_id":snap_id, "report_count":len(report_groups), "row_count":len(selected)})
    
        @bp.post(api + "/export")
        @protected
        def export():
            payload, store = body(), Store()
            snapshot, _ = store.get_json(store.snapshot_key(identifier(payload.get("snapshot_id"))))
            if snapshot.get("purpose") == "preview" or snapshot.get("owner_id") != g.user.id or time.time()-snapshot.get("created",0) > 1800:
                raise ReportError("The data snapshot has expired. Reload the table before exporting.")
            load_record(store, "reports", snapshot["report_id"])
            definition = snapshot["definition"]
            ds = dataset(definition["dataset"])
            if scope(ds) != snapshot["scope"]:
                raise ReportError("The dataset or access permissions have changed. Reload the data.")
            indices = payload.get("indices")
            if not isinstance(indices, list) or len(indices) != 1:
                raise ReportError("Each PDF export request must contain exactly one report.")
            if definition.get("report_mode") == "multi_row" and snapshot.get("purpose") != "export":
                raise ReportError("Prepare an export plan before exporting multiple data rows.")
            report_groups = snapshot.get("groups") or [[i] for i in range(len(snapshot["rows"]))]
            for index in indices:
                integer(index, 0, len(report_groups)-1, "Selected report")
            template, office, _ = load_template(store, definition["template_id"], True)
            if template["sha256"] != definition["template_sha256"]:
                raise ReportError("The template has changed. Reopen and preview the report again.")
            stream, total = io.BytesIO(), 0
            # ZIP_STORED lets the browser combine small completed batches without
            # decompressing PDFs or requiring a CDN ZIP library.
            with zipfile.ZipFile(stream, "w", zipfile.ZIP_STORED, allowZip64=False) as archive:
                for index in indices:
                    content = merge_report(office, definition, [snapshot["rows"][i] for i in report_groups[index]],
                                           int(current_app.config.get("REPORT_BUILDER_MAX_ROWS_PER_REPORT", 2000)))
                    content = convert_pdf(content, template["extension"])
                    if payload.get("single_pdf") is True:
                        return Response(content, mimetype="application/pdf", headers={"Cache-Control":"no-store",
                                        "X-Content-Type-Options":"nosniff",
                                        "Content-Disposition":f'attachment; filename="report-{index+1:06d}.pdf"'})
                    total += len(content)
                    if total > 40 * 1024 * 1024:
                        raise ReportError("The export batch exceeds 40 MB. Reduce the template size.")
                    archive.writestr(f"report-{index+1:06d}.pdf", content)
            return Response(stream.getvalue(), mimetype="application/zip", headers={"Cache-Control":"no-store",
                             "Content-Disposition":'attachment; filename="reports-part.zip"'})
    
        @bp.after_app_request
        def menu(response):
            if response.status_code != 200 or response.mimetype != "text/html" or response.direct_passthrough or response.is_streamed:
                return response
            if not current_app.config.get("REPORT_BUILDER_ENABLED", True):
                return response
            try:
                user = identity()
                if user is None:
                    return response
                data, encode = response.get_data(), lambda value:value
                encoding = response.headers.get("Content-Encoding", "").lower()
                if encoding == "gzip":
                    data, encode = gzip.decompress(data), gzip.compress
                elif encoding in ("deflate", "zlib"):
                    data, encode = zlib.decompress(data), zlib.compress
                elif encoding == "br":
                    import brotli
                    data, encode = brotli.decompress(data), brotli.compress
                elif encoding == "zstd":
                    import zstandard
                    data, encode = zstandard.ZstdDecompressor().decompressobj().decompress(data), zstandard.ZstdCompressor().compress
                elif encoding not in ("", "identity"):
                    return response
                html = data.decode("utf-8")
                pattern = re.compile(r'(data-bootstrap=)([\"\'])(.*?)(\2)', re.S)
                prefix = request.script_root or ""
                def insert(match):
                    boot = json.loads(unescape(match.group(3)))
                    menu_data = boot.get("common", {}).get("menu_data")
                    if not menu_data or not isinstance(menu_data.get("menu"), list):
                        return match.group()
                    menu_data["menu"] = report_menu_items(menu_data["menu"], prefix)
                    return match.group(1) + match.group(2) + escape(json.dumps(boot, ensure_ascii=False), quote=True) + match.group(2)
                updated, count = pattern.subn(insert, html, count=1)
                if count:
                    response.set_data(encode(updated.encode("utf-8")))
                    response.headers['Cache-Control'] = 'private, no-store'
                    response.headers.pop("ETag", None)
                    response.headers.pop("Content-MD5", None)
            except Exception:
                LOG.exception("Could not add Template/Report menu")
            return response
    
        return bp
