          errorBox.hidden=true;dialog.setAttribute('aria-busy','true');
          for(const button of dialog.querySelectorAll('button'))button.disabled=true;
          try {
            await api(`/${item.kind}/${encodeURIComponent(item.id)}`,'DELETE',{etag:item.etag});
            state[item.kind]=state[item.kind].filter(value=>value.id!==item.id);
            dialog.close();renderList();toast(`${item.kind==='templates'?'Template':'Report'} deleted.`);
          } catch(error) {
            errorBox.textContent=error.message;errorBox.hidden=false;
            byId('rt-status').className='';
          } finally {
            dialog.removeAttribute('aria-busy');
            for(const button of dialog.querySelectorAll('button'))button.disabled=false;
          }
        });
      }
      function draft() {
        return {name:state.name,template_id:state.template.id,dataset:state.dataset,mapping:state.mapping,filters:state.filters,
          order:state.order,descending:state.descending,display_columns:state.displayColumns,
          report_mode:state.reportMode,group_by:state.groupBy,repeat_rows:state.repeatRows,
          ...(state.report?{id:state.report.id,etag:state.report.etag}:{}),preview_token:state.previewToken};
      }
      function changed() {
        state.dirty=true;state.previewToken=null;
