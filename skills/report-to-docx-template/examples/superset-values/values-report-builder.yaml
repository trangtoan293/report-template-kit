      }
      function openDelete(kind,id) {
        const item=state[kind].find(value=>value.id===id);if(!item||busy)return;
        pendingDelete={kind,id:item.id,name:item.name,etag:item.etag};
        const noun=kind==='templates'?'template':'report';
        byId('rt-delete-title').textContent=`Delete ${noun}?`;
        byId('rt-delete-message').textContent=`Remove “${item.name}” from the ${kind==='templates'?'Template':'Report'} list?`;
        byId('rt-delete-note').textContent=kind==='templates'?'Saved dataset reports retain this template. Dashboard reports will require choosing an active template and previewing again.':'';
        byId('rt-delete-error').hidden=true;byId('rt-delete-error').textContent='';
        byId('rt-delete-confirm').textContent=`Delete ${noun}`;
        for(const menu of document.querySelectorAll('details.actions[open]'))menu.open=false;
        byId('rt-delete').showModal();
      }
      async function deleteConfirmed() {
        if(busy||!pendingDelete)return;
        const item=pendingDelete,dialog=byId('rt-delete'),errorBox=byId('rt-delete-error');
