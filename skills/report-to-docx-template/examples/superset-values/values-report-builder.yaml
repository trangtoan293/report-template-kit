        if(close){byId(close.dataset.close).close();return;}
        const tab=event.target.closest('[data-preview-index]');
        if(tab){state.previewIndex=Number(tab.dataset.previewIndex);byId('rt-review-frame').srcdoc=state.previews[state.previewIndex];for(const b of byId('rt-review-tabs').children)b.classList.toggle('active',b===tab);return;}
        const target=event.target.closest('[data-action]');
