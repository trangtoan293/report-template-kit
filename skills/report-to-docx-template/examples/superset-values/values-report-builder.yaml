    def report_menu_items(items, prefix):
        """Use the same report entries in the SPA and server-rendered navigation."""
        items = [item for item in items if isinstance(item, dict)
                 and item.get("name") not in ("Report Templates", "Dataset Reports")]
        if not is_report_admin():
            return items
        roles = current_app.config.get('REPORT_BUILDER_ALLOWED_ROLES')
        if roles is not None and not set(roles).intersection(r.name for r in identity().roles):
            return items
        position = next((i+1 for i, item in enumerate(items) if item.get("name") == "Charts"), len(items))
        items[position:position] = [
            {"name":"Report Templates", "label":"Template", "url":prefix+"/report-templates/"},
            {"name":"Dataset Reports", "label":"Report", "url":prefix+"/reports/"},
        ]
        return items
    
    
    def navigation_url(value, prefix):
        if not isinstance(value, str):
            return None
        if value.startswith(("https://", "http://")):
            return value
        if not value.startswith("/") or value.startswith("//"):
            return None
        if prefix and value != prefix and not value.startswith(prefix + "/"):
            return prefix + value
        return value
    
    
    def protected(fn):
        @authorized
        @wraps(fn)
        def guarded(*args, **kwargs):
            try:
                return fn(*args, **kwargs)
            except OfficeError as ex:
                return reply({"message":str(ex)}, 400)
            except Conflict as ex:
                return reply({"message":str(ex)}, 409)
        return guarded
    
    
    def identifier(value):
        try:
            return str(UUID(str(value)))
        except (ValueError, TypeError, AttributeError):
            raise ReportError("Invalid template or report ID.")
    
    
    def now():
        return datetime.now(timezone.utc).isoformat()
    
    
    def label(value, limit=200):
        if not isinstance(value, str) or not value.strip() or len(value) > limit:
            raise ReportError(f"Name must contain between 1 and {limit} characters.")
        return value.strip()
    
    
    def body():
        if request.content_length and request.content_length > 300000:
            raise ReportError("Report configuration exceeds 300 KB.")
        raw = request.stream.read(300001)
        if len(raw) > 300000:
            raise ReportError("Report configuration exceeds 300 KB.")
        try:
            value = json.loads(raw)
        except (ValueError, UnicodeDecodeError):
            raise ReportError("Invalid JSON data.")
        if not isinstance(value, dict):
            raise ReportError("Report configuration must be an object.")
        return value
    
    
    def load_record(store, kind, record_id, allow_deleted=False):
        record, etag = store.get_json(store.user_key(kind, identifier(record_id)))
        if record.get("owner_id") != g.user.id or (record.get("deleted") and not allow_deleted):
            raise ReportError("This item was not found in your account.")
        return record, etag
    
    
    def load_template(store, template_id, allow_deleted=False):
        template, etag = load_record(store, "templates", template_id, allow_deleted)
        data, _ = store.get(store.user_key("files", template["id"], template["extension"]), limit=MAX_FILE)
        if hashlib.sha256(data).hexdigest() != template["sha256"]:
            raise ReportError("The template file in S3 has changed. Upload it as a new template.")
        return template, OfficeTemplate(data, template["extension"]), etag
    
    
    def publication_key(store, template_id):
        return f'{store.prefix}/published-dashboard-templates/{identifier(template_id)}.json'
    
    
    def publication(store, template_id):
        try:
            return store.get_json(publication_key(store, template_id))
        except Missing:
            return None, None
    
    
    def published_record(store, template_id, publication_id=None):
        """Resolve only a published template, never an arbitrary user's file path."""
        from superset import security_manager
        entry, _ = publication(store, template_id)
        if (not entry or entry.get('published') is not True or entry.get('id') != template_id
                or publication_id is not None and entry.get('publication_id') != publication_id):
            raise ReportError('This template is no longer published. Choose an available template and export again.')
        owner_id = entry.get('owner_id')
        if type(owner_id) is not int or not is_report_admin(security_manager.get_user_by_id(owner_id)):
            raise ReportError('The template publisher is no longer an active Superset Admin.')
        owner_store = Store(user_id=owner_id)
        record, _ = owner_store.get_json(owner_store.user_key('templates', identifier(template_id)))
        if (record.get('deleted') or record.get('owner_id') != owner_id or record.get('id') != template_id
                or record.get('sha256') != entry.get('sha256') or record.get('extension') != 'docx'
                or 'dashboard' not in record.get('variables', [])):
            raise ReportError('The published template has changed or was removed. Choose another template.')
        return record, entry, owner_store
    
    
    def published_templates(store):
        result = []
        prefix = f'{store.prefix}/published-dashboard-templates/'
        for key in store.keys(prefix):
            if not key.endswith('.json'):
                continue
            template_id = key[len(prefix):-5]
            try:
                record, _, _ = published_record(store, template_id)
            except (Missing, ReportError) as error:
                # Storage/network failures must remain visible instead of hiding templates.
                from customsso.rt_storage import StoreError
                if isinstance(error, StoreError) and not isinstance(error, Missing):
                    raise
                continue
            result.append(record)
        return sorted(result, key=lambda item:(item['name'].casefold(), item['id']))
    
    
    def load_published_template(store, template_id, publication_id=None):
        record, entry, owner_store = published_record(store, template_id, publication_id)
        data, _ = owner_store.get(owner_store.user_key('files', record['id'], 'docx'), limit=MAX_FILE)
        if hashlib.sha256(data).hexdigest() != record['sha256']:
            raise ReportError('The published template file has changed. Ask an Admin to publish a new template.')
        return record, OfficeTemplate(data, 'docx'), entry['publication_id']
    
    
    def auto_mapping(variables, columns):
        names = {c.column_name for c in columns}
        lookup = {}
        for name in names:
            lookup.setdefault(name.strip().casefold(), []).append(name)
        result = {}
        for variable in variables:
            candidates = lookup.get(variable.strip().casefold(), [])
            column = variable if variable in names else candidates[0] if len(candidates) == 1 else None
            result[variable] = {"column":column} if column is not None else {"blank":True}
        return result
    
    
    def normalized(payload, store, allow_deleted=False):
        name = label(payload.get("name"))
        template, _ = load_record(store, "templates", payload.get("template_id"), allow_deleted)
        ds_id = integer(payload.get("dataset"), 1, 2147483647, "Dataset")
        ds = dataset(ds_id)
        names = {c.column_name for c in ds.columns}
        mapping = auto_mapping(template["variables"], ds.columns)
        raw = payload.get("mapping", {})
        if not isinstance(raw, dict):
            raise ReportError("Invalid variable mapping.")
        for variable in template["variables"]:
            if variable not in raw:
                continue
            item = raw[variable]
            if not isinstance(item, dict):
                raise ReportError("Select a column or Leave blank for each variable.")
            if item.get("blank") is True:
                mapping[variable] = {"blank":True}
            elif isinstance(item.get("column"), str) and item["column"] in names:
                mapping[variable] = {"column":item["column"]}
            else:
                raise ReportError(f"No valid column is mapped to variable {variable}.")
        multi = normalize_multi(payload, names, template["extension"], mapping)
        if multi["report_mode"] == "multi_row":
            _, office, _ = load_template(store, template["id"], allow_deleted)
            validate_layout(office, multi["repeat_rows"])
        filters = payload.get("filters", [])
        if not isinstance(filters, list) or len(filters) > 20:
            raise ReportError("A report can have up to 20 filters.")
        checked = []
        for f in filters:
            if not isinstance(f, dict) or not isinstance(f.get("field"), str) or f["field"] not in names or f.get("op") not in FILTER_OPS:
                raise ReportError("Invalid filter column or operator.")
            op, value = f["op"], f.get("value")
            if op in ("IS NULL", "IS NOT NULL"):
                value = None
            else:
                values = value if op in ("IN", "NOT IN") else [value]
                if not isinstance(values, list) or not 1 <= len(values) <= 200 or any(type(v) not in (str, int, float, bool) or len(str(v)) > 2000 for v in values):
                    raise ReportError("Invalid filter value.")
            checked.append({"field":f["field"], "op":op, "value":value})
        order = payload.get("order") or next(iter(c.column_name for c in ds.columns), "")
        if order not in names:
            raise ReportError("The sort column does not exist.")
        shown = payload.get("display_columns") or [c.column_name for c in ds.columns][:12]
        if not isinstance(shown, list) or not 1 <= len(shown) <= 30 or any(not isinstance(c, str) or c not in names for c in shown):
            raise ReportError("Select between 1 and 30 columns for the data table.")
        result = {"schema_version":2, "name":name, "template_id":template["id"],
                  "template_sha256":template["sha256"], "template_name":template["name"],
                  "dataset":ds_id, "mapping":mapping, "filters":checked, "order":order,
                  "descending":bool(payload.get("descending", False)), "display_columns":list(dict.fromkeys(shown))}
        result.update(multi)
        return result, ds
    
    
    def fingerprint(value):
        return hashlib.sha256(json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",",":"), default=str).encode()).hexdigest()
    
    
    def signer():
        return URLSafeTimedSerializer(current_app.config["SECRET_KEY"], salt="report-builder-v2-preview")
    
    
    def scope(ds):
