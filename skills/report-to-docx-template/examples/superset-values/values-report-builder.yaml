      function filterChanged(context) {if(context==='editor')changed();else invalidateRows();}
      async function action(target) {
        const act=target.dataset.action,context=target.dataset.context;
        switch(act) {
          case 'exports-open':await openJobs();break;
          case 'exports-refresh':await refreshJobs();break;
          case 'export-retry':await task('Resuming export…',async()=>{await api('/exports/'+encodeURIComponent(target.dataset.id)+'/retry','POST',{});await refreshJobs();});break;
          case 'upload':byId('rt-upload-form').reset();byId('rt-upload').showModal();break;
          case 'refresh':await task('Loading list…',async()=>{await loadList();toast('List refreshed.');});break;
          case 'template-publish':await task('Updating template publication…',async()=>{
            const item=state.templates.find(t=>t.id===target.dataset.id);
            if(!item)return;
            const published=!item.published;
            await api('/templates/'+encodeURIComponent(item.id)+'/publication','POST',
              {etag:item.etag,publication_etag:item.publication_etag,published});
            await loadList();
            toast(published?'Template published for Export dashboard and Export chart.':'Template unpublished. It is no longer available for user exports.');
          });break;
          case 'template-delete':case 'report-delete': {
            openDelete(act==='template-delete'?'templates':'reports',target.dataset.id);break;
          }
          case 'picker-clear':state[pickerSettings(target.dataset.picker).key]=[];changed();syncColumnPicker(target.dataset.picker);break;
          case 'picker-remove':updateColumnPicker(target.dataset.picker,target.dataset.column,false);byId(target.dataset.picker).querySelector('[data-picker-search]').focus();break;
          case 'dataset':await task('Loading dataset columns…',()=>chooseDataset(Number(target.dataset.id)));break;
          case 'more':await loadDatasets(true);break;
          case 'auto-map':state.mapping=autoMapping();changed();renderMappings();break;
          case 'bind-selected':if(state.selectedKey)bind(state.selectedKey,{column:target.dataset.column});else toast('Select a variable in the template or mapping panel first.',true);break;
          case 'review':case 'save':await task('Preparing a preview of the first 5 rows…',()=>review(false));break;
          case 'copy':await task('Preparing copy preview…',()=>review(true));break;
          case 'filter-add': {
            const filters=context==='editor'?state.filters:state.export.filters,cols=context==='editor'?state.columns:state.export.columns;
            if(filters.length>=20)return toast('A maximum of 20 filters is allowed.',true);
            if(cols.length)filters.push({field:cols[0].name,op:'==',value:''});
            filterChanged(context);if(context==='editor')renderEditorFilters();else renderExport();break;
          }
          case 'filter-delete':(context==='editor'?state.filters:state.export.filters).splice(Number(target.dataset.index),1);filterChanged(context);if(context==='editor')renderEditorFilters();else renderExport();break;
          case 'export-open':await task('Loading report and data…',()=>openExport(target.dataset.id));break;
          case 'rows-load':await task('Loading filtered data…',()=>loadRows('filtered'));break;
          case 'rows-select-all':if(state.export.snapshot)state.export.selected=new Set(state.export.snapshot.rows.map((_,i)=>i));renderRows();break;
          case 'rows-clear':state.export.selected.clear();renderRows();break;
          case 'rows-prev':state.export.page=Math.max(0,state.export.page-1);renderRows();break;
          case 'rows-next':state.export.page=Math.min(Math.ceil(state.export.snapshot.count/50)-1,state.export.page+1);renderRows();break;
        }
      }
      document.addEventListener('click',event=> {
        const download=event.target.closest('[data-report-download]');
