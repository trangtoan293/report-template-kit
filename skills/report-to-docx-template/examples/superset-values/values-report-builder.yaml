      async function refreshJobs() {
        if(!cfg.backgroundExports||jobsLoading||!byId('rt-jobs').open)return;
        jobsLoading=true;clearTimeout(jobsTimer);
        try {
          const jobs=(await api('/exports')).result;
          if(!byId('rt-jobs').open)return;
          byId('rt-jobs-error').hidden=true;
          byId('rt-jobs-list').innerHTML=jobs.length?`<div class="data-scroll"><table class="list-table"><thead><tr><th>Report</th><th>Progress</th><th>Created / Available until</th><th></th></tr></thead><tbody>${jobs.map(job=> {
            const active=['queued','running'].includes(job.state);
            const label={queued:'Queued',running:job.completed===job.report_count?'Preparing download':'Creating PDFs',ready:'Ready',failed:'Failed',expired:'Expired'}[job.state]||job.state;
            return `<tr><td><strong>${esc(job.name)}</strong><div class="muted">${job.row_count} rows · ${job.report_count} PDF${job.report_count===1?'':'s'}</div></td><td><span>${esc(label)} · ${job.completed}/${job.report_count}</span>${active?`<progress value="${job.completed}" max="${job.report_count}" aria-label="Completed PDFs"></progress>`:''}${job.error&&job.state!=='ready'?`<div class="muted">${esc(job.error)}${job.state==='queued'?' Retrying automatically.':''}</div>`:''}</td><td class="muted">${esc(date(job.created*1000))}<br>${esc(date(job.expires*1000))}</td><td>${job.state==='ready'?`<a class="button primary" href="${cfg.api}/exports/${encodeURIComponent(job.id)}/download" data-report-download data-report-name="${esc(job.name)}" data-report-extension="${job.report_count===1?'pdf':'zip'}" download>Download ${job.report_count===1?'PDF':'ZIP'}</a>`:job.state==='failed'?btn('export-retry','Retry remaining',`data-id="${esc(job.id)}"`):job.state==='expired'?'Create a new export':''}</td></tr>`;
          }).join('')}</tbody></table></div>`:'<div class="empty">No exports yet. Open a report and select the rows to export.</div>';
        } catch(error) {
          if(byId('rt-jobs').open){byId('rt-jobs-error').textContent=error.message+' Reconnecting automatically; accepted exports continue on the server.';byId('rt-jobs-error').hidden=false;}
