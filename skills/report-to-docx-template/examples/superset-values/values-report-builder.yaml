                    headers["If-Range"] = request.headers["If-Range"]
            upstream = store.open("GET", job["result_key"], headers=headers, allow_range_error=True)
            from datetime import datetime
            from zoneinfo import ZoneInfo
            stamp = datetime.now(ZoneInfo(current_app.config.get("DASHBOARD_EXPORT_REPORT_TIMEZONE", "Asia/Ho_Chi_Minh"))).strftime("%d-%m-%Y")
            title = re.sub(r'[\\/:*?"<>|\x00-\x1f\x7f]', '_', job["name"])
            title = title.encode("utf-8", errors="ignore")[:160].decode("utf-8", errors="ignore").strip(" .") or "Report"
            filename = title + "_" + stamp + "." + extension
            outgoing = {"Cache-Control":"private, no-store", "X-Content-Type-Options":"nosniff",
                        "X-Accel-Buffering":"no", "Accept-Ranges":"bytes",
                        "Content-Disposition":f"attachment; filename=\"report.{extension}\"; filename*=UTF-8''{quote(filename, safe='')}"}
            for header in ("Content-Length", "Content-Range", "ETag", "Last-Modified"):
                if header in upstream.headers:
                    outgoing[header] = upstream.headers[header]
            if upstream.status_code == 416:
                upstream.close()
                outgoing.pop("Content-Length", None)
                return Response(status=416, headers=outgoing)
    
            def chunks():
                try:
                    yield from upstream.iter_content(65536)
                finally:
                    upstream.close()
            response = Response(chunks(), status=upstream.status_code, headers=outgoing,
                                mimetype="application/pdf" if extension == "pdf" else "application/zip")
            response.call_on_close(upstream.close)
            return response
    
    
    def eligible(job):
        now = time.time()
        return now < job["expires"] and (job["state"] == "queued" and now >= job.get("next_try", 0)
                or job["state"] == "running" and now >= job.get("lease_until", 0))
    
    
    def run_job(store, job, etag, authorize):
        """A conditional lease fences stale workers; immutable PDFs checkpoint work."""
        if not eligible(job):
            return
        key = job_key(store, job["id"])
        job.update(state="running", updated=time.time(), lease_until=time.time() + LEASE_SECONDS, error="")
        try:
            etag = store.put_json(key, job, etag=etag)
        except Conflict:
            return  # Another pod already owns this job.
    
        def checkpoint(**changes):
            nonlocal etag
            if time.time() >= job["expires"]:
                raise ReportError("This export expired. Create a new export.")
            job.update(changes, updated=time.time(), lease_until=time.time() + LEASE_SECONDS)
            etag = store.put_json(key, job, etag=etag)
    
        try:
            from customsso.report_workflow import load_template
            authorize(job)
            snapshot, _ = store.get_json(data_key(store, job["id"], "input.json"))
            definition = snapshot["definition"]
            template, office, _ = load_template(store, definition["template_id"], True)
            if template["sha256"] != definition["template_sha256"]:
                raise ReportError("The original template changed. Create a new report from a new template.")
            maximum = min(1024, max(1, int(current_app.config.get("REPORT_BUILDER_MAX_ARCHIVE_MB", 200)))) * 1024 * 1024
            limit = int(current_app.config.get("REPORT_BUILDER_MAX_ROWS_PER_REPORT", 2000))
            for index in range(job["completed"], job["report_count"]):
                authorize(job)
                checkpoint()
                part_key = data_key(store, job["id"], f"parts/{index:06d}.pdf")
                try:
                    size = int(store.head(part_key)["Content-Length"])
                except Missing:
                    content = merge_report(office, definition, [snapshot["rows"][i] for i in snapshot["groups"][index]], limit)
                    content = convert_pdf(content, template["extension"])
                    size = len(content)
                    if job["bytes"] + size > maximum:
                        raise ReportError("The export exceeds the archive size limit. Select fewer rows.")
                    try:
                        store.put(part_key, content, "application/pdf", create=True)
                    except Conflict:
                        size = int(store.head(part_key)["Content-Length"])
                    del content
                if not 0 < size <= MAX_PDF or job["bytes"] + size > maximum:
                    raise ReportError("The export exceeds the allowed size. Select fewer rows.")
                checkpoint(completed=index + 1, bytes=job["bytes"] + size)
            authorize(job)
            if job["report_count"] == 1:
                result_key = data_key(store, job["id"], "parts/000000.pdf")
            else:
                result_key = data_key(store, job["id"], "result.zip")
                # Rebuild only the ZIP after restart; completed PDFs are not converted again.
                with tempfile.TemporaryFile() as output:
