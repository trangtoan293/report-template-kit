          ${fmt==='custom'?`<label>Format type<select data-binding-option="custom_type" data-variable="${esc(key)}">${[['number','Number'],['date','Date / time'],['text','Text']].map(([v,l])=>opt(v,l,customType)).join('')}</select></label><label>Custom format<input data-binding-option="custom_format" data-variable="${esc(key)}" maxlength="120" value="${esc(binding.custom_format??customFormatDefault(customType))}" placeholder="${esc(customFormatDefault(customType))}"></label><p class="form-help">${esc(customHelp)}</p>`:''}
          ${(fmt==='date'||fmt==='custom'&&customType==='date')?'<p class="form-help">Accepts ISO dates/times or DD/MM/YYYY. Keeps the input time without timezone conversion.</p>':''}</div>`;
      }
      function customFormatDefault(kind) {return kind==='date'?'DD/MM/YYYY':kind==='text'?'{value}':'#,##0.00';}
      function updateBindingOption(target) {
