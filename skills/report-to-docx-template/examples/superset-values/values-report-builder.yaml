        clearTimeout(statusTimer);node.textContent=message;node.className=`visible${error?' error':''}`;
        statusTimer=setTimeout(()=>node.className='',error?16000:5000);
      }
      async function api(path,method='GET',value,raw=false,signal) {
        const isForm=value instanceof FormData;
        const response=await fetch(cfg.api+path,{method,credentials:'same-origin',cache:'no-store',signal,
          headers:{'Accept':raw?'application/zip, application/pdf':'application/json',...(method==='GET'?{}:{'X-CSRFToken':cfg.csrf}),
            ...(value===undefined||isForm?{}:{'Content-Type':'application/json'})},
