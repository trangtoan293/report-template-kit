    /* Shared report downloads: keep picker calls within the user's click. */
    (() => {
      if(window.__hanasReportFiles)return;
      function name(report,extension){
        const now=new Date(),pad=value=>String(value).padStart(2,'0');
        const base=String(report||'Report').replace(/[\\/:*?"<>|\x00-\x1f\x7f]/g,'_').replace(/\.(pdf|zip)$/i,'').trim().slice(0,60).replace(/[. ]+$/,'')||'Report';
        return base+'_'+pad(now.getDate())+'-'+pad(now.getMonth()+1)+'-'+now.getFullYear()+'.'+extension;
      }
      async function pick(filename,extension){
        if(!window.isSecureContext||typeof window.showSaveFilePicker!=='function')return null;
        try{
          return await window.showSaveFilePicker({id:'hanas-report-downloads',suggestedName:filename,
            types:[{description:extension==='zip'?'ZIP archive':'PDF report',accept:{[extension==='zip'?'application/zip':'application/pdf']:['.'+extension]}}]});
        }catch(error){
          if(error.name==='SecurityError'||error.name==='NotAllowedError')return null;
          throw error;
        }
      }
      function browserDownload(blob,filename){
        const url=URL.createObjectURL(blob),link=document.createElement('a');
        link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),60000);
        return 'Download started: '+filename+'. To choose a folder, enable “Ask where to save each file before downloading” in your browser download settings.';
      }
      async function saveBlob(blob,filename,handle){
        if(handle===undefined)handle=await pick(filename,filename.endsWith('.zip')?'zip':'pdf');
        if(!handle)return browserDownload(blob,filename);
        const stream=await handle.createWritable();
        try{await stream.write(blob);await stream.close();}
        catch(error){try{await stream.abort();}catch(_){}throw error;}
        return 'Saved '+handle.name+'.';
      }
      async function saveUrl(url,report,extension='pdf'){
        const filename=name(report,extension),handle=await pick(filename,extension);
        const response=await fetch(url,{credentials:'same-origin',cache:'no-store'});
        const type=response.headers.get('Content-Type')||'';
        if(!response.ok||!type.includes(extension==='zip'?'application/zip':'application/pdf')){
          const error=type.includes('application/json')?await response.json():{};
          throw new Error(error.message||'Could not download the report (HTTP '+response.status+'). Check your login session and retry.');
        }
        if(handle&&response.body){
          await response.body.pipeTo(await handle.createWritable());
          return 'Saved '+handle.name+'.';
        }
        return saveBlob(await response.blob(),filename,handle);
      }
      window.__hanasReportFiles={name,pick,saveBlob,saveUrl};
    })();
    
    /* Template and report workflow. No frontend build or third-party CDN. */
    (() => {
      'use strict';
      const cfg=JSON.parse(document.getElementById('rt-config').dataset.config), app=document.getElementById('rt-app');
      if(cfg.view==='dashboard')return;
      const byId=id=>document.getElementById(id), clone=value=>JSON.parse(JSON.stringify(value));
      const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const opt=(value,label,current)=>`<option value="${esc(value)}"${String(value)===String(current)?' selected':''}>${esc(label)}</option>`;
      const btn=(action,label,extra='')=>`<button type="button" data-action="${action}" ${extra}>${label}</button>`;
      const state={view:cfg.view,templates:[],reports:[],template:null,report:null,columns:[],datasets:[],next:null,
        name:'',dataset:null,mapping:{},filters:[],order:'',descending:false,displayColumns:[],dirty:false,previewToken:null,
        previews:[],selectedKey:null,export:null,reportMode:'per_row',groupBy:[],repeatRows:[]};
      let busy=false,statusTimer,searchTimer,datasetGeneration=0,columnGeneration=0,submittingExport=false,exportController=null,jobsTimer,jobsLoading=false;
      const pickerSearch={};
