    """Standalone worker in the web pod, sharing its loopback PDF converter."""
    import base64
    import json
    import logging
    import os
    import signal
    import time
    
    # Mirror the web container's Helm extraEnv before importing Superset config.
    for name, value in json.loads(base64.b64decode(os.environ.pop("REPORT_EXPORT_EXTRA_ENV_B64", "e30="))).items():
        os.environ[name] = str(value)
    
    from superset.app import create_app
    from customsso.rt_jobs import eligible, run_job, worker_authorize
    from customsso.rt_storage import Store, Missing
    
    LOG = logging.getLogger("hanas.report_builder.jobs")
    
    
    def main():
        app = create_app()
        if not app.config.get("REPORT_BUILDER_BACKGROUND_EXPORTS", False):
            LOG.info("Background exports are disabled; worker will not process jobs.")
            return
        stopping = False
    
        def stop(*_):
            nonlocal stopping
            stopping = True
    
        signal.signal(signal.SIGTERM, stop)
        signal.signal(signal.SIGINT, stop)
        while not stopping:
            try:
                with app.app_context():
                    if not app.config.get("REPORT_BUILDER_ENABLED", True):
                        time.sleep(5)
                        continue
                    queue = Store(user_id=0)
                    # Jobs have a separate namespace so scans never list PDF objects.
                    for key in queue.keys(f"{queue.prefix}/exports/jobs/"):
                        if stopping:
                            break
                        if not key.endswith(".json"):
                            continue
                        try:
                            job, etag = queue.get_json(key)
                            if not eligible(job):
                                continue
                            store = Store(user_id=job["owner_id"])
                            from customsso.rt_jobs import job_key
                            if key != job_key(store, job["id"]):
                                continue
                            # A fresh context keeps Superset permission caches per job.
                            with app.app_context(), app.test_request_context("/report-export-worker"):
                                run_job(store, job, etag, lambda value:worker_authorize(store, value))
                        except Missing:
                            continue
                        except Exception:
                            LOG.exception("Could not process an export queue entry")
            except Exception:
                LOG.exception("Export queue unavailable; retrying")
            for _ in range(5):
                if stopping:
                    break
                time.sleep(1)
    
    
    if __name__ == "__main__":
        main()
