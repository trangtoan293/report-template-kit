  rt_ui.css: |
    /* Keep Report controls from restyling Superset navigation and its dropdowns. */
    @scope (.rt-workflow) {
    :scope{font:14px "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#333333;background:#f7f7f7;color-scheme:light}
    *{box-sizing:border-box}
    :scope{margin:0}
    a{color:#007a99;text-decoration:none}
    button,input,select{font:inherit}
    button,.button{border:1px solid #d9d9d9;border-radius:4px;background:#fff;padding:8px 12px;color:#333333;cursor:pointer;display:inline-block}
    button:hover,.button:hover{background:#f0faff;border-color:#20a7c9}
    button:disabled{opacity:.45;cursor:default}
    .primary{background:#20a7c9;color:#fff;border-color:#20a7c9}
    .primary:hover{background:#1687a3;color:white}
    .danger{color:#ac3838}
    .tiny{padding:3px 8px;font-size:12px}
    .row{display:flex;align-items:center;gap:9px}
    .grow{flex:1;min-width:0}
    .muted{font-size:12px;color:#737373;line-height:1.6}
    .empty{padding:55px 20px;text-align:center;color:#708398}
    .empty strong{display:block;color:#355772;font-size:18px;margin-bottom:10px}
    .hidden,[hidden]{display:none!important}
    input,select{padding:8px;border:1px solid #d9d9d9;background:white;border-radius:4px;color:inherit;max-width:100%}
    label{display:block;font-size:12px;font-weight:600;margin:12px 0 6px}
    label>input,label>select{display:block;width:100%;margin-top:6px}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #82b9e6;outline-offset:2px}
    h1{font-size:23px;margin:0}
    h2{font-size:17px;margin:0}
    h3{font-size:14px;margin:18px 0 9px}
    code{font-size:12px;background:#edf3f8;padding:3px 5px;border-radius:3px}
    .rt-nav{display:flex;align-items:center;gap:24px;background:white;border-bottom:1px solid #e0e0e0;height:62px;padding:0 28px;position:sticky;top:0;z-index:10}
    .rt-nav a{color:#203a51;height:62px;display:flex;align-items:center;border-bottom:3px solid transparent;padding-top:3px}
    .rt-nav a.active{border-bottom-color:#2584bb;color:#176ca3}
    .rt-nav .account{margin-left:auto;color:#7990a4;font-size:12px}
    .rt-content{max-width:1400px;margin:0 auto;padding:34px 32px}
    .page-head{display:flex;align-items:center;gap:16px;margin-bottom:25px}
    .page-head p{margin:8px 0 0}
    .rt-card{background:white;border:1px solid #e0e0e0;border-radius:4px;overflow:visible}
    .list-table{width:100%;border-collapse:collapse;text-align:left}
    .list-table th{background:#fafafa;font-size:12px;font-weight:600;color:#666666;padding:13px 18px;border-bottom:1px solid #eeeeee}
    .list-table td{padding:15px 18px;border-bottom:1px solid #eeeeee;vertical-align:middle}
    .list-table tr:last-child td{border:0}
    .list-table td strong{font-size:14px}
    .badge{display:inline-block;background:#e6f5f8;color:#007a99;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}
    .badge.good{background:#e5f4ed;color:#27714d}
    .badge.warn{background:#fff1db;color:#9d620a}
    .file-icon{width:40px;height:45px;display:flex;align-items:center;justify-content:center;background:#e4edf9;color:#2862a4;border-radius:4px;font-size:10px;font-weight:750}
    .file-icon.xlsx{background:#e1f2e9;color:#2a7a53}
    .actions{position:relative;display:inline-block}
