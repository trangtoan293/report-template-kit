    """Offline Office-to-PDF conversion through the pod-local LibreOffice sidecar."""
    import logging
    import time
    import uuid
    
    import requests
    from flask import current_app
    
    from customsso.report_builder import ReportError
    
    LOG = logging.getLogger("hanas.report_builder")
    MAX_PDF = 40 * 1024 * 1024
    
    
    def convert_pdf(content, extension, *, max_pdf_bytes=None):
        # Convert the populated source document as-is. Do not rewrite its fonts
        # or block conversion based on a locally installed font inventory.
        if extension not in ('docx', 'xlsx') or len(content) > MAX_PDF:
            raise ReportError('The populated Office document is unsupported or exceeds 40 MB.')
        maximum = MAX_PDF if max_pdf_bytes is None else max_pdf_bytes
        if type(maximum) is not int or maximum <= 0:
            raise ReportError('PDF output size limit must be a positive byte count.')
        # Helm derives this from reportPdf.timeoutSeconds + 15. Do not silently
        # clamp it to 120s while LibreOffice is still allowed to finish its work.
        timeout = max(10, int(current_app.config.get('REPORT_BUILDER_PDF_TIMEOUT', 1215)))
        trace = str(uuid.uuid4())
        started = time.monotonic()
        LOG.info('Report PDF conversion started trace=%s input_bytes=%s read_timeout_seconds=%s max_pdf_bytes=%s',
                 trace, len(content), timeout, maximum)
        try:
            # Never inherit an HTTP proxy: documents stay on this pod's loopback.
            with requests.Session() as session:
                session.trust_env = False
                with session.post('http://127.0.0.1:3000/forms/libreoffice/convert',
                                  headers={'Gotenberg-Trace': trace},
                                  files={'files':('report.' + extension, content, 'application/octet-stream')},
                                  data={'pdfa':'PDF/A-2b', 'exportFormFields':'false', 'updateIndexes':'false'},
                                  timeout=(5, timeout), allow_redirects=False, stream=True) as response:
                    if response.status_code != 200:
                        LOG.warning('Report PDF conversion returned HTTP %s trace=%s elapsed_seconds=%.3f',
                                    response.status_code, trace, time.monotonic() - started)
                        raise ReportError('PDF conversion failed (HTTP ' + str(response.status_code) +
                                          '). Check report-pdf logs using correlation_id=' + trace +
                                          '; check its conversion deadline and queue.')
                    result, size = [], 0
                    for chunk in response.iter_content(65536):
                        size += len(chunk)
                        if size > maximum:
                            raise ReportError(f'The generated PDF exceeds {maximum / 1048576:g} MiB. '
                                              'No partial PDF was returned. Check the configured PDF output limit.')
                        result.append(chunk)
                    pdf = b''.join(result)
                    if not pdf.startswith(b'%PDF-'):
                        raise ReportError('The converter did not return a valid PDF. No file was downloaded.')
                    LOG.info('Report PDF conversion completed trace=%s elapsed_seconds=%.3f output_bytes=%s',
                             trace, time.monotonic() - started, size)
                    return pdf
        except requests.Timeout as ex:
            LOG.warning('Report PDF connection/read timeout trace=%s elapsed_seconds=%.3f read_timeout_seconds=%s',
                        trace, time.monotonic() - started, timeout)
            raise ReportError('PDF converter connection/read timed out (read timeout ' + str(timeout) +
                              's). Check report-pdf logs using correlation_id=' + trace + '.') from ex
        except requests.RequestException as ex:
            LOG.warning('Report PDF connection failure: %s trace=%s', type(ex).__name__, trace)
            raise ReportError('Unable to reach the local PDF converter. Check the report-pdf container.') from ex
