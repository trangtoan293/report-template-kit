        pages.style.zoom='1';
        const width=Math.max(pages.scrollWidth,...[...pages.children].map(p=>p.offsetWidth));
        const actualSize=frame.id==='rt-document'&&byId('rt-preview-scale')?.value==='actual';
        pages.style.zoom=String(actualSize?1:Math.min(1,Math.max(.1,(frame.clientWidth-32)/Math.max(1,width))));
      }
      function observePreview(frame) {
        frame.addEventListener('load',()=>fitPreview(frame));
