        @bp.get(api + "/datasets")
        @protected
        def datasets():
            from superset import db, security_manager
            from superset.connectors.sqla.models import SqlaTable
            from superset.exceptions import SupersetSecurityException
            try:
                after = max(0, int(request.args.get("after", 0)))
            except ValueError:
                raise ReportError("Invalid dataset page.")
            query = db.session.query(SqlaTable).filter(SqlaTable.id > after)
            search = request.args.get("search", "")[:200]
            if search:
                query = query.filter(SqlaTable.table_name.contains(search, autoescape=True))
            candidates = query.order_by(SqlaTable.id).limit(501).all()
            found, visited, cursor = [], 0, after
            for ds in candidates[:500]:
                visited, cursor = visited + 1, ds.id
                try:
                    security_manager.raise_for_access(datasource=ds)
                except SupersetSecurityException:
                    continue
                found.append({"id":ds.id, "name":ds.table_name, "database":ds.database.database_name})
                if len(found) >= 50:
                    break
            return reply({"result":found, "next":cursor if visited < len(candidates) else None})
    
