# 2026-10-15: Recycle PDF engines after each attempt and shut down idle engines.
# v1.5.4: Production UI selectors survive stripped data-test attributes; includes OCI storage hotfix.
# v1.5.3: OCI S3 compatibility writes use PostgreSQL advisory locks; no schema changes.
# Pair with Dashboard Export v1.5.1 for latest-PDF dialogs; published-template access is unchanged.
# v1.5.0: Admin-only Template/Report management; Publish/Unpublish templates for end-user exports.
# Template / Report v2 - Superset 6.0 - runtime YAML overlay.
# Keeps the existing Superset image. Adds a prebuilt, pod-local LibreOffice sidecar.
# Offline runtime: pre-stage the converter image; custom font bundles are optional.
# Use LAST:
# helm upgrade superset . -f value-superset-sso.yaml -f values-attestation-minio.yaml -f values-pivot-labels-02.yaml -f values-report-builder.yaml -n superset-oidc
#
# Template: /report-templates/ ; Report: /reports/ ; mapping: /report-builder/?template=<id>
# Adds Template and Report immediately after Charts in Superset bootstrap navigation.
# Template/Report navigation is server-rendered from Superset's permission-aware menu data.
# S3 endpoint/bucket/credentials default to existing ATTEST_S3_* environment variables.
# A separate REPORT_BUILDER_S3_PREFIX keeps these files apart from attestation data.
# Templates/reports are Admin-managed and private by default; Admin can publish DOCX dashboard templates.
# Published templates are shared for end-user exports only. Reports/jobs remain private. No browser S3 credentials.
# With Dashboard Export v1.4.2, DOCX dashboard templates can also be selected in
# Download -> Export dashboard / Export chart, without opening the Report Builder editor.
# DOCX/XLSX templates -> filled Office files -> PDF/A-2b using local LibreOffice.
# Per-row mode or grouped DOCX reports with repeating table rows.
# One generated report downloads a PDF; multiple reports download a ZIP of PDFs.
# reportExportWorker.enabled defaults to false: direct exports without a worker.
# Enable it for durable background exports and PDF/ZIP download history in S3.
# The first five filtered/sorted records can be previewed before saving.
# Preview HTML is approximate; Download preview PDF uses the actual converter.
# Source font declarations are preserved; no font-family override or font precheck.
# Existing v1 designs remain in hanas_report_builder_v1; they are not deleted/migrated.
# Requires /app/pythonpath/customsso (already set by value-superset-sso.yaml).
# Literal double braces below are escaped for the chart's tpl processing.
# See REPORT_BUILDER_YAML.md for usage, S3 permissions, limits and rollback.

# Offline PDF conversion. Mirror this prebuilt image into your internal registry
# or preload it on EVERY eligible Kubernetes node and set pullPolicy: Never.
# No image build, pip/npm/apt download, CDN or cloud conversion API is used.
reportPdf:
  image: gotenberg/gotenberg:8.37.0-libreoffice
  pullPolicy: IfNotPresent
  # Conversion deadline, including queue time (30-1200 seconds).
  # Python waits an additional 15 seconds for the converter response.
  timeoutSeconds: 1200
  # LibreOffice retained in the web pod for dataset previews/direct exports.
  # Dedicated dashboard converters use dashboardExport.libreOfficeResources.
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  # ZIP of licensed .ttf/.otf/.ttc files in the SAME internal S3 bucket.
  # Example: report-builder/v2/fonts/fonts-v1.zip; blank uses bundled fonts only.
  fontBundleKey: ""
  # Optional integrity pin; get the hash of the ZIP before uploading it to S3.
  fontBundleSha256: ""

# false: direct PDF/ZIP export; no extra worker container or worker resources.
# true: durable background exports and Export history (requires Helm upgrade).
reportExportWorker:
  enabled: false
  container:
    name: report-export-worker
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
    imagePullPolicy: "{{ .Values.image.pullPolicy }}"
    command:
      - /bin/sh
      - -ec
      - |
        export PYTHONPATH="{{ .Values.configMountPath }}:${PYTHONPATH:-}"
        exec python {{ .Values.extraConfigMountPath }}/rt_job_worker.py
    envFrom:
      - secretRef:
          name: "{{ tpl .Values.envFromSecret . }}"
    env:
      - name: SUPERSET_CONFIG_PATH
        value: "{{ .Values.configMountPath }}/superset_config.py"
      - name: REPORT_EXPORT_EXTRA_ENV_B64
        value: '{{ merge (deepCopy (.Values.supersetNode.env | default dict)) .Values.extraEnv | toJson | b64enc }}'
    volumeMounts:
      - name: superset-config
        mountPath: "{{ .Values.configMountPath }}"
        readOnly: true
      - name: superset-extra-config
        mountPath: "{{ .Values.extraConfigMountPath }}"
        readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
        ephemeral-storage: 256Mi
      limits:
        cpu: "1"
        memory: 1536Mi
        ephemeral-storage: 1Gi

extraVolumes:
  - name: report-pdf-fonts
    emptyDir:
      sizeLimit: 300Mi

extraVolumeMounts:
  - name: report-pdf-fonts
    mountPath: /app/report-pdf
    readOnly: true

supersetNode:
  extraInitContainers:
    - name: report-pdf-fonts
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: "{{ .Values.image.pullPolicy }}"
      # Uses the existing Superset Python/dependencies; no bootstrap installer.
      command:
        - /bin/sh
        - -ec
        - |
          export PYTHONPATH="/app/pythonpath:${PYTHONPATH:-}"
          exec python /app/pythonpath/customsso/rt_pdf_fonts.py
      envFrom:
        - secretRef:
            name: "{{ tpl .Values.envFromSecret . }}"
      env:
        - name: REPORT_PDF_FONT_KEY
          value: "{{ .Values.reportPdf.fontBundleKey }}"
        - name: REPORT_PDF_FONT_SHA256
          value: "{{ .Values.reportPdf.fontBundleSha256 }}"
        - name: REPORT_PDF_EXTRA_ENV_B64
          value: '{{ .Values.extraEnv | toJson | b64enc }}'
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: superset-extra-config
          mountPath: /app/pythonpath/customsso
          readOnly: true
        - name: report-pdf-fonts
          mountPath: /app/report-pdf
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 768Mi
  extraContainers:
    - name: report-pdf
      image: "{{ .Values.reportPdf.image }}"
      imagePullPolicy: "{{ .Values.reportPdf.pullPolicy }}"
      # Preserve the official tini entrypoint. Register mounted fonts before LO.
      args:
        - /bin/sh
        - -ec
        - |
          fc-cache -f /usr/local/share/fonts/report-builder
          fc-list --format='%{family}\n' > /usr/local/share/fonts/report-builder/installed-fonts.tmp
          mv /usr/local/share/fonts/report-builder/installed-fonts.tmp /usr/local/share/fonts/report-builder/installed-fonts.txt
          exec gotenberg
      env:
        - name: API_BIND_IP
          value: "127.0.0.1"
        - name: API_TIMEOUT
          value: "{{ .Values.reportPdf.timeoutSeconds | int }}s"
        - name: API_BODY_LIMIT
          value: "45MB"
        - name: API_DISABLE_DOWNLOAD_FROM
          value: "true"
        - name: LIBREOFFICE_AUTO_START
          value: "false"
        # Recycle even failed/timed-out conversions; release the idle engine.
        - name: LIBREOFFICE_RESTART_AFTER
          value: "1"
        - name: LIBREOFFICE_IDLE_SHUTDOWN_TIMEOUT
          value: "60s"
        - name: LIBREOFFICE_MAX_QUEUE_SIZE
          value: "10"
        - name: LIBREOFFICE_DENY_LIST
          value: ".*"
        - name: WEBHOOK_DISABLE
          value: "true"
        - name: OTEL_TRACES_EXPORTER
          value: "none"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: report-pdf-fonts
          mountPath: /usr/local/share/fonts/report-builder
      startupProbe:
        exec:
          command: [curl, --fail, --silent, --max-time, "3", "http://127.0.0.1:3000/health"]
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 36
      readinessProbe:
        exec:
          command: [curl, --fail, --silent, --max-time, "3", "http://127.0.0.1:3000/health"]
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      # Readiness alone never restarts an unresponsive converter.
      livenessProbe:
        exec:
          command: [curl, --fail, --silent, --max-time, "3", "http://127.0.0.1:3000/health"]
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi

extraConfigs:
  reporting_s3_lock.py: |
    """Cooperative S3 write coordination for OCI's S3 compatibility endpoint.
    
    All writers of a bucket/key must use this module and the same PostgreSQL
    metadata database. No tables, migrations, or persistent database rows are used.
    This is NOT a cross-service transaction: PostgreSQL failover/loss of a lock
    while an S3 PUT is in flight requires stopping writers and reconciling the
    object before resuming. Never retry an uncertain PUT as an unconditional write.
    """
    import hashlib
    import json
    import os
    from contextlib import contextmanager
    from urllib.parse import urlsplit
    
    from flask import current_app
    
    
    def write_mode(endpoint, error_type):
        mode = str(current_app.config.get(
            "REPORTING_S3_WRITE_MODE", os.environ.get("REPORTING_S3_WRITE_MODE", "auto")
        )).strip().lower()
        if mode == "auto":
            host = (urlsplit(endpoint).hostname or "").lower()
            # Exact OCI domain boundary, not a substring match of arbitrary hosts.
            oracle = (host.endswith(".oraclecloud.com")
                      or host.endswith(".oraclecloud.com.cn"))
            return "postgres_advisory" if oracle and ".compat.objectstorage." in host else "s3"
        if mode not in ("s3", "postgres_advisory"):
            raise error_type("REPORTING_S3_WRITE_MODE must be auto, s3, or postgres_advisory.")
        return mode
    
    
    @contextmanager
    def object_lock(bucket, key, error_type):
        from sqlalchemy import text
        from sqlalchemy.exc import SQLAlchemyError
        from superset import db
    
        # Omit endpoint/credentials so aliases and different accounts writing the
        # same object still coordinate. Separate buckets/keys keep independent locks.
        identity = json.dumps(["hanas-reporting-s3-v1", bucket, key], separators=(",", ":"))
        lock_id = int.from_bytes(hashlib.sha256(identity.encode("utf-8")).digest()[:8],
                                 "big", signed=True)
        try:
            timeout = int(current_app.config.get(
                "REPORTING_S3_LOCK_TIMEOUT_SECONDS",
                os.environ.get("REPORTING_S3_LOCK_TIMEOUT_SECONDS", "5")))
        except (TypeError, ValueError) as ex:
            raise error_type("REPORTING_S3_LOCK_TIMEOUT_SECONDS must be an integer from 1 to 30.") from ex
        if not 1 <= timeout <= 30:
            raise error_type("REPORTING_S3_LOCK_TIMEOUT_SECONDS must be between 1 and 30.")
    
        try:
            engine = db.engine
            if engine.dialect.name != "postgresql":
                raise error_type("Oracle S3 write coordination requires a shared PostgreSQL metadata database.")
            # Independent connection: never commit/rollback the caller's ORM session.
            # Transaction-scoped locks cannot leak when a connection returns to a pool.
            with engine.connect() as connection:
                with connection.begin():
                    connection.execute(text("SELECT set_config('lock_timeout', :timeout, true)"),
                                       {"timeout": str(timeout * 1000) + "ms"})
                    connection.execute(text("SELECT set_config('statement_timeout', :timeout, true)"),
                                       {"timeout": str((timeout + 1) * 1000) + "ms"})
                    # The transaction intentionally waits on S3; a server idle timeout
                    # must not silently release its lock during a normal upload.
                    connection.execute(text("SELECT set_config('idle_in_transaction_session_timeout', '0', true)"))
                    connection.execute(text("SELECT pg_advisory_xact_lock(:key)"), {"key": lock_id})
                    backend = connection.execute(text("SELECT pg_backend_pid()")).scalar()
    
                    def confirm():
                        if (connection.invalidated or
                                connection.execute(text("SELECT pg_backend_pid()")).scalar() != backend):
                            raise error_type("The reporting storage lock was lost. Stop exports and check the object state before retrying.")
    
                    yield confirm
                    confirm()
        except SQLAlchemyError as ex:
            # A disconnected database is never a reason to fall back to a naked PUT.
            raise error_type(
                "Reporting storage coordination failed. If this happened during an upload or database failover, "
                "stop exports and check the object state before retrying."
            ) from ex
    
    
    def guarded_put(store, key, data, mime, etag, create, error_type, conflict_type, missing_type):
        """Serialize HEAD/check/PUT among participating writers, per bucket/key."""
        if not create and not etag:
            raise error_type("Missing ETag for a safe update. Reload this item from S3.")
        with object_lock(store.bucket, key, error_type) as confirm:
            try:
                current = store.head(key)
            except missing_type:
                current = None
            confirm()
            if create:
                if current is not None:
                    raise conflict_type("This S3 object already exists. Reload it before updating.")
            else:
                if current is None:
                    raise conflict_type("This S3 object no longer exists. Reload it before updating.")
                actual = current.get("ETag")
                if not actual:
                    raise error_type("S3 did not return an ETag. Check the storage endpoint.")
                if actual != etag:
                    raise conflict_type("Content was changed in another window. Reload it or save a copy.")
            # The condition was checked inside the shared lock. The OCI compatibility
            # API is not relied on to enforce conditional headers in this mode.
            result = store.request("PUT", key, body=data, headers={"Content-Type": mime})[1]
            confirm()
            if not result:
                raise error_type("S3 did not return an ETag after writing. Reload the object before retrying.")
            return result
  report_builder.py: |
    """Optional report designer mounted by Helm; Superset 6.0, no image build.
    
    Superset imports configuration before initializing its models. Keep all imports
    of Superset models, commands and security services inside request-time functions.
    """
    import gzip
    import json
    import logging
    import threading
    import zlib
    from datetime import datetime
    from decimal import Decimal, InvalidOperation
    from functools import wraps
    from html import escape
    from pathlib import Path
    from uuid import uuid4
    
    import sqlalchemy as sa
    from flask import Blueprint, Response, current_app, g, redirect, request, url_for
    from flask_login import current_user
    from flask_wtf.csrf import generate_csrf, validate_csrf
    from wtforms.validators import ValidationError
    from werkzeug.exceptions import HTTPException
    
    LOG = logging.getLogger("hanas.report_builder")
    ROOT = Path(__file__).parent
    META = sa.MetaData()
    REPORTS = sa.Table(
        "hanas_report_builder_v1", META,
        sa.Column("id", sa.String(36), primary_key=True),
        sa.Column("owner_id", sa.Integer, nullable=False, index=True),
        sa.Column("name", sa.String(200), nullable=False),
        sa.Column("definition", sa.Text, nullable=False),
        sa.Column("revision", sa.Integer, nullable=False),
        sa.Column("created_on", sa.DateTime, nullable=False),
        sa.Column("changed_on", sa.DateTime, nullable=False),
    )
    LOCK = threading.Lock()
    READY = set()
    AGGREGATES = ("", "SUM", "AVG", "MIN", "MAX", "COUNT", "COUNT_DISTINCT")
    FILTER_OPS = ("==", "!=", ">", ">=", "<", "<=", "IN", "NOT IN", "IS NULL", "IS NOT NULL")
    
    
    class ReportError(Exception):
        pass
    
    
    def reply(value, status=200):
        from superset.utils import json as superset_json
        return Response(superset_json.dumps(value), status=status,
                        mimetype="application/json", headers={"Cache-Control": "no-store"})
    
    
    def identity():
        from superset import security_manager
        user = getattr(g, "user", None) or current_user
        if not user or not user.is_authenticated or not user.is_active:
            return None
        if security_manager.is_guest_user(user):
            return None
        return user
    
    
    def is_report_admin(user=None):
        user = user if user is not None else identity()
        return bool(user and user.is_authenticated and user.is_active
                    and any(role.name == 'Admin' for role in user.roles))
    
    
    def authorized(fn):
        @wraps(fn)
        def wrapped(*args, **kwargs):
            from superset import db
            from superset.exceptions import SupersetSecurityException
            if not current_app.config.get("REPORT_BUILDER_ENABLED", True):
                return reply({"message": "This feature is disabled."}, 404)
            user = identity()
            if user is None:
                return reply({"message": "Your session has expired. Please sign in to Superset again."}, 401)
            if not is_report_admin(user):
                return reply({"message": "Only Superset Admin can manage templates and reports."}, 403)
            roles = current_app.config.get("REPORT_BUILDER_ALLOWED_ROLES")
            if roles is not None and not set(roles).intersection(r.name for r in user.roles):
                return reply({"message": "Your account does not have permission to create reports."}, 403)
            g.user = user
            try:
                if request.method not in ("GET", "HEAD", "OPTIONS"):
                    validate_csrf(request.headers.get("X-CSRFToken"))
                return fn(*args, **kwargs)
            except ValidationError:
                return reply({"message": "Your form session has expired. Reload the page and try again."}, 400)
            except SupersetSecurityException:
                return reply({"message": "You do not have permission to access this dataset."}, 403)
            except ReportError as ex:
                return reply({"message": str(ex)}, 400)
            except HTTPException:
                raise
            except Exception:
                db.session.rollback()
                LOG.exception("Report builder request failed")
                return reply({"message": "Unable to process the report. Contact your administrator and check the hanas.report_builder logs."}, 500)
        return wrapped
    
    
    def ensure_tables():
        from superset import db
        engine = db.engine
        if engine in READY:
            return
        with LOCK:
            if engine in READY:
                return
            with engine.begin() as connection:
                if engine.dialect.name == "postgresql":
                    connection.execute(sa.text("SET LOCAL lock_timeout = '5s'"))
                    connection.execute(sa.text("SELECT pg_advisory_xact_lock(721060610)"))
                META.create_all(connection, checkfirst=True)
            READY.add(engine)
    
    
    def integer(value, low, high, label):
        if type(value) is not int or not low <= value <= high:
            raise ReportError(f"{label}: must be an integer between {low} and {high}.")
        return value
    
    
    def string(value, size, label):
        if not isinstance(value, str) or len(value) > size:
            raise ReportError(f"{label}: maximum {size} characters.")
        return value
    
    
    def choice(value, choices, label):
        if value not in choices:
            raise ReportError(f"{label} is invalid.")
        return value
    
    
    def dataset(dataset_id):
        from superset import db, security_manager
        from superset.connectors.sqla.models import SqlaTable
        ds = db.session.query(SqlaTable).filter_by(id=dataset_id).one_or_none()
        if ds is None:
            raise ReportError("The dataset no longer exists. Select another dataset.")
        security_manager.raise_for_access(datasource=ds)
        return ds
    
    
    def document():
        if request.content_length is not None and request.content_length > 250000:
            raise ReportError("Report design exceeds the 250 KB limit.")
        raw_bytes = request.stream.read(250001)
        if len(raw_bytes) > 250000:
            raise ReportError("Report design exceeds the 250 KB limit.")
        try:
            payload = json.loads(raw_bytes)
        except (ValueError, UnicodeDecodeError):
            raise ReportError("Report content must be valid JSON.")
        if not isinstance(payload, dict):
            raise ReportError("Invalid report content.")
        name = string(payload.get("name", ""), 200, "Report name").strip()
        if not name:
            raise ReportError("Enter a report name.")
        raw = payload.get("definition")
        if not isinstance(raw, dict) or raw.get("version") != 1:
            raise ReportError("Unsupported design version.")
        page = raw.get("page", {})
        if not isinstance(page, dict):
            raise ReportError("Invalid page settings.")
        result = {"version": 1, "page": {
            "orientation": choice(page.get("orientation", "portrait"), ("portrait", "landscape"), "Orientation"),
            "margin": integer(page.get("margin", 12), 5, 30, "Page margins"),
        }, "blocks": []}
        blocks = raw.get("blocks")
        if not isinstance(blocks, list) or len(blocks) > 20:
            raise ReportError("A report can have up to 20 blocks.")
        seen, datasets = set(), {}
        for raw_block in blocks:
            if not isinstance(raw_block, dict):
                raise ReportError("Invalid report block.")
            block_id = string(raw_block.get("id"), 80, "Block ID")
            if not block_id or block_id in seen:
                raise ReportError("Block IDs must be unique and nonempty.")
            seen.add(block_id)
            kind = choice(raw_block.get("type"), ("text", "table"), "Block type")
            block = {"id": block_id, "type": kind,
                     "width": integer(raw_block.get("width", 100), 25, 100, "Width"),
                     "font": integer(raw_block.get("font", 12), 8, 36, "Font size"),
                     "align": choice(raw_block.get("align", "left"), ("left", "center", "right"), "Alignment"),
                     "pageBreak": bool(raw_block.get("pageBreak", False))}
            if kind == "text":
                block["text"] = string(raw_block.get("text", ""), 10000, "Text")
            else:
                ds_id = integer(raw_block.get("dataset"), 1, 2147483647, "Dataset")
                if ds_id not in datasets:
                    datasets[ds_id] = dataset(ds_id)
                available = {col.column_name: col for col in datasets[ds_id].columns}
                block.update(dataset=ds_id,
                             title=string(raw_block.get("title", ""), 200, "Table title"),
                             limit=integer(raw_block.get("limit", 1000), 1, 10000, "Row count"),
                             columns=[], filters=[])
                cols = raw_block.get("columns")
                if not isinstance(cols, list) or not 1 <= len(cols) <= 30:
                    raise ReportError("Each table requires between 1 and 30 columns.")
                col_ids = set()
                for raw_col in cols:
                    if not isinstance(raw_col, dict):
                        raise ReportError("Invalid column.")
                    field = string(raw_col.get("field"), 1000, "Column name")
                    if field not in available:
                        raise ReportError(f"Column {field} no longer exists in the dataset.")
                    col_id = string(raw_col.get("id"), 80, "Column ID")
                    if not col_id or col_id in col_ids:
                        raise ReportError("Column IDs must be unique and nonempty.")
                    col_ids.add(col_id)
                    agg = choice(raw_col.get("aggregate", ""), AGGREGATES, "Aggregation")
                    if agg in ("SUM", "AVG") and not available[field].is_numeric:
                        raise ReportError(f"Column {field} must be numeric to use {agg}.")
                    block["columns"].append({"id": col_id, "field": field,
                        "label": string(raw_col.get("label", field), 200, "Column label"), "aggregate": agg,
                        "format": choice(raw_col.get("format", "text"), ("text", "number", "date"), "Format"),
                        "decimals": integer(raw_col.get("decimals", 2), 0, 6, "Decimal places")})
                filters = raw_block.get("filters", [])
                if not isinstance(filters, list) or len(filters) > 10:
                    raise ReportError("Each table can have up to 10 filters.")
                for item in filters:
                    if not isinstance(item, dict) or item.get("field") not in available:
                        raise ReportError("Invalid filter column.")
                    op = choice(item.get("op"), FILTER_OPS, "Operator")
                    value = item.get("value")
                    if op in ("IS NULL", "IS NOT NULL"):
                        value = None
                    elif op in ("IN", "NOT IN"):
                        if not isinstance(value, list) or not 1 <= len(value) <= 100:
                            raise ReportError("IN filters require between 1 and 100 values.")
                        if any(type(v) not in (str, int, float, bool) or len(str(v)) > 1000 for v in value):
                            raise ReportError("Invalid filter value.")
                    elif type(value) not in (str, int, float, bool) or len(str(value)) > 1000:
                        raise ReportError("Invalid filter value.")
                    block["filters"].append({"field": item["field"], "op": op, "value": value})
                order = raw_block.get("order", "")
                if order and order not in col_ids:
                    raise ReportError("Invalid sort column.")
                block["order"] = order
                block["descending"] = bool(raw_block.get("descending", False))
            result["blocks"].append(block)
        return name, result, payload.get("revision")
    
    
    def query_payload(block):
        dimensions, metrics, keys, order_items = [], [], [], {}
        reserved = {col["field"] for col in block["columns"]}
        for index, col in enumerate(block["columns"]):
            field, agg = col["field"], col["aggregate"]
            if agg:
                key = f"rb_metric_{index}"
                while key in reserved or key in keys:
                    key = "_" + key
                item = {"expressionType": "SIMPLE", "column": {"column_name": field},
                        "aggregate": agg, "label": key, "optionName": key,
                        "hasCustomLabel": True, "sqlExpression": None}
                metrics.append(item)
            else:
                key, item = field, field
                if field not in dimensions:
                    dimensions.append(field)
            keys.append(key)
            order_items[col["id"]] = item
        order = block.get("order")
        query = {"columns": dimensions, "metrics": metrics or None,
                 "filters": [{"col": f["field"], "op": f["op"], "val": f["value"]} for f in block["filters"]],
                 "row_limit": block["limit"] + 1, "row_offset": 0,
                 "time_range": "No filter", "is_timeseries": False,
                 "orderby": [[order_items[order], not block["descending"]]] if order else [],
                 "order_desc": block["descending"], "extras": {}}
        return {"datasource": {"id": block["dataset"], "type": "table"}, "queries": [query],
                "result_format": "json", "result_type": "full", "force": True,
                "custom_cache_timeout": -1}, keys
    
    
    def run_document(definition):
        from superset.charts.schemas import ChartDataQueryContextSchema
        from superset.commands.chart.data.get_data_command import ChartDataCommand
        from superset.utils import json as superset_json
        max_rows = current_app.config.get("REPORT_BUILDER_MAX_TOTAL_ROWS", 10000)
        if sum(b.get("limit", 0) for b in definition["blocks"]) > max_rows:
            raise ReportError(f"The combined row limits must not exceed {max_rows}.")
        results, truncated, size = {}, False, 0
        for block in definition["blocks"]:
            if block["type"] != "table":
                continue
            payload, keys = query_payload(block)
            command = ChartDataCommand(ChartDataQueryContextSchema().load(payload))
            command.validate()
            query = command.run()["queries"][0]
            rows = query.get("data")
            if query.get("error") or not isinstance(rows, list):
                raise ReportError("Unable to read data. Check the dataset and filters.")
            cut = len(rows) > block["limit"]
            rows = rows[:block["limit"]]
            size += len(superset_json.dumps(rows).encode("utf-8"))
            if size > 4000000:
                raise ReportError("Data exceeds 4 MB. Add filters or reduce the row limit.")
            results[block["id"]] = {"rows": rows, "keys": keys, "truncated": cut}
            truncated = truncated or cut
        return results, truncated
    
    
    def format_value(value, col):
        if value is None:
            return ""
        if col["format"] == "number":
            try:
                number = Decimal(str(value))
                if not number.is_finite():
                    return ""
                return f"{number:,.{col['decimals']}f}".translate(str.maketrans({",": ".", ".": ","}))
            except (ValueError, TypeError, OverflowError, InvalidOperation):
                pass
        if col["format"] == "date":
            try:
                if isinstance(value, (int, float)):
                    from datetime import timezone
                    return datetime.fromtimestamp(value / 1000, timezone.utc).strftime("%d/%m/%Y")
                return datetime.fromisoformat(str(value).replace("Z", "+00:00")).strftime("%d/%m/%Y")
            except (ValueError, TypeError, OverflowError, OSError):
                pass
        return str(value)
    
    
    def render_document(name, definition, results):
        page = definition["page"]
        blocks = []
        for block in definition["blocks"]:
            style = f"width:{block['width']}%;font-size:{block['font']}pt;text-align:{block['align']};"
            if block["pageBreak"]:
                style += "break-before:page;page-break-before:always;"
            if block["type"] == "text":
                content = '<div class="text">' + escape(block["text"]) + '</div>'
            else:
                result = results[block["id"]]
                headers = "".join("<th>" + escape(c["label"]) + "</th>" for c in block["columns"])
                rows = []
                for row in result["rows"]:
                    cells = "".join("<td>" + escape(format_value(row.get(key), col)) + "</td>"
                                    for key, col in zip(result["keys"], block["columns"]))
                    rows.append("<tr>" + cells + "</tr>")
                if not rows:
                    rows.append(f'<tr><td colspan="{len(block["columns"])}">No data.</td></tr>')
                content = ("<h3>" + escape(block["title"]) + "</h3>" if block["title"] else "")
                content += "<table><thead><tr>" + headers + "</tr></thead><tbody>" + "".join(rows) + "</tbody></table>"
                if result["truncated"]:
                    content += '<p class="warning">Data exceeds the row limit. Apply filters before exporting.</p>'
            blocks.append(f'<section style="{style}">{content}</section>')
        width = 297 if page["orientation"] == "landscape" else 210
        return f'''<!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'">
    <title>{escape(name)}</title><style>
