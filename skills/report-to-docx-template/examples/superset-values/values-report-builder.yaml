    """Grouped dataset reports with real repeating DOCX table rows. No new dependencies."""
    import io
    import json
    import re
    import zipfile
    
    from customsso.rt_office import (W, TOKEN, MAX_EXPANDED, OfficeError, HtmlPreview,
                                    children, groups, key, text, display, merge_nodes, word_line_breaks)
    from customsso.rt_format import normalize_bindings, numeric, formatted, aggregate_value
    
    
    def variables_in(node):
        return sorted({key(m) for nodes in groups(node, 'docx')
                       for m in TOKEN.finditer(''.join(text(n) for n in nodes))})
    
    
    def table_rows(dom):
        """Stable IDs refer to the immutable uploaded template, never to generated rows."""
        for ti, table in enumerate(dom.getElementsByTagNameNS(W, 'tbl')):
            for ri, row in enumerate(children(table, W, 'tr')):
                yield f't{ti + 1}r{ri + 1}', ti + 1, ri + 1, row
    
    
    def row_catalog(office):
        if office.extension != 'docx':
            return []
        if hasattr(office, '_repeat_catalog'):
            return office._repeat_catalog
        result = []
        for ident, ti, ri, row in table_rows(office.doms['word/document.xml']):
            variables = variables_in(row)
            if not variables:
                continue
            reason = ''
            # Cloning ranges/vertical merges/drawing IDs without their surrounding
            # structures can corrupt an Office document. Plain detail rows are safe.
            blocked = ('tbl', 'vMerge', 'tblHeader', 'bookmarkStart', 'bookmarkEnd',
                       'commentRangeStart', 'commentRangeEnd', 'commentReference',
                       'drawing', 'pict', 'sectPr', 'footnoteReference', 'endnoteReference')
            if any(row.getElementsByTagNameNS(W, tag) for tag in blocked):
                reason = 'Use a plain body row without nested tables, vertical merges, bookmarks or drawings.'
            parent = row.parentNode.parentNode
            while parent is not None:
                if getattr(parent, 'namespaceURI', '') == W and getattr(parent, 'localName', '') == 'tbl':
                    reason = 'Nested table rows cannot be repeated.'
                    break
                parent = parent.parentNode
            result.append({'id':ident, 'table':ti, 'row':ri, 'variables':variables,
                           'label':f'Table {ti}, row {ri}', 'reason':reason})
        office._repeat_catalog = result
        return result
    
    
    def validate_layout(office, rules):
        catalog = {item['id']:item for item in row_catalog(office)}
        for rule in rules:
            item = catalog.get(rule['id'])
            if item is None or item['reason']:
                raise OfficeError('Invalid repeating row ' + rule['id'] + '. ' +
                                  (item['reason'] if item else 'Reopen the template and choose a row again.'))
    
    
    def layout_metadata(office):
        catalog = row_catalog(office)
        locations = {v:set() for v in office.variables}
        if office.extension == 'docx':
            rows = {row:ident for ident, _, _, row in table_rows(office.doms['word/document.xml'])}
            for dom in office.doms.values():
                for nodes in groups(dom, 'docx'):
                    parent, location = nodes[0], 'common'
                    while parent is not None:
                        if parent in rows:
                            location = rows[parent]
                            break
                        parent = parent.parentNode
                    for m in TOKEN.finditer(''.join(text(n) for n in nodes)):
                        locations[key(m)].add(location)
        return {'repeat_candidates':catalog, 'variable_locations':{k:sorted(v) for k,v in locations.items()}}
    
    
    def normalize_multi(payload, names, extension, mapping):
        mode = payload.get('report_mode', 'per_row')
        if mode not in ('per_row', 'multi_row'):
            raise OfficeError('Invalid report mode.')
        normalize_bindings(payload, mapping, names, mode)
        if mode == 'per_row':
            return {'report_mode':mode, 'group_by':[], 'repeat_rows':[]}
        if extension != 'docx':
            raise OfficeError('Multiple rows per report currently requires a Word DOCX template.')
        group_by = payload.get('group_by', [])
        if not isinstance(group_by, list) or len(group_by) > 8 or any(not isinstance(c, str) or c not in names for c in group_by):
            raise OfficeError('Select up to 8 valid columns to group reports.')
        rules = payload.get('repeat_rows', [])
        if not isinstance(rules, list) or not 1 <= len(rules) <= 12:
            raise OfficeError('Select between 1 and 12 table rows to repeat.')
        normalized, seen = [], set()
        for item in rules:
            if not isinstance(item, dict) or not isinstance(item.get('id'), str) or not re.fullmatch(r't[1-9][0-9]*r[1-9][0-9]*', item['id']) or item['id'] in seen:
                raise OfficeError('Invalid or duplicate repeating row.')
            seen.add(item['id'])
            column, value = item.get('filter_column', ''), item.get('filter_value', '')
            if not isinstance(column, str) or column and column not in names or not isinstance(value, str) or len(value) > 2000:
                raise OfficeError('Invalid repeating-row filter.')
            normalized.append({'id':item['id'], 'filter_column':column, 'filter_value':value if column else ''})
        return {'report_mode':mode, 'group_by':list(dict.fromkeys(group_by)), 'repeat_rows':normalized}
    
    
    def group_indices(definition, rows, indices=None):
        indices = list(range(len(rows))) if indices is None else sorted(indices)
        if definition.get('report_mode', 'per_row') == 'per_row':
            return [[i] for i in indices]
        result = {}
        for i in indices:
            values = [rows[i].get(c) for c in definition.get('group_by', [])]
            group = json.dumps(values, ensure_ascii=False, sort_keys=True, default=str, allow_nan=False)
            result.setdefault(group, []).append(i)
        return list(result.values())
    
    
    def row_values(definition, row, variables=None):
        return {variable:formatted(row.get(binding['column']), binding, variable) if 'column' in binding else ''
                for variable, binding in definition['mapping'].items() if variables is None or variable in variables}
    
    
    def common_variables(office, repeat_ids):
        cache = getattr(office, '_common_variable_cache', {})
        cache_key = frozenset(repeat_ids)
        if cache_key in cache:
            return cache[cache_key]
        result = set()
        selected = {row for ident, _, _, row in table_rows(office.doms['word/document.xml']) if ident in repeat_ids}
        for dom in office.doms.values():
            for nodes in groups(dom, 'docx'):
                parent, inside = nodes[0], False
                while parent is not None:
                    if parent in selected:
                        inside = True
                        break
                    parent = parent.parentNode
                if not inside:
                    result.update(key(m) for m in TOKEN.finditer(''.join(text(n) for n in nodes)))
        cache[cache_key] = result
        office._common_variable_cache = cache
        return result
    
    
    def common_values(definition, rows, variables):
        values = {}
        for variable in variables:
            binding = definition['mapping'].get(variable, {'blank':True})
            if 'column' not in binding:
                values[variable] = ''
                continue
            value = aggregate_value(binding, rows, variable)
            values[variable] = formatted(value, binding, variable)
        return values
    
    
    def selected_rows(rule, rows):
        column = rule.get('filter_column')
        return [row for row in rows if display(row.get(column)) == rule['filter_value']] if column else rows
    
    
    def prepare_report(office, definition, rows, max_rows=2000):
        if not rows or len(rows) > max_rows:
            raise OfficeError(f'A report must contain between 1 and {max_rows:,} data rows. Narrow the selection or add grouping columns.')
        rules = definition.get('repeat_rows', [])
        validate_layout(office, rules)
        common = common_values(definition, rows, common_variables(office, {r['id'] for r in rules}))
        catalog = {item['id']:item for item in row_catalog(office)}
        repeat = {rule['id']:[row_values(definition, row, catalog[rule['id']]['variables'])
                             for row in selected_rows(rule, rows)] for rule in rules}
        if sum(len(values) for values in repeat.values()) > 5000:
            raise OfficeError('This report would generate more than 5,000 table rows. Narrow the selection.')
        if any(len(display(value)) > 50000 for values in [common] + [v for items in repeat.values() for v in items] for value in values.values()):
            raise OfficeError('A data value exceeds 50,000 characters.')
        return common, repeat
    
    
    def merge_report(office, definition, rows, max_rows=2000):
        if definition.get('report_mode', 'per_row') == 'per_row':
            return office.merge(row_values(definition, rows[0]))
        common, repeat = prepare_report(office, definition, rows, max_rows)
        output = dict(office.parts)
        size = sum(len(content) for name, content in output.items() if name not in office.doms)
        for name, original in office.doms.items():
            dom = original.cloneNode(True)
            selected = {ident:row for ident, _, _, row in table_rows(dom) if ident in repeat} if name == 'word/document.xml' else {}
            originals = set(selected.values())
            # Process common text before inserting rows. Dataset strings that happen
            # to contain {#...#} must never be treated as a second template pass.
            for nodes in groups(dom, 'docx'):
                parent, inside = nodes[0], False
                while parent is not None:
                    if parent in originals:
                        inside = True
                        break
                    parent = parent.parentNode
                if not inside:
                    merge_nodes(nodes, common)
                    word_line_breaks(nodes)
            estimated = size + len(dom.toxml(encoding='utf-8'))
            for ident, row in selected.items():
                for values in repeat[ident]:
                    copied = row.cloneNode(True)
                    for nodes in groups(copied, 'docx'):
                        merge_nodes(nodes, values)
                        word_line_breaks(nodes)
                    chunk_size = len(copied.toxml(encoding='utf-8'))
                    estimated += chunk_size
                    if estimated > MAX_EXPANDED:
                        raise OfficeError('The populated report exceeds 60 MB. Narrow the selection.')
                    row.parentNode.insertBefore(copied, row)
                row.parentNode.removeChild(row)
                row.unlink()
            output[name] = dom.toxml(encoding='utf-8')
            size += len(output[name])
            dom.unlink()
            if size > MAX_EXPANDED:
                raise OfficeError('The populated report exceeds 60 MB. Narrow the selection.')
        stream = io.BytesIO()
        with zipfile.ZipFile(stream, 'w', zipfile.ZIP_DEFLATED) as archive:
            for name, data in output.items():
                archive.writestr(name, data)
        return stream.getvalue()
    
    
    def preview_report(office, definition, rows, max_rows=2000):
        with zipfile.ZipFile(io.BytesIO(merge_report(office, definition, rows, max_rows))) as archive:
            parts = {name:archive.read(name) for name in archive.namelist()}
        return HtmlPreview(parts, office.extension, interactive=False).render()
