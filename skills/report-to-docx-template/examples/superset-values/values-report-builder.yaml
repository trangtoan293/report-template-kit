      document.addEventListener('change',event=> {
        const target=event.target;
        if(target.id==='rt-preview-scale'){fitPreview(byId('rt-document'));return;}
        if(target.id==='rt-name'){state.name=target.value;changed();return;}
        if(target.id==='rt-report-mode') {
          state.reportMode=target.value;changed();renderMultiSettings();renderMappings();return;
        }
        if(target.dataset.pickerColumn!==undefined) {
          updateColumnPicker(target.dataset.picker,target.dataset.pickerColumn,target.checked);return;
        }
        if(target.dataset.repeatId) {
          const id=target.dataset.repeatId;
          if(target.checked){if(state.repeatRows.length>=12){toast('Select up to 12 repeating rows.',true);target.checked=false;return;}state.repeatRows.push({id,filter_column:'',filter_value:''});}
          else state.repeatRows=state.repeatRows.filter(r=>r.id!==id);
          changed();renderMultiSettings();renderMappings();return;
        }
        if(target.dataset.repeatFilter) {
          const rule=state.repeatRows.find(r=>r.id===target.dataset.repeatRule);
          if(rule){rule[target.dataset.repeatFilter]=target.value;if(target.dataset.repeatFilter==='filter_column')rule.filter_value='';changed();renderMultiSettings();}
          return;
        }
        if(target.dataset.bindingOption) {
          updateBindingOption(target);if(target.tagName==='SELECT')renderMappings();
          return;
        }
        if(target.dataset.binding!==undefined) {
          const variable=target.dataset.binding;
          if(target.value==='blank')bind(variable,{blank:true});
          else if(target.value.startsWith('c'))bind(variable,{column:state.columns[Number(target.value.slice(1))].name});
          else bind(variable,{blank:true});return;
        }
        if(target.id==='rt-order'){state.order=target.value;changed();return;}
        if(target.id==='rt-descending'){state.descending=target.checked;changed();return;}
        if(target.dataset.filterProp) {
          const row=target.closest('[data-filter-context]'),context=row.dataset.filterContext;
          const f=(context==='editor'?state.filters:state.export.filters)[Number(row.dataset.filterIndex)],prop=target.dataset.filterProp;
          let value=target.value;
          if(prop==='value'&&['IN','NOT IN'].includes(f.op)) {
            try{value=JSON.parse(value);if(!Array.isArray(value))throw new Error();}
            catch(_){toast('IN filters require a JSON list, such as ["A","B"] or [1,2].',true);target.value=JSON.stringify(f.value);return;}
          }
          f[prop]=value;
          if(prop==='op') {
            if(['IS NULL','IS NOT NULL'].includes(value))f.value=null;
            else if(['IN','NOT IN'].includes(value))f.value=Array.isArray(f.value)?f.value:[f.value??''];
            else f.value=Array.isArray(f.value)?f.value[0]??'':f.value??'';
          }
          filterChanged(context);if(prop==='op'){if(context==='editor')renderEditorFilters();else renderExport();}return;
        }
        if(target.dataset.rowIndex!==undefined) {
          const i=Number(target.dataset.rowIndex);if(target.checked)state.export.selected.add(i);else state.export.selected.delete(i);renderRows();return;
        }
        if(target.id==='rt-select-page') {
          const ex=state.export;for(let i=ex.page*50;i<Math.min(ex.page*50+50,ex.snapshot.count);i++){if(target.checked)ex.selected.add(i);else ex.selected.delete(i);}renderRows();
        }
      });
      document.addEventListener('input',event=> {
        if(event.target.matches('input[data-binding-option]')){updateBindingOption(event.target);return;}
        if(event.target.dataset.pickerSearch){pickerSearch[event.target.dataset.pickerSearch]=event.target.value;filterColumnPicker(event.target.dataset.pickerSearch);return;}
        if(event.target.id==='rt-name'){state.name=event.target.value;changed();}
        if(event.target.id==='rt-search'){clearTimeout(searchTimer);++datasetGeneration;state.next=null;byId('rt-more').hidden=true;searchTimer=setTimeout(()=>loadDatasets().catch(error=>toast(error.message,true)),250);}
        if(event.target.id==='rt-column-search')renderColumns();
      });
      app.addEventListener('dragstart',event=>{const node=event.target.closest('[draggable][data-column]');if(node){event.dataTransfer.effectAllowed='copy';event.dataTransfer.setData('application/x-report-column',node.dataset.column);event.dataTransfer.setData('text/plain',node.dataset.column);}});
      app.addEventListener('dragover',event=>{if(event.target.closest('.mapping'))event.preventDefault();});
      app.addEventListener('drop',event=>{const node=event.target.closest('.mapping');if(node){event.preventDefault();const field=event.dataTransfer.getData('application/x-report-column');if(state.columns.some(c=>c.name===field))bind(node.dataset.key,{column:field});}});
      byId('rt-upload-form').addEventListener('submit',event=>{event.preventDefault();task('Processing and uploading template…',async()=>{
        const form=new FormData(event.target),file=form.get('file');if(!file||file.size>10*1024*1024)throw new Error('Select a file no larger than 10 MB.');
        const result=await api('/templates','POST',form);byId('rt-upload').close();await loadList();toast(`Uploaded template with ${result.variables.length} variables.`);
      });});
      observePreview(byId('rt-review-frame'));
      byId('rt-delete-confirm').addEventListener('click',deleteConfirmed);
      byId('rt-delete').addEventListener('cancel',event=>{if(byId('rt-delete').getAttribute('aria-busy')==='true')event.preventDefault();});
      byId('rt-delete').addEventListener('close',()=>{pendingDelete=null;});
      byId('rt-confirm-save').addEventListener('click',()=>task('Saving report…',saveReviewed));
      byId('rt-preview-pdf').addEventListener('click',()=>task('Converting preview to PDF…',downloadPreviewPdf));
      byId('rt-export-all').addEventListener('click',()=>task('Loading the entire dataset…',()=>exportRows(true)));
      byId('rt-export-selected').addEventListener('click',()=>task(cfg.backgroundExports?'Preparing background export…':'Generating reports…',()=>exportRows(false)));
      byId('rt-export-cancel').addEventListener('click',()=>exportController?.abort());
      byId('rt-export').addEventListener('close',()=>exportController?.abort());
      byId('rt-jobs').addEventListener('close',()=>clearTimeout(jobsTimer));
      window.addEventListener('online',()=>{if(byId('rt-jobs').open)refreshJobs();});
      byId('rt-review').addEventListener('close',()=>{byId('rt-review-frame').srcdoc='';});
      window.addEventListener('beforeunload',event=>{if(state.dirty||submittingExport||exportController){event.preventDefault();event.returnValue='';}});
      byId('rt-export-all').textContent=cfg.backgroundExports?'Export all as PDF':'Download all as PDF';
      byId('rt-export-selected').textContent=cfg.backgroundExports?'Export selected as PDF':'Download selected as PDF';
      for(const button of document.querySelectorAll('#rt-export [data-action="exports-open"]'))button.hidden=!cfg.backgroundExports;
      app.innerHTML='<div class="empty">Loading…</div>';
      task('Loading…',async()=>{if(state.view==='editor')await openEditor();else await loadList();byId('rt-status').className='';});
    })();
  rt_nav.html: |
    {# Navigation renders without the incompatible legacy React menu bundle. #}
    {% for font_url in config.get('CUSTOM_FONT_URLS', []) %}
    <link rel="stylesheet" href="{{ "{{" }} font_url }}">
    {% endfor %}
    <div id="app" data-bootstrap="{{ "{{" }} bootstrap_data }}" hidden></div>
    {% macro children(items) %}
      {% for item in items %}
        {% if item == '-' %}
          <hr>
        {% elif item is mapping %}
          {% if item.get('childs') %}
            <div class="rn-group-title">{{ "{{" }} item.get('label') or item.get('name', '') }}</div>
            {{ "{{" }} children(item['childs']) }}
          {% elif item.get('disable') %}
            <span class="rn-disabled" aria-disabled="true">{{ "{{" }} item.get('label') or item.get('name', '') }}</span>
          {% elif navigation_url(item.get('url')) %}
            <a href="{{ "{{" }} navigation_url(item.get('url')) }}">{{ "{{" }} item.get('label') or item.get('name', '') }}</a>
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endmacro %}
    <header id="rt-navigation">
      <nav aria-label="Main navigation" class="rn-bar">
        <ul class="rn-links">
          {% for item in navigation_items %}
            {% set active = item.get('name') == navigation_active %}
            {% set href = navigation_url(item.get('url')) %}
            {% if item.get('disable') %}
              <li><span class="rn-disabled" aria-disabled="true">{{ "{{" }} item.get('label') or item.get('name', '') }}</span></li>
            {% elif href %}
              <li><a href="{{ "{{" }} href }}"{% if active %} class="rn-active" aria-current="page"{% endif %}>{{ "{{" }} item.get('label') or item.get('name', '') }}</a></li>
            {% elif item.get('childs') %}
              <li><details class="rn-dropdown"><summary>{{ "{{" }} item.get('label') or item.get('name', '') }}<span class="rn-caret" aria-hidden="true"></span></summary><div class="rn-panel">{{ "{{" }} children(item['childs']) }}</div></details></li>
            {% endif %}
          {% endfor %}
        </ul>
        <ul class="rn-links rn-right">
          <li><details class="rn-dropdown"><summary>Settings<span class="rn-caret" aria-hidden="true"></span></summary><div class="rn-panel">
            {{ "{{" }} children(navigation_settings) }}
            {% if navigation_url(navigation_account.get('documentation_url')) %}
              <a href="{{ "{{" }} navigation_url(navigation_account.get('documentation_url')) }}">{{ "{{" }} navigation_account.get('documentation_text') or 'Documentation' }}</a>
            {% endif %}
            {% if navigation_url(navigation_account.get('bug_report_url')) %}
              <a href="{{ "{{" }} navigation_url(navigation_account.get('bug_report_url')) }}">{{ "{{" }} navigation_account.get('bug_report_text') or 'Report a bug' }}</a>
            {% endif %}
            <div class="rn-group-title">User</div>
            {% if navigation_url(navigation_account.get('user_info_url')) %}
              <a href="{{ "{{" }} navigation_url(navigation_account.get('user_info_url')) }}">Info</a>
            {% endif %}
            {% if navigation_url(navigation_account.get('user_logout_url')) %}
              <a href="{{ "{{" }} navigation_url(navigation_account.get('user_logout_url')) }}">Logout</a>
            {% endif %}
          </div></details></li>
        </ul>
      </nav>
    </header>
  rt_nav.css: |
    /* Superset light navigation layout, independent of the legacy React entry. */
    body{margin:0}
    #rt-navigation{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #f0f0f0;color:rgba(0,0,0,.88);font:14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.5715}
    #rt-navigation *{box-sizing:border-box}
    #rt-navigation .rn-bar{display:flex;align-items:center;min-height:48px;padding:0 16px;gap:16px;flex-wrap:wrap}
    #rt-navigation .rn-links{display:flex;align-items:center;flex-wrap:wrap;margin:0;padding:0;list-style:none;gap:0}
    #rt-navigation .rn-right{margin-left:auto}
    #rt-navigation .rn-links>li>a,#rt-navigation summary,#rt-navigation .rn-links>li>.rn-disabled{position:relative;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;color:inherit;font:inherit;text-decoration:none;white-space:nowrap;cursor:pointer;border:0;background:transparent}
    #rt-navigation summary{list-style:none}
    #rt-navigation summary::-webkit-details-marker{display:none}
    #rt-navigation .rn-links>li>a::after,#rt-navigation summary::after{position:absolute;bottom:0;left:0;right:0;height:2px;content:"";background:transparent}
    #rt-navigation .rn-links>li>a:hover,#rt-navigation .rn-links>li>a.rn-active,#rt-navigation details[open]>summary,#rt-navigation summary:hover{color:#20a7c9}
    #rt-navigation .rn-links>li>a.rn-active::after,#rt-navigation .rn-links>li>a:hover::after,#rt-navigation details[open]>summary::after{background:#20a7c9}
    #rt-navigation .rn-caret{width:6px;height:6px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg);margin-top:-3px;margin-left:2px}
    #rt-navigation .rn-dropdown{position:relative}
    #rt-navigation .rn-panel{position:absolute;top:100%;left:0;min-width:220px;max-width:min(360px,90vw);max-height:calc(100vh - 80px);overflow:auto;padding:6px 0;background:#fff;border-radius:4px;box-shadow:0 6px 16px #00000014,0 3px 6px #0000001f;z-index:101}
    #rt-navigation .rn-right .rn-panel{left:auto;right:0}
    #rt-navigation .rn-panel a,#rt-navigation .rn-panel>.rn-disabled{display:block;padding:7px 16px;color:inherit;text-decoration:none;line-height:22px}
    #rt-navigation .rn-panel a:hover{background:#f5f5f5;color:#20a7c9}
    #rt-navigation .rn-group-title{padding:8px 16px 4px;font-size:12px;color:#737373}
    #rt-navigation .rn-panel hr{margin:5px 0;border:0;border-top:1px solid #f0f0f0}
    #rt-navigation .rn-disabled{opacity:.45;cursor:default!important}
    #rt-navigation a:focus-visible,#rt-navigation summary:focus-visible{outline:2px solid #20a7c9;outline-offset:-3px;border-radius:3px}
    #rt-workflow{min-height:calc(100vh - var(--rt-nav-height,48px))}
    @media(max-width:700px){#rt-navigation .rn-bar{padding:0 8px;gap:0}#rt-navigation .rn-links>li>a,#rt-navigation summary{padding:0 10px}}
  rt_nav.js: |
    /* Progressive enhancement only: navigation links are rendered by the server. */
    (() => {
      'use strict';
      const menu=document.getElementById('rt-navigation'),workflow=document.getElementById('rt-workflow');
      if(!menu||!workflow)return;
      const dropdowns=[...menu.querySelectorAll('.rn-dropdown')];
      function closeExcept(keep){dropdowns.forEach(dropdown=>{if(dropdown!==keep)dropdown.open=false;});}
      for(const dropdown of dropdowns){
        dropdown.addEventListener('toggle',()=>{if(dropdown.open)closeExcept(dropdown);});
        dropdown.addEventListener('keydown',event=>{
          if(event.key==='Escape'){
            event.preventDefault();dropdown.open=false;dropdown.querySelector('summary').focus();
          }else if(event.key==='ArrowDown'&&event.target.tagName==='SUMMARY'){
            event.preventDefault();dropdown.open=true;dropdown.querySelector('.rn-panel a')?.focus();
          }
        });
      }
      document.addEventListener('click',event=>{if(!menu.contains(event.target))closeExcept(null);});
      document.addEventListener('focusin',event=>{if(!menu.contains(event.target))closeExcept(null);});
      function syncHeight(){workflow.style.setProperty('--rt-nav-height',menu.getBoundingClientRect().height+'px');}
      if(window.ResizeObserver)new ResizeObserver(syncHeight).observe(menu);
      syncHeight();
    })();

configOverrides:
  report_builder: |
    from customsso.report_workflow import make_blueprint as _make_report_workflow_blueprint

    REPORT_BUILDER_ENABLED = True
    REPORT_BUILDER_ALLOWED_ROLES = None
    REPORT_BUILDER_S3_PREFIX = "report-builder/v2"
    REPORT_BUILDER_MAX_EXPORT_ROWS = 5000
    REPORT_BUILDER_MAX_ROWS_PER_REPORT = 2000
    # One deadline setting for LibreOffice and its Python caller (+15s margin).
    REPORT_BUILDER_PDF_TIMEOUT = {{ $pdfTimeout := int .Values.reportPdf.timeoutSeconds }}{{ if or (lt $pdfTimeout 30) (gt $pdfTimeout 1200) }}{{ fail "reportPdf.timeoutSeconds must be between 30 and 1200 seconds" }}{{ end }}{{ add $pdfTimeout 15 }}
    # Derived from the single Helm flag; do not toggle this separately.
    REPORT_BUILDER_BACKGROUND_EXPORTS = {{ if .Values.reportExportWorker.enabled }}True{{ else }}False{{ end }}
    REPORT_BUILDER_EXPORT_TTL_HOURS = 24
    REPORT_BUILDER_MAX_ARCHIVE_MB = 200
    # By default reuse ATTEST_S3_ENDPOINT / BUCKET / ACCESS_KEY / SECRET_KEY /
    # REGION / VERIFY_TLS / TIMEOUT from the existing MinIO values overlay.
    # Optional overrides: REPORT_BUILDER_S3_ENDPOINT, REPORT_BUILDER_S3_BUCKET,
    # REPORT_BUILDER_S3_ACCESS_KEY, REPORT_BUILDER_S3_SECRET_KEY,
    # REPORT_BUILDER_S3_SESSION_TOKEN, REPORT_BUILDER_S3_REGION.
    # Supply credentials through Kubernetes Secret / environment as appropriate.
    BLUEPRINTS = list(globals().get("BLUEPRINTS") or []) + [_make_report_workflow_blueprint()]
