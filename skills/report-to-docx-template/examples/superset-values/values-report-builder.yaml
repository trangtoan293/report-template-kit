          `<a href="${reportUrl(item)}">Edit report</a>${item.source==='dashboard'?`<a href="${reportUrl(item)}">Export reports</a>`:btn('export-open','Export reports',`data-id="${esc(item.id)}"`)}`}${btn(templates?'template-delete':'report-delete','Delete',`class="danger" data-id="${esc(item.id)}"`)}</div></details></td></tr>`).join('')}
          </tbody></table>${items.length?'':`<div class="empty"><strong>${templates?'No templates yet':'No reports yet'}</strong>${templates?'Upload a file with {#column_name#} variables to get started.':'Choose a template, select Create report from its actions menu, then preview and save.'}</div>`}</div></main>`;
