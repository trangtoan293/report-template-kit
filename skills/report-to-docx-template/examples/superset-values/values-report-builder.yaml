          ${items.map(item=>`<tr><td><div class="row">${templates?`<span class="file-icon ${esc(item.extension)}">${esc(item.extension.toUpperCase())}</span>`:''}<div><strong>${templates?esc(item.name):`<a href="${reportUrl(item)}">${esc(item.name)}</a>`}</strong>${templates?`<div class="muted">${esc(item.extension.toUpperCase())} · Stored in S3</div>`:`<div class="muted">${item.source==='dashboard'?'Dashboard report':item.report_mode==='multi_row'?'Multiple rows per report':'One report per row'}</div>`}</div></div></td>
