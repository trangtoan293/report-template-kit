      function renderEditor() {
        app.innerHTML=`<div class="editor-bar"><a href="${cfg.root}/reports/">← Report</a><input id="rt-name" maxlength="200" aria-label="Report name" value="${esc(state.name)}"><span class="badge">${esc(state.template.name)}</span><span id="rt-save-state" class="muted grow">${state.dirty?'Unsaved changes':state.report?'Saved':'Map variables to your data'}</span>${exportHistory()}
          ${btn('review','Preview first 5 rows')}${btn('save','Save report','class="primary"')}${state.report?btn('copy','Save as copy',state.template.deleted?'disabled title="Upload this deleted template again to create a new report."':''):''}</div>
          <main class="editor-layout"><aside class="editor-side"><h2>Dataset</h2><label>Search datasets<input id="rt-search" type="search" placeholder="Search by dataset name…"></label><div id="rt-datasets" class="datasets"></div>${btn('more','Load more','id="rt-more" class="full tiny" hidden')}
          <div id="rt-multi-settings"></div><h3>Preview filters</h3><div id="rt-editor-filters" class="filters"></div>
          <label>Sort by<select id="rt-order"></select></label><label class="row"><input id="rt-descending" type="checkbox"${state.descending?' checked':''}>Descending</label>
