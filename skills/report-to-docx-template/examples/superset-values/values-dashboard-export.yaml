          if (!current()) return;
          direct.checking = false;
          if (restoring && ['queued','running'].includes(job.state) && job.export_context) {
            const context = job.export_context;
            if (direct.templates.some(t => t.id === context.template_id)) {
              direct.panel.querySelector('[name="template"]').value = context.template_id;
              if (direct.chartId === null && ['active','dashboard'].includes(context.scope)) {
                direct.panel.querySelector('[name="scope"]').value = context.scope;
