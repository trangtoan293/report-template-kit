        notice('Uploading the template...');
        const value=await call(rb,'/templates','POST',data);
        if(value.extension!=='docx'||!value.variables.includes('dashboard'))throw new Error('The uploaded template is missing the {#dashboard#} variable. Add the variable to the DOCX and upload again.');
        templates.push(value);template=value;changed();render();await choose(value.id);notice('Template uploaded. You can adjust the layout, then preview.');
