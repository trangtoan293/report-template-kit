        }
        if(job?.state==='ready'&&reviewRevision===revision){by('dt-open-pdf').click();return;}
        reserveTab();clearTimeout(timer);by('dt-review').disabled=true;saveEnabled(false);by('dt-pdf').hidden=true;by('dt-open-pdf').hidden=true;
        notice('Sending the request to fetch the full data and generate the PDF...');
        const submittedRevision=revision, submitted=JSON.parse(JSON.stringify(payload()));
        try{
          const value=await call(api,'/template-preview','POST',submitted);job=value.result;reviewRevision=submittedRevision;
          try{sessionStorage.setItem('dashboard-template:'+source.id,JSON.stringify({id:job.id,report_name:reportName,options:submitted.options,template_id:submitted.template_id}));}catch(_){}
          await poll();
        }catch(e){endTab('Could not generate the PDF. '+e.message);updateReviewButton();throw e;}
      }
      const statusRetryDelays=[2500,5000,10000,15000,15000];
      async function poll(retry=0){
        const pollingId=job?.id;if(!pollingId||pollAttempt)return;
        clearTimeout(timer);
        const attempt={};pollAttempt=attempt;updateReviewButton();
        try{
          const latest=(await call(api,'/exports/'+encodeURIComponent(pollingId))).result;
          if(job?.id!==pollingId||pollAttempt!==attempt)return;
          if(!latest||latest.id!==pollingId||!['queued','running','ready','failed','cancelled','expired'].includes(latest.state))throw new Error('The server returned an invalid report status. Please retry.');
          job=latest;statusFailed=false;
          by('dt-progress').textContent=`${job.completed}/${job.chart_count} charts · ${Number(job.row_count).toLocaleString('en-US')} rows`;
          if(['queued','running'].includes(job.state)){
            const stages={starting:'Starting the worker...',querying:'Fetching chart data...',formatting:'Formatting chart data...',
              finishing_report:'Building the Word document...',converting_pdf:'Converting Word to PDF...',saving_pdf:'Saving the PDF...'};
            const message=job.state==='queued'?(job.stage==='worker_stopped'?'The worker stopped. Waiting for another worker to retry this job...':'Waiting for an available export worker. No need to submit another job.'):(stages[job.stage]||'Preparing and checking the report...');
            notice(message);tabMessage(message+' '+by('dt-progress').textContent);timer=setTimeout(poll,2500);return;
          }
          updateReviewButton();
          if(job.state==='ready'){
            if(reviewRevision!==revision){endTab('The settings changed. Go back to the report to generate a new PDF.');notice('The previous PDF finished, but the current settings have changed; preview again before saving.');return;}
            saveEnabled(true);by('dt-pdf').href=api+'/exports/'+job.id+'/download';by('dt-pdf').hidden=false;
            by('dt-open-pdf').href=pdfUrl(job.id);by('dt-open-pdf').hidden=false;
            const opened=openReadyTab(job.id);
            notice(opened?'The PDF opened in a new tab. Check it before saving the report.':'The PDF is ready. Click Preview PDF or Open PDF in new tab to view it before saving the report.');
          }else{endTab(job.error||'Could not generate the PDF. Go back to the report for details.');notice([job.error||'The report is not ready.',job.stage,job.chart_id!=null?'Chart '+job.chart_id:'',job.error_type,'Job ID: '+job.id].filter(Boolean).join(' · '),true);}
        }catch(e){
          if(job?.id!==pollingId||pollAttempt!==attempt)return;
          if(e.retryable&&retry<statusRetryDelays.length){
            statusFailed=false;saveEnabled(false);
            const delay=statusRetryDelays[retry];
            const message=`The status connection was interrupted. Retrying in ${delay/1000}s (${retry+1}/${statusRetryDelays.length}). Checking the same report; no new job will be created.`;
            tabMessage(message);notice(message);
            timer=setTimeout(()=>poll(retry+1),delay);return;
          }
          statusFailed=true;saveEnabled(false);
          const message='Could not refresh the report status. '+e.message+' Click Refresh status to check the same job. Job ID: '+pollingId;
          tabMessage(message);notice(message,true);
        }finally{
          if(pollAttempt===attempt){pollAttempt=null;updateReviewButton();}
        }
      }
      async function save(asNew=false){
        if(!reportName.trim())throw new Error('Enter a report name before saving.');
        record=await call(api,'/template-reports','POST',{...payload(),save_as_new:asNew});reportId=record.id;draftId=null;
        history.replaceState({},'',cfg.root+'/report-builder/?dashboard_report='+encodeURIComponent(record.id));
        by('dt-copy').hidden=false;by('dt-save').textContent='Update report';
        notice(asNew?'Saved as a new report. The previous report is unchanged.':'Saved. The report appears in the Report list.');
      }
      function closeFilters(){if(filterDialog){filterDialog.close();filterDialog.remove();filterDialog=null;}}
      async function openFilters(){
        closeFilters();
        const dialog=filterDialog=document.createElement('dialog');dialog.className='dt-filter-dialog';
        dialog.innerHTML=`<div class="dt-filter-heading"><h2>Report filters · ${esc(source.title)}</h2><button type="button" data-close aria-label="Close filters">×</button></div><div class="dt-filter-controls"><label>Data <select data-mode><option value="current">Using the selected filters</option><option value="all">All — ignore dashboard filters</option></select></label><p>Choose filters and click Apply filters in the dashboard, then Apply to report. The report's chart scope is kept unchanged.</p></div><p data-status role="status">Opening filters...</p><iframe title="Edit dashboard filters" referrerpolicy="same-origin"></iframe><div class="dt-filter-actions"><button type="button" data-close>Cancel</button><button type="button" data-apply class="primary">Apply to report</button></div>`;
        by('rt-workflow').appendChild(dialog);dialog.showModal();
        const status=dialog.querySelector('[data-status]'),frame=dialog.querySelector('iframe'),mode=dialog.querySelector('[data-mode]'),apply=dialog.querySelector('[data-apply]');
        mode.value=source.filter_mode;apply.disabled=true;
        dialog.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeFilters);
        dialog.addEventListener('cancel',e=>{e.preventDefault();closeFilters();});
        let state=source.filter_state,restored=!!state;
        try{
          if(!state&&source.legacy_filter_key){
            try{
              const old=await call(cfg.root,`/api/v1/dashboard/${source.dashboard_id}/filter_state/${encodeURIComponent(source.legacy_filter_key)}`);
              state={data_mask:JSON.parse(old.value),url_params:{}};restored=true;
            }catch(_){/* Old cache keys may expire; make the starting scope explicit. */}
          }
          const url=new URL(`${cfg.root}/superset/dashboard/${source.dashboard_id}/`,location.href);
          for(const [key,value] of Object.entries(state?.url_params||{})){
            if(!['native_filters','native_filters_key','permalink_key','standalone','edit','tab_id'].includes(key))url.searchParams.set(key,value);
          }
          // Superset mode 2 hides global navigation and the dashboard title/actions,
          // while keeping native filters and dashboard tabs available in this iframe.
          url.searchParams.set('standalone','2');
          if(state){
            const result=await call(cfg.root,`/api/v1/dashboard/${source.dashboard_id}/filter_state`,'POST',{value:JSON.stringify(state.data_mask)});
            if(!result.key)throw new Error('Could not restore the saved filters. Close and reopen the filters window.');
            url.searchParams.set('native_filters_key',result.key);
          }
          if(filterDialog!==dialog)return;
          status.textContent=restored?'Filters were opened from the report configuration.':'The previous report has no saved filter state, or it has expired. Reselect filters in the dashboard below; the report only changes when you click Apply.';
          frame.onload=()=>{if(filterDialog===dialog)apply.disabled=false;};frame.src=url.href;
        }catch(e){status.textContent=e.message;status.className='dt-error';return;}
        apply.onclick=async()=>{
          apply.disabled=true;status.className='';status.textContent='Fetching filters and checking the report scope...';
          try{
            const capture=frame.contentWindow?.__dashboardExport?.captureReportFilters;
            if(typeof capture!=='function')throw new Error('The dashboard has not finished loading, or the login session has expired. Wait for it to finish loading and try again.');
            const snapshot=await capture({...source,filter_mode:mode.value});
            const value=await call(api,'/template-filters','POST',{...payload(),snapshot});
            if(filterDialog!==dialog)return;
            changed();clearTimeout(timer);source=value.result;draftId=source.id;
            const query=new URLSearchParams({dashboard_draft:draftId});if(reportId)query.set('dashboard_report',reportId);
            history.replaceState({},'',cfg.root+'/report-builder/?'+query);
            // choose() cancels the previous queued/running job before clearing it.
            closeFilters();render();if(template)await choose(template.id);else job=null;
            notice('Custom filters applied to the report. Preview the PDF, then update or save as new.');
          }catch(e){if(filterDialog===dialog){status.textContent=e.message;status.className='dt-error';apply.disabled=false;}}
        };
      }
      async function start(){
        const query=new URLSearchParams();if(reportId)query.set('report',reportId);if(draftId)query.set('draft',draftId);
        const response=await call(api,'/template-editor?'+query);
        source=response.source;templates=response.templates;record=response.report;
        opts=record?.options||{...opts,title:source.title,chart_titles:Object.fromEntries(source.charts.map(c=>[String(c.id),c.title]))};
        let resumed=null;
        if(!record||draftId){try{resumed=JSON.parse(sessionStorage.getItem('dashboard-template:'+source.id));}catch(_){} }
        if(resumed){opts=resumed.options;}
        reportName=resumed?.report_name??record?.name??opts.title??source.title;
        const templateId=resumed?.template_id||record?.template_id||templates[0]?.id;
        template=templates.find(t=>t.id===templateId)||null;
        render();
        if(template){await choose(template.id);by('dt-template').value=template.id;}
        const resumeId=resumed?.id||(!draftId?record?.last_job_id:null);
        if(template&&resumeId){job={id:resumeId};reviewRevision=revision;await poll();}
      }
      start().catch(e=>{app.innerHTML=`<main class="rt-content"><h1>Could not open the report</h1><p>${esc(e.message)}</p><a href="${cfg.root}/reports/">Back to Report</a></main>`;});
    })();
