    def print_options():
        family = str(setting('FONT_FAMILY', 'Noto Sans'))
        if not re.fullmatch(r'[\w ,\-]{1,100}', family, re.UNICODE):
            raise ExportError('The PDF font name is invalid.')
        locale = setting('NUMBER_LOCALE', 'chart')
        d3 = current_app.config.get('D3_FORMAT', {}) if has_app_context() else {}
        decimal, thousands = (',', '.') if locale == 'vi' else ('.', ',')
        if locale == 'chart' and isinstance(d3, dict):
            decimal, thousands = d3.get('decimal', '.'), d3.get('thousands', ',')
        return {'font': family, 'decimal': decimal, 'thousands': thousands,
                'date_timezone': setting('DATE_TIMEZONE', 'UTC'),
                'columns': min(12, max(3, int(setting('COLUMNS_PER_GROUP', 8))))}
    
    
