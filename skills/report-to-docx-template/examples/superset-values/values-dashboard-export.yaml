    """Complete dashboard data reports, installed as a Helm-mounted Blueprint.
    
    Export keeps chart query limits and removes table display pagination only.
    A PDF is published only after every expected query succeeds.
    """
    import copy
    import gzip
    import hashlib
    import json
    import logging
    import math
    import os
    import re
    import tempfile
    import time
    import zlib
    from datetime import date, datetime, timezone
    from contextlib import ExitStack
    from functools import wraps
    from html import escape
    from pathlib import Path
    from uuid import UUID, uuid4
    
    import requests
    from flask import Blueprint, Response, current_app, g, has_app_context, request, stream_with_context, url_for
    
    from customsso.dr_errors import ExportError
    from customsso.dr_storage import Store, Conflict, Missing
    from customsso.dr_format import raw_text, table_rules, formatted_cell
    
    LOG = logging.getLogger('hanas.dashboard_export')
    API = '/api/v1/dashboard_export'
    VERSION = '1.5.5'
    DIRECT_EXPORT_ROWS_PER_CHART = 20000
    TERMINAL = {'ready', 'failed', 'cancelled'}
    
    
    def setting(name, default):
        return current_app.config.get('DASHBOARD_EXPORT_' + name, default) if has_app_context() else default
    
    
    def identifier(value):
        try:
            return str(UUID(str(value)))
        except (TypeError, ValueError, AttributeError) as ex:
            raise ExportError('The report ID is invalid.') from ex
    
    
    def integer(value, name, maximum=2147483647):
        if type(value) is not int or not 0 < value <= maximum:
            raise ExportError(f'{name} is invalid.')
        return value
    
    
    def reply(value, status=200):
        return Response(json.dumps(value, ensure_ascii=False, allow_nan=False), status=status,
                        mimetype='application/json', headers={'Cache-Control': 'no-store'})
    
    
    def export_permission():
        from superset import security_manager
        user = getattr(g, 'user', None)
        if not user or not user.is_authenticated or not user.is_active or security_manager.is_guest_user(user):
            raise ExportError('You must be logged in to export a report.')
        if not security_manager.can_access('can_csv', 'Superset'):
            raise ExportError('This account does not have data export permission (can_csv).')
        roles = setting('ALLOWED_ROLES', None)
        if roles is not None and not set(roles).intersection(role.name for role in user.roles):
            raise ExportError('This account does not have permission to use Export reports.')
    
    
    def report_admin():
        user = getattr(g, 'user', None)
        return bool(user and user.is_authenticated and user.is_active
                    and any(role.name == 'Admin' for role in user.roles))
    
    
    def require_report_admin():
        if not report_admin():
            from werkzeug.exceptions import Forbidden
            raise Forbidden('Only Superset Admin can use Report dashboard.')
    
    
    def protected(fn):
        @wraps(fn)
        def wrapped(*args, **kwargs):
            from werkzeug.exceptions import HTTPException
            from flask_wtf.csrf import validate_csrf
            from wtforms.validators import ValidationError
            from superset.exceptions import SupersetSecurityException
            try:
                if not setting('ENABLED', True):
                    return reply({'message': 'Export reports is turned off.'}, 404)
                export_permission()
                if request.method not in ('GET', 'HEAD'):
                    validate_csrf(request.headers.get('X-CSRFToken'))
                return fn(*args, **kwargs)
            except ValidationError:
                return reply({'message': 'The session expired. Reload the page and try again.'}, 400)
            except Missing:
                return reply({'message': 'No report was found for this account.'}, 404)
            except Conflict:
                return reply({'message': 'The report state has changed. Please try again.'}, 409)
            except SupersetSecurityException:
                return reply({'message': 'You do not have permission to access this data.'}, 403)
            except ExportError as ex:
                return reply({'message': str(ex)}, 400)
            except HTTPException as ex:
                return reply({'message':ex.description}, ex.code)
            except Exception:
                LOG.exception('Dashboard export request failed')
                return reply({'message': 'Could not process the report. Check the hanas.dashboard_export log.'}, 500)
        return wrapped
    
    
    def chart_order(layout, scope, active_tabs):
        """Traverse saved layout, not just currently mounted/visible DOM elements."""
        if not isinstance(layout, dict) or 'ROOT_ID' not in layout:
            raise ExportError('Could not read the dashboard layout. Save the dashboard and try again.')
        result, visited = [], set()
    
        def walk(key):
            if key in visited:
                raise ExportError('The dashboard layout has a loop or a duplicate element.')
            visited.add(key)
            node = layout.get(key)
            if not isinstance(node, dict):
                raise ExportError('The dashboard layout is missing an element.')
            if node.get('type') == 'CHART':
                value = integer(node.get('meta', {}).get('chartId'), 'Chart ID')
                if value not in result:
                    result.append(value)
            children = node.get('children') or []
            if node.get('type') == 'TABS' and scope == 'active':
                children = [next((key for key in children if key in active_tabs), children[0])] if children else []
            for child in children:
                walk(child)
        walk('ROOT_ID')
        return result
    
    
    def dashboard_access(dashboard_id):
        from superset.daos.dashboard import DashboardDAO
        return DashboardDAO.get_by_id_or_slug(str(dashboard_id))
    
    
    def create_context(chart, raw, dashboard_id, *, row_limit_cap=None):
        """Same schema/access pipeline as /chart/data; no browser-provided SQL execution."""
        from superset.charts.schemas import ChartDataQueryContextSchema
        from superset.commands.chart.data.get_data_command import ChartDataCommand
        if not isinstance(raw, dict):
            raise ExportError(f'Chart {chart.id}: the currently displayed query is missing.')
        raw = copy.deepcopy(raw)
        datasource = raw.get('datasource', {})
        if (str(datasource.get('id')) != str(chart.datasource_id)
                or datasource.get('type') != chart.datasource_type):
            raise ExportError(f'Chart {chart.id}: the data source does not match the saved chart.')
        form = raw.get('form_data') or {}
        if not isinstance(form, dict) or form.get('viz_type') != chart.viz_type:
            raise ExportError(f'Chart {chart.id}: the chart type does not match.')
        form.update(slice_id=chart.id, dashboardId=dashboard_id)
        raw['form_data'] = form
        queries = raw.get('queries')
        if not isinstance(queries, list) or not 1 <= len(queries) <= 30:
            raise ExportError(f'Chart {chart.id}: the number of queries is invalid.')
        # The auto-generated pagination COUNT is not a data series. Keep real totals
        # and additional series; never merge them into the first query's rows.
        raw['queries'] = [q for q in queries if not q.get('is_rowcount')]
        if not raw['queries']:
            raise ExportError(f'Chart {chart.id}: there is no data query.')
        for query in raw['queries']:
            query.pop('result_type', None)
        if chart.viz_type == 'table':
            # Table buildQuery replaces the main row limit with pageSize when
            # server pagination is enabled. Restore the chart's configured limit
            # BEFORE schema.load so Superset still applies its normal defaults/caps.
            # Extra queries (totals/percentage denominators) keep their own limits.
            main_query = raw['queries'][0]
            if form.get('server_pagination'):
                limit_form = form
                if 'row_limit' not in limit_form:
                    limit_form = getattr(chart, 'form_data', None) or {}
                if 'row_limit' not in limit_form:
                    raise ExportError(f'Chart {chart.id}: the overall Row limit is missing. Reload the dashboard and create a new report.')
                limit = limit_form['row_limit']
                if isinstance(limit, str) and limit.strip().isdigit():
                    limit = int(limit.strip())
                if limit is not None and (type(limit) is not int or not 0 <= limit <= 2147483647):
                    raise ExportError(f'Chart {chart.id}: the Row limit is invalid.')
                main_query['row_limit'] = limit
            main_query['row_offset'] = 0
        raw.pop('custom_cache_timeout', None)
        raw.update(result_format='json', result_type='full', force=True)
        g.form_data = form
        # Superset's schema @post_load already returns a QueryContext instance.
        context = ChartDataQueryContextSchema().load(raw)
        context.custom_cache_timeout = -1
        if chart.datasource_type != 'table':
            raise ExportError(f'Chart {chart.id}: source {chart.datasource_type} does not support verifying a full-row export yet.')
        for query in context.queries:
            if row_limit_cap is not None:
                # One extra row detects overflow rather than silently publishing a
                # truncated report. Keep any lower chart/Superset limit unchanged.
                limit = query.row_limit
                if limit is not None and (type(limit) is not int or limit < 0):
                    raise ExportError(f'Chart {chart.id}: the Row limit is invalid.')
                query.row_limit = min(limit, row_limit_cap + 1) if limit else row_limit_cap + 1
            query.validate()
        command = ChartDataCommand(context)
        command.validate()
        return context, command
    
    
    def context_fingerprint(context):
        # Includes datasource definition, query, RLS and current-user template keys.
        keys = [context.query_cache_key(query) for query in context.queries]
        if not all(keys):
            raise ExportError("Could not verify the query's data scope.")
        return hashlib.sha256(json.dumps(keys).encode()).hexdigest()
    
    
    def prepare(payload, *, allow_single_chart=False, direct_export=False):
        export_permission()
        dashboard_id = integer(payload.get('dashboard_id'), 'Dashboard ID')
        dashboard = dashboard_access(dashboard_id)
        scope = payload.get('scope', 'dashboard')
        mode = payload.get('filter_mode', 'current')
        scopes = ('dashboard', 'active', 'chart') if allow_single_chart else ('dashboard', 'active')
        if scope not in scopes or mode not in ('current', 'all'):
            raise ExportError('The report scope is invalid.')
        tabs = payload.get('active_tabs') or []
        if not isinstance(tabs, list) or not all(isinstance(x, str) for x in tabs):
            raise ExportError('The tab list is invalid.')
        expected = chart_order(json.loads(dashboard.position_json or '{}'), scope, tabs)
        if scope == 'chart':
            selected = integer(payload.get('chart_id'), 'Chart ID')
            if selected not in expected:
                raise ExportError('The selected chart is no longer in this dashboard. Reload the dashboard and try again.')
            expected = [selected]
        charts = payload.get('charts')
        if not isinstance(charts, list) or not 1 <= len(charts) <= 200:
            raise ExportError('A report needs between 1 and 200 charts.')
        received = [c.get('id') for c in charts if isinstance(c, dict)]
        if received != expected or len(received) != len(charts) or any(type(value) is not int for value in received):
            raise ExportError('The chart list is incomplete, or the dashboard has changed. Reload the dashboard and export again.')
        available = {chart.id: chart for chart in dashboard.slices}
        normalized = []
        row_limit_cap = DIRECT_EXPORT_ROWS_PER_CHART if direct_export else None
        for item in charts:
            chart = available.get(item['id'])
            if chart is None:
                raise ExportError('The chart does not belong to this dashboard.')
            raw = copy.deepcopy(item.get('query_context'))
            context, _ = create_context(chart, raw, dashboard_id, row_limit_cap=row_limit_cap)
            # Resolve relative ranges NOW, not when a queued worker eventually runs.
            raw['queries'] = [q for q in raw['queries'] if not q.get('is_rowcount')]
            for source, query in zip(raw['queries'], context.queries):
                if query.from_dttm is not None or query.to_dttm is not None:
                    left = query.from_dttm.isoformat() if query.from_dttm is not None else ''
                    right = query.to_dttm.isoformat() if query.to_dttm is not None else ''
                    source['time_range'] = f'{left} : {right}'
                for filt in source.get('filters', []):
                    if filt.get('op') == 'TEMPORAL_RANGE' and isinstance(filt.get('val'), str):
                        from superset.utils.date_parser import get_since_until
                        left, right = get_since_until(time_range=filt['val'])
                        if left is not None or right is not None:
                            filt['val'] = f'{left.isoformat() if left else ""} : {right.isoformat() if right else ""}'
            context, _ = create_context(chart, raw, dashboard_id, row_limit_cap=row_limit_cap)
            image = item.get('image', '')
            if image and (not isinstance(image, str) or len(image) > 2000000
                          or not re.fullmatch(r'data:image/png;base64,[A-Za-z0-9+/=]+', image)):
                raise ExportError('The chart image is invalid or exceeds 2 MB.')
            normalized.append({'id': chart.id, 'title': chart.slice_name,
                               'query_context': raw, 'fingerprint': context_fingerprint(context),
                               'image': image})
        labels = payload.get('filter_labels', [])
        if not isinstance(labels, list) or len(labels) > 200 or any(not isinstance(v, str) or len(v) > 10000 for v in labels):
            raise ExportError('The filter description is invalid.')
        editor = payload.get('filter_state')
        if editor is not None:
            if (not isinstance(editor, dict) or not isinstance(editor.get('data_mask'), dict)
                    or not isinstance(editor.get('url_params', {}), dict)
                    or len(json.dumps(editor).encode()) > 1024 * 1024):
                raise ExportError('The filter state is invalid or exceeds 1 MiB.')
            if any(not isinstance(k, str) or not isinstance(v, dict) for k, v in editor['data_mask'].items()):
                raise ExportError('The filter state is invalid.')
            if any(not isinstance(k, str) or not isinstance(v, str) for k, v in editor.get('url_params', {}).items()):
                raise ExportError('The dashboard parameters are invalid.')
        return {'dashboard_id': dashboard_id, 'title': dashboard.dashboard_title,
                **({'direct_row_limit': row_limit_cap} if direct_export else {}),
                'scope': scope, 'filter_mode': mode, 'active_tabs': tabs,
                'filter_labels': labels, 'charts': normalized, 'row_limit_policy': 'chart',
                'filter_state': copy.deepcopy(editor),
                'filter_names': {item['id']:item.get('name') or item['id']
                                 for item in (json.loads(dashboard.json_metadata or '{}').get('native_filter_configuration') or [])
                                 if isinstance(item, dict) and isinstance(item.get('id'), str)}}
    
    
    def key(store, job_id):
        return f'{store.prefix}/jobs/{store.user}/{identifier(job_id)}.json'
    
    
    def input_key(store, job_id):
        return f'{store.prefix}/data/{store.user}/{identifier(job_id)}/input.json'
    
    
    def load_job(store, job_id):
        job, etag = store.get_json(key(store, job_id))
        if str(job.get('owner_id')) != store.user:
            raise Missing('No report was found.')
        return job, etag
    
    
    def public(job):
        fields = ('id', 'dashboard_id', 'title', 'state', 'created', 'expires',
                  'completed', 'chart_count', 'row_count', 'error', 'counts')
        result = {name: job[name] for name in fields}
        # Older jobs remain readable after an overlay upgrade. Never return the
        # exception message/traceback, SQL, credentials or the private lease token.
        for name in ('stage', 'chart_id', 'error_type', 'worker_version', 'attempts', 'completed_at', 'export_context'):
            result[name] = job.get(name)
        if time.time() >= job['expires']:
            result['state'] = 'expired'
        return result
    
    
    def check_job_access(job, snapshot, check_fingerprints=False, on_chart=None):
        export_permission()
        if job['owner_id'] != g.user.id or time.time() >= job['expires']:
            raise ExportError('The report has expired or does not belong to this account.')
        dashboard = dashboard_access(job['dashboard_id'])
        if check_fingerprints:
            available = {chart.id: chart for chart in dashboard.slices}
            for item in snapshot['charts']:
                if on_chart:
                    on_chart(item['id'])
                chart = available.get(item['id'])
                if chart is None:
                    raise ExportError('The chart has been removed from the dashboard. Export the report again.')
                context, _ = create_context(chart, item['query_context'], dashboard.id,
                                            row_limit_cap=snapshot.get('direct_row_limit'))
                if context_fingerprint(context) != item['fingerprint']:
                    if snapshot.get('row_limit_policy') != 'chart':
                        raise ExportError('This older report used the Row-limit-removed export method. Open the dashboard and create a new report to reconcile against the chart limit.')
                    raise ExportError('The data source or row-filtering permissions have changed. Export the report again.')
        return dashboard
    
    
