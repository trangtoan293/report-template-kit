          const key=mark.dataset.key;
          if(key==='dashboard'||!Object.prototype.hasOwnProperty.call(opts.texts,key))continue;
          const value=variableValue(key);
          if(key==='datetime'){
            mark.textContent='{#datetime#}';
            mark.title='Filled automatically with the system export date when you generate the PDF.';
            continue;
          }
          mark.textContent=value||'{#'+key+'#}';
          mark.style.whiteSpace='pre-wrap';
          mark.title=value?'Value to insert in the exported report':'No value entered; this variable will be blank in the export.';
        }
      }
      function renderVariables(){
        const allowed=new Set(template.variables.filter(key=>key!=='dashboard'));
        const keys=[...new Set([...variableOrder,...allowed])].filter(key=>allowed.has(key)),filters=source.text_filter_options||[];
        opts.texts=Object.fromEntries(keys.map(key=>[key,opts.texts?.[key]||'']));
        opts.text_filters=Object.fromEntries(keys.filter(key=>key!=='datetime'&&opts.text_filters?.[key]).map(key=>[key,opts.text_filters[key]]));
        by('dt-texts').innerHTML=keys.length?`<hr><h3>Template variables</h3><p class="form-help">Variables follow their first appearance in the template. Click a variable in the preview to jump to its field here. Enter text or use an applied report filter. Multiple selected values are joined with commas. The dashboard variable is filled automatically.</p>${keys.map((key,index)=>{
          const binding=opts.text_filters[key],filter=textFilter(key),missing=!!binding&&!filter;
          if(key==='datetime')return '<div class="dt-variable-card" data-variable="datetime" tabindex="0"><strong>{#datetime#}</strong><p class="form-help">Automatically filled with the system export date in the configured report timezone. Format: ngày DD tháng MM năm YYYY. The Word template controls font size and alignment.</p></div>';
          return `<div class="dt-variable-card" data-variable="${esc(key)}"><strong>{#${esc(key)}#}</strong><label>Value source<select data-variable-source aria-label="Value source for ${esc(key)}"><option value="">Manual entry</option>${missing?`<option value="${esc(binding)}" selected>Selected filter unavailable</option>`:''}${filters.length?`<optgroup label="Applied report filters">${filters.map(item=>`<option value="${esc(item.id)}"${binding===item.id?' selected':''}>${esc(item.name)} — ${esc(item.value.length>80?item.value.slice(0,80)+'…':item.value)}</option>`).join('')}</optgroup>`:''}</select></label><label>${binding?'Filter value':'Text value'}<textarea data-variable-value maxlength="2000" aria-describedby="dt-variable-help-${index}"${binding?' readonly':''}>${esc(variableValue(key))}</textarea></label><p id="dt-variable-help-${index}" class="${missing?'dt-error':'form-help'}" data-variable-help>${missing?'This filter has no applied value. Choose another filter or Manual entry.':binding?'Updates when you apply new report filters.':filters.length?'Leave empty to print this variable as blank.':'No applied filters available. Enter text or use Edit filters.'}</p></div>`;
        }).join('')}`:'';
        by('dt-texts').querySelectorAll('[data-variable]').forEach(card=>{
          const key=card.dataset.variable;
          card.onfocusin=()=>selectVariable(key);
          if(key==='datetime')return;
          card.querySelector('[data-variable-source]').onchange=e=>{
            const current=variableValue(key);
