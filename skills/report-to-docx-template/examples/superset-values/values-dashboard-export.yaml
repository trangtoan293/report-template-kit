      async function guard(fn){if(busy)return;busy=true;try{await fn();}catch(e){notice(e.message,true);}finally{busy=false;updateReviewButton();}}
      async function choose(id){
        variableOrder=[];activeVariable=null;
        app.querySelector('.dt-binding')?.classList.remove('is-selected');
        endTab('The report template changed. Go back to the report screen and click Preview PDF to generate a new version.');
        const previous=job;
        clearTimeout(timer);job=null;pollAttempt=null;statusFailed=false;by('dt-status-actions').hidden=true;by('dt-review').disabled=true;by('dt-progress').textContent='';
        by('dt-pdf').hidden=true;by('dt-open-pdf').hidden=true;saveEnabled(false);
        if(previous&&['queued','running'].includes(previous.state)){
