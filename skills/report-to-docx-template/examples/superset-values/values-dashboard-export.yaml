    """Stream complete dashboard tables into a standalone DOCX dashboard slot."""
    import base64
    import copy
    import re
    import struct
    import zipfile
    from datetime import datetime
    from zoneinfo import ZoneInfo
    from html import escape
    from uuid import uuid4
    
    from customsso.dr_errors import ExportError
    
    W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'
    # Bound Word's pagination work without truncating the query result. Each block
    # repeats its header; by default new blocks start on a new printed page.
    DEFAULT_TABLE_ROWS_PER_BLOCK = 200
    
    
    def slot(office):
        from customsso.rt_office import groups, text, TOKEN, key
        found = []
        for name, dom in office.doms.items():
            for nodes in groups(dom, 'docx'):
                joined = ''.join(text(n) for n in nodes)
                matches = [m for m in TOKEN.finditer(joined) if key(m) == 'dashboard']
                if not matches:
                    continue
                p = nodes[0].parentNode
                while p is not None and not (p.namespaceURI == W and p.localName == 'p'):
                    p = p.parentNode
                if (name != 'word/document.xml' or not p or p.parentNode.localName != 'body'
                        or p.getElementsByTagNameNS(W, 'sectPr') or len(matches) != 1
                        or joined.strip() != matches[0].group(0)):
                    raise ExportError('Place {#dashboard#} in its own paragraph in the DOCX body, outside tables, headers and footers.')
                found.append(p)
        if office.extension != 'docx' or len(found) != 1:
            raise ExportError('The DOCX template needs exactly one {#dashboard#} variable in its own paragraph.')
        return found[0]
    
    
    def xml_text(value):
        text = str(value)
        if re.search(r'[\x00-\x08\x0b\x0c\x0e-\x1f\ud800-\udfff]', text):
            raise ExportError('The data contains characters that are invalid for DOCX; a file with missing data will not be exported.')
        return escape(text).replace('\r\n', '\n').replace('\r', '\n').replace('\n', '</w:t><w:br/><w:t xml:space="preserve">')
    
    
    class DocxReport:
        def __init__(self, output, snapshot, max_bytes, office):
            from customsso.rt_office import groups, text, TOKEN, key, merge_nodes, word_line_breaks, first, val
            from customsso.dashboard_export import print_options, setting
            slot(office)
            self.config = snapshot['template']['options']
            self.options = print_options()
            self.size, self.maximum, self.notes = 0, max_bytes, set()
            self.table_rows, self.table_columns = 0, 0
            self.table_blocks = 0
            self.parts = dict(office.parts)
            document = office.doms['word/document.xml'].cloneNode(True)
            working = copy.copy(office)
            working.doms = {'word/document.xml': document}
            target = slot(working)
            body = target.parentNode
            siblings = list(body.childNodes)
            # The next sectPr after the slot defines its section's page geometry.
            section = None
            for node in siblings[siblings.index(target) + 1:]:
                if getattr(node, 'namespaceURI', None) != W:
                    continue
                if node.localName == 'sectPr':
                    section = node
                elif node.localName == 'p':
                    sections = node.getElementsByTagNameNS(W, 'sectPr')
                    section = sections[0] if sections else None
                if section is not None:
                    break
            if section is None:
                raise ExportError('Could not determine the page size at the {#dashboard#} position.')
            page, margin = first(section, W, 'pgSz'), first(section, W, 'pgMar')
            columns = first(section, W, 'cols')
            if columns is not None and (int(val(columns, name='num', default='1')) != 1 or first(columns, W, 'col')):
                raise ExportError('The dashboard container must use a single-column Word layout.')
            self.width = int(val(page, name='w', default='11906')) - sum(int(val(margin, name=x, default='1440')) for x in ('left', 'right')) - int(val(margin, name='gutter', default='0'))
            if self.width < 1800:
                raise ExportError('The printable area in the template is too narrow for the dashboard table.')
            # Inherit the slot's Latin font, then document defaults. Only generated
            # content uses the selected size; the surrounding template is untouched.
            self.font = 'Times New Roman'
            from customsso.rt_office import xml
            styles = xml(self.parts['word/styles.xml']) if 'word/styles.xml' in self.parts else None
            fonts = list(target.getElementsByTagNameNS(W, 'rFonts'))
            if styles:
                fonts += list(styles.getElementsByTagNameNS(W, 'rFonts'))
            for node in fonts:
                value = val(node, name='ascii') or val(node, name='hAnsi') or val(node, name='cs')
                if value:
                    self.font = value
                    break
            self.anchor = target
            self.marker = 'DASHBOARD_' + uuid4().hex
            target.parentNode.replaceChild(document.createComment(self.marker), target)
            document.documentElement.setAttribute('xmlns:w', W)
            texts = dict(self.config.get('texts', {}))
            if 'datetime' in office.variables:
                zone = ZoneInfo(setting('REPORT_TIMEZONE', 'Asia/Ho_Chi_Minh'))
                stamp = snapshot.get('export_created_at')
                exported = datetime.fromtimestamp(stamp, zone) if stamp is not None else datetime.now(zone)
                texts['datetime'] = f'ngày {exported.day:02d} tháng {exported.month:02d} năm {exported.year}'
            for name, original in office.doms.items():
                dom = document if name == 'word/document.xml' else original.cloneNode(True)
                changed = name == 'word/document.xml'
                for nodes in groups(dom, 'docx'):
                    joined = ''.join(text(n) for n in nodes)
                    if TOKEN.search(joined):
                        merge_nodes(nodes, texts)
                        word_line_breaks(nodes)
                        changed = True
                if changed:
                    self.parts[name] = dom.toxml(encoding='utf-8')
            prefix, self.suffix = self.parts.pop('word/document.xml').split(('<!--' + self.marker + '-->').encode())
            self.output = output
            self.archive = zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED)
            self.entry = self.archive.open('word/document.xml', 'w', force_zip64=True)
            self.images = []
            self.write(prefix)
            if self.config['show_title']:
                self.paragraph(self.config['title'], bold=True, size=self.config['font_size'] + 3,
                               align='center', keep=True, space_after=480 if snapshot.get('direct_export') else 80)
            filter_labels = snapshot.get('filter_labels', [])
            if self.config['show_filters'] and filter_labels:
                self.paragraph('Bộ lọc áp dụng:', bold=True, keep=True)
                for label in filter_labels:
                    self.paragraph('• ' + label)
    
        def write(self, content):
            data = content.encode('utf-8') if isinstance(content, str) else content
            self.size += len(data)
            if self.size > self.maximum:
                raise ExportError(
                    f"The report's uncompressed DOCX XML exceeds {self.maximum / 1048576:g} MiB "
                    f'(generated {self.size / 1048576:.2f} MiB). '
                    f'Table being processed: {self.table_rows:,} rows × {self.table_columns} columns. '
                    'Data was not truncated. This limit is dashboardExport.maxDocxXmlMb; '
                    'check the filters and the actual number of rows received before increasing it.')
            self.entry.write(data)
    
        def paragraph_xml(self, text, bold=False, size=None, align='left', keep=False, cell=False, space_after=None):
            font = escape(self.font, quote=True)
            after = (0 if cell else 80) if space_after is None else int(space_after)
            return (f'<w:p><w:pPr><w:spacing w:before="0" w:after="{after}" w:line="240" w:lineRule="auto"/><w:jc w:val="{align}"/>'
                    + ('<w:keepNext/>' if keep else '') + '</w:pPr><w:r><w:rPr>'
                    f'<w:rFonts w:ascii="{font}" w:hAnsi="{font}" w:eastAsia="{font}" w:cs="{font}"/>'
                    f'<w:sz w:val="{int((size or self.config["font_size"]) * 2)}"/>'
                    + ('<w:b/>' if bold else '') + '</w:rPr><w:t xml:space="preserve">'
                    + xml_text(text) + '</w:t></w:r></w:p>')
    
        def paragraph(self, text, **kwargs):
            self.write(self.paragraph_xml(text, **kwargs))
    
        def chart(self, item, tables):
            from customsso.dr_format import formatted_cell, pivot_header_rows, pivot_row_spans
            from customsso.dashboard_export import setting
            block_limit = setting('DOCX_TABLE_ROWS_PER_BLOCK', DEFAULT_TABLE_ROWS_PER_BLOCK)
            page_break = setting('DOCX_BLOCK_PAGE_BREAK', True)
            if type(block_limit) is not int or not 0 <= block_limit <= 2000:
                raise ExportError('docxTableRowsPerBlock must be an integer between 0 and 2000 (0 disables splitting).')
            if type(page_break) is not bool:
                raise ExportError('docxBlockPageBreak must be true or false.')
            title = self.config['chart_titles'].get(str(item['id']), item['title'])
            self.paragraph(title, bold=True, size=self.config['font_size'] + 1, keep=True)
            if self.config['include_images'] and item.get('image'):
                self.picture(item['image'])
            identity = self.config.get('chart_id_columns', {}).get(str(item['id']), {})
            selected = identity.get('columns', []) if identity.get('enabled') else []
            present = {name for table in tables for name in table['columns']}
            present.update(name for table in tables for name, col in table.get('identity_columns', {}).items()
                           if col in table['columns'])
            if set(selected) - present:
                raise ExportError(f'{title}: an identifying column is missing from the query result. Reload the column list and reselect it.')
            for table in tables:
                columns = table['columns']
                self.table_rows, self.table_columns = len(table['rows']), len(columns)
                # Keep a readable minimum column width, including in portrait templates.
                index_width = max(650, self.config['font_size'] * 40 + 160,
                                  len(str(len(table['rows']))) * self.config['font_size'] * 12 + 160)
                width = min(self.config['columns_per_group'], max(1, (self.width - index_width) // 1000))
                aliases = table.get('identity_columns', {})
                ids = list(dict.fromkeys(aliases.get(col, col) for col in selected if aliases.get(col, col) in columns))
                if len(columns) > width and selected and len(ids) != len(selected):
                    raise ExportError(f'{title}: the selected identifiers are not available in every split result table. Choose identifiers shared by these tables.')
                if len(columns) > width and len(ids) >= width:
                    raise ExportError(f'{title}: this template fits only {width} data columns per group. Select fewer identifying columns or use a wider page layout.')
                if len(columns) <= width:
                    groups = [columns]
                else:
                    remaining = [col for col in columns if col not in ids]
                    step = width - len(ids)
                    groups = [ids + remaining[start:start + step] for start in range(0, len(remaining), step)]
                for group_index, group in enumerate(groups):
                    if table.get('name'):
                        self.paragraph(table['name'], bold=True, keep=True)
                    if len(groups) > 1:
                        self.paragraph(f'Column group {group_index + 1} of {len(groups)}'
                                       + (' · Identifying columns repeated' if ids else ''), keep=True)
                    widths = [index_width] + [(self.width - index_width) // max(1, len(group))] * len(group)
                    if group:
                        widths[-1] += self.width - sum(widths)
                    table_open = (f'<w:tbl><w:tblPr><w:tblW w:w="{sum(widths)}" w:type="dxa"/>'
                               '<w:tblLayout w:type="fixed"/><w:tblInd w:w="0" w:type="dxa"/>'
                               '<w:tblBorders>' + ''.join(f'<w:{edge} w:val="single" w:sz="4" w:color="B8C4CE"/>' for edge in ('top','left','bottom','right','insideH','insideV'))
                               + '</w:tblBorders><w:tblCellMar><w:top w:w="70" w:type="dxa"/><w:bottom w:w="70" w:type="dxa"/>'
                               '<w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr>'
                               '<w:tblGrid>' + ''.join(f'<w:gridCol w:w="{n}"/>' for n in widths) + '</w:tblGrid>')
                    is_pivot = 'pivot_column_paths' in table
                    block_size = block_limit or max(1, len(table['rows']))
                    for start in range(0, max(1, len(table['rows'])), block_size):
                        if start:
                            # Separate the tables so Word does not coalesce them.
                            # A page-break paragraph keeps the next header at the top
                            # of a page without imposing any fixed data-row height.
                            self.write('<w:p><w:pPr>' + ('<w:pageBreakBefore/>' if page_break else '')
                                       + '<w:keepNext/><w:spacing w:before="0" w:after="0" '
                                       'w:line="1" w:lineRule="exact"/></w:pPr></w:p>')
                        self.write(table_open)
                        self.table_blocks += 1
                        records = table['rows'][start:start + block_size]
                        # Recompute merge runs within the block: a dimension spanning
                        # its boundary must restart with its label in the new table.
                        spans = pivot_row_spans(dict(table, rows=records), group) if is_pivot else {}
                        if is_pivot:
                            self.pivot_headers(pivot_header_rows(table, group), widths)
                        else:
                            self.row(['No.'] + [table.get('labels', {}).get(col, col) for col in group], widths, header=True)
                        for index, record in enumerate(records):
                            values, aligns = [str(start + index + 1)], ['left']
                            for col in group:
                                rule = table.get('formats', {}).get(col, {})
                                value, note = formatted_cell(record.get(col), rule, self.options)
                                if note:
                                    self.notes.add(f'{title} / {col}: {note}')
                                values.append(value)
                                aligns.append(rule.get('align') or ('right' if rule.get('kind') == 'number' else 'left'))
                            merges = [None] + [('continue' if spans[col][index] == 0 else 'restart' if spans[col][index] > 1 else None)
                                               if col in spans else None for col in group] if is_pivot else None
                            self.row(values, widths, aligns=aligns, merges=merges)
                        if not records:
                            self.row([''] + ['No data' if i == 0 else '' for i in range(len(group))], widths)
                        self.write('</w:tbl>')
                    self.paragraph('')
    
        def pivot_headers(self, rows, widths):
            for cells in rows:
                self.write('<w:tr><w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>')
                for cell in cells:
                    width = sum(widths[cell['start']:cell['start'] + cell['span']])
                    self.write(f'<w:tc><w:tcPr><w:tcW w:w="{width}" w:type="dxa"/>'
                               + (f'<w:gridSpan w:val="{cell["span"]}"/>' if cell['span'] > 1 else '')
                               + (f'<w:vMerge w:val="{cell["vmerge"]}"/>' if cell['vmerge'] else '')
                               + '<w:shd w:fill="EAF2F8"/><w:vAlign w:val="top"/></w:tcPr>'
                               + self.paragraph_xml(cell['text'], bold=True, cell=True, keep=True) + '</w:tc>')
                self.write('</w:tr>')
    
        def row(self, values, widths, header=False, aligns=None, merges=None):
