dashboardExport:
  # The combined overlay selects dedicated mode. Keep embedded for standalone use.
  deploymentMode: embedded
  replicas: 1
  concurrencyPerWorker: 1
  terminationGracePeriodSeconds: 60
  leaseSeconds: 180
  heartbeatSeconds: 30
  pollSeconds: 5
  maxAttempts: 3
  converters:
    libreOffice:
      enabled: true
    chromium:
      enabled: true
  # Per export pod; these do not resize Superset Web or Celery.
  workerResources:
    requests: {cpu: 200m, memory: 512Mi, ephemeral-storage: 256Mi}
    limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 2Gi}
  libreOfficeResources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  chromiumResources:
    requests: {cpu: 200m, memory: 512Mi, ephemeral-storage: 256Mi}
    limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi}
  pdfImage: gotenberg/gotenberg:8.37.0-chromium
  imagePullPolicy: IfNotPresent
  maxRowsPerQuery: 500000
  maxHtmlMb: 100
  # Uncompressed word/document.xml across all charts; separate from ZIP/PDF size.
  maxDocxXmlMb: 100
  # Limit Word pagination work per table; 0 restores continuous tables.
  docxTableRowsPerBlock: 200
  # Keep continuation headers at the top of a new page.
  docxBlockPageBreak: true
  # Applies to BOTH ordinary dashboard PDFs and dashboard DOCX template PDFs.
  maxPdfMb: 200
  # Covers querying, building Word/HTML, converting PDF and saving the result.
  jobTimeoutSeconds: 5400
  retentionHours: 24
  fontFamily: Noto Sans
  fontBundleKey: ""
  fontBundleSha256: ""
  numberLocale: chart
  dateTimezone: UTC
  reportTimezone: Asia/Ho_Chi_Minh
  columnsPerGroup: 8

extraVolumes:
  - name: dashboard-export-fonts
    emptyDir: {sizeLimit: 300Mi}

extraVolumeMounts: []

# These lists replace extraContainers from earlier overlays. The three overlays
# in note.txt have no extraContainers. See DASHBOARD_EXPORT.md before combining
# with values-report-builder.yaml or other sidecars.
supersetNode:
  extraInitContainers:
    - name: dashboard-export-fonts
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: "{{ .Values.image.pullPolicy }}"
      command:
        - /bin/sh
        - -ec
        - |
          export PYTHONPATH="{{ .Values.configMountPath }}:${PYTHONPATH:-}"
          exec python {{ .Values.extraConfigMountPath }}/dr_pdf_fonts.py
      envFrom:
        - secretRef: {name: "{{ tpl .Values.envFromSecret . }}"}
      env:
        - {name: DASHBOARD_PDF_FONT_KEY, value: "{{ .Values.dashboardExport.fontBundleKey }}"}
        - {name: DASHBOARD_PDF_FONT_SHA256, value: "{{ .Values.dashboardExport.fontBundleSha256 }}"}
        - name: DASHBOARD_PDF_EXTRA_ENV_B64
          value: '{{ .Values.extraEnv | toJson | b64enc }}'
      securityContext: {runAsUser: 0, allowPrivilegeEscalation: false}
      volumeMounts:
        - {name: superset-extra-config, mountPath: "{{ .Values.extraConfigMountPath }}", readOnly: true}
        - {name: dashboard-export-fonts, mountPath: /app/dashboard-pdf}
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: "1", memory: 768Mi}
  extraContainers:
    - name: dashboard-export-pdf
      image: "{{ .Values.dashboardExport.pdfImage }}"
      imagePullPolicy: "{{ .Values.dashboardExport.imagePullPolicy }}"
      args:
        - /bin/sh
        - -ec
        - |
          fc-cache -f /usr/local/share/fonts/dashboard-export
          exec gotenberg
      volumeMounts:
        - {name: dashboard-export-fonts, mountPath: /usr/local/share/fonts/dashboard-export}
      env:
        - {name: API_BIND_IP, value: "127.0.0.1"}
        - {name: API_PORT, value: "3001"}
        - {name: API_TIMEOUT, value: "1200s"}
        - {name: API_BODY_LIMIT, value: "110MB"}
        - {name: API_DISABLE_DOWNLOAD_FROM, value: "true"}
        # Recycle after each attempt; do not keep an idle browser resident.
        - {name: CHROMIUM_AUTO_START, value: "false"}
        - {name: CHROMIUM_RESTART_AFTER, value: "1"}
        - {name: CHROMIUM_IDLE_SHUTDOWN_TIMEOUT, value: "60s"}
        - {name: CHROMIUM_MAX_CONCURRENCY, value: "1"}
        - {name: CHROMIUM_MAX_QUEUE_SIZE, value: "2"}
        - {name: CHROMIUM_DISABLE_JAVASCRIPT, value: "true"}
        - {name: CHROMIUM_DENY_LIST, value: '^https?://.*,^file:(?!///tmp/).*'}
        - {name: WEBHOOK_DISABLE, value: "true"}
        - {name: OTEL_TRACES_EXPORTER, value: "none"}
        - {name: OTEL_METRICS_EXPORTER, value: "none"}
        - {name: OTEL_LOGS_EXPORTER, value: "none"}
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      startupProbe:
        exec:
          command: [curl, --fail, --silent, --max-time, "3", "http://127.0.0.1:3001/health"]
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 36
      readinessProbe:
        exec:
          command: [curl, --fail, --silent, --max-time, "3", "http://127.0.0.1:3001/health"]
        periodSeconds: 10
        timeoutSeconds: 5
      livenessProbe:
        exec:
          command: [curl, --fail, --silent, --max-time, "3", "http://127.0.0.1:3001/health"]
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      resources:
        requests: {cpu: 200m, memory: 512Mi, ephemeral-storage: 256Mi}
        limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi}
    - name: dashboard-export-worker
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: "{{ .Values.image.pullPolicy }}"
      command:
        - /bin/sh
        - -ec
        - |
          export PYTHONPATH="{{ .Values.configMountPath }}:${PYTHONPATH:-}"
          exec python {{ .Values.extraConfigMountPath }}/dr_worker.py
      envFrom:
        - secretRef:
            name: "{{ tpl .Values.envFromSecret . }}"
      env:
        - name: SUPERSET_CONFIG_PATH
          value: "{{ .Values.configMountPath }}/superset_config.py"
        - name: DASHBOARD_EXPORT_EXTRA_ENV_B64
          value: '{{ merge (deepCopy (.Values.supersetNode.env | default dict)) .Values.extraEnv | toJson | b64enc }}'
      volumeMounts:
        - {name: superset-config, mountPath: "{{ .Values.configMountPath }}", readOnly: true}
        - {name: superset-extra-config, mountPath: "{{ .Values.extraConfigMountPath }}", readOnly: true}
      resources:
        requests: {cpu: 200m, memory: 512Mi, ephemeral-storage: 256Mi}
        limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 2Gi}

# Disable the former embedded viewer. No PDF.js ConfigMap is needed.
dashboardPdfViewer:
  enabled: false

extraConfigs:
  reporting_s3_lock.py: |
    """Cooperative S3 write coordination for OCI's S3 compatibility endpoint.
    
    All writers of a bucket/key must use this module and the same PostgreSQL
    metadata database. No tables, migrations, or persistent database rows are used.
    This is NOT a cross-service transaction: PostgreSQL failover/loss of a lock
    while an S3 PUT is in flight requires stopping writers and reconciling the
    object before resuming. Never retry an uncertain PUT as an unconditional write.
    """
    import hashlib
    import json
    import os
    from contextlib import contextmanager
    from urllib.parse import urlsplit
    
    from flask import current_app
    
    
    def write_mode(endpoint, error_type):
        mode = str(current_app.config.get(
            "REPORTING_S3_WRITE_MODE", os.environ.get("REPORTING_S3_WRITE_MODE", "auto")
        )).strip().lower()
        if mode == "auto":
            host = (urlsplit(endpoint).hostname or "").lower()
            # Exact OCI domain boundary, not a substring match of arbitrary hosts.
            oracle = (host.endswith(".oraclecloud.com")
                      or host.endswith(".oraclecloud.com.cn"))
            return "postgres_advisory" if oracle and ".compat.objectstorage." in host else "s3"
        if mode not in ("s3", "postgres_advisory"):
            raise error_type("REPORTING_S3_WRITE_MODE must be auto, s3, or postgres_advisory.")
        return mode
    
    
    @contextmanager
    def object_lock(bucket, key, error_type):
        from sqlalchemy import text
        from sqlalchemy.exc import SQLAlchemyError
        from superset import db
    
        # Omit endpoint/credentials so aliases and different accounts writing the
        # same object still coordinate. Separate buckets/keys keep independent locks.
        identity = json.dumps(["hanas-reporting-s3-v1", bucket, key], separators=(",", ":"))
        lock_id = int.from_bytes(hashlib.sha256(identity.encode("utf-8")).digest()[:8],
                                 "big", signed=True)
        try:
            timeout = int(current_app.config.get(
                "REPORTING_S3_LOCK_TIMEOUT_SECONDS",
                os.environ.get("REPORTING_S3_LOCK_TIMEOUT_SECONDS", "5")))
        except (TypeError, ValueError) as ex:
            raise error_type("REPORTING_S3_LOCK_TIMEOUT_SECONDS must be an integer from 1 to 30.") from ex
        if not 1 <= timeout <= 30:
            raise error_type("REPORTING_S3_LOCK_TIMEOUT_SECONDS must be between 1 and 30.")
    
        try:
            engine = db.engine
            if engine.dialect.name != "postgresql":
                raise error_type("Oracle S3 write coordination requires a shared PostgreSQL metadata database.")
            # Independent connection: never commit/rollback the caller's ORM session.
            # Transaction-scoped locks cannot leak when a connection returns to a pool.
            with engine.connect() as connection:
                with connection.begin():
                    connection.execute(text("SELECT set_config('lock_timeout', :timeout, true)"),
                                       {"timeout": str(timeout * 1000) + "ms"})
                    connection.execute(text("SELECT set_config('statement_timeout', :timeout, true)"),
                                       {"timeout": str((timeout + 1) * 1000) + "ms"})
                    # The transaction intentionally waits on S3; a server idle timeout
                    # must not silently release its lock during a normal upload.
                    connection.execute(text("SELECT set_config('idle_in_transaction_session_timeout', '0', true)"))
                    connection.execute(text("SELECT pg_advisory_xact_lock(:key)"), {"key": lock_id})
                    backend = connection.execute(text("SELECT pg_backend_pid()")).scalar()
    
                    def confirm():
                        if (connection.invalidated or
                                connection.execute(text("SELECT pg_backend_pid()")).scalar() != backend):
                            raise error_type("The reporting storage lock was lost. Stop exports and check the object state before retrying.")
    
                    yield confirm
                    confirm()
        except SQLAlchemyError as ex:
            # A disconnected database is never a reason to fall back to a naked PUT.
            raise error_type(
                "Reporting storage coordination failed. If this happened during an upload or database failover, "
                "stop exports and check the object state before retrying."
            ) from ex
    
    
    def guarded_put(store, key, data, mime, etag, create, error_type, conflict_type, missing_type):
        """Serialize HEAD/check/PUT among participating writers, per bucket/key."""
        if not create and not etag:
            raise error_type("Missing ETag for a safe update. Reload this item from S3.")
        with object_lock(store.bucket, key, error_type) as confirm:
            try:
                current = store.head(key)
            except missing_type:
                current = None
            confirm()
            if create:
                if current is not None:
                    raise conflict_type("This S3 object already exists. Reload it before updating.")
            else:
                if current is None:
                    raise conflict_type("This S3 object no longer exists. Reload it before updating.")
                actual = current.get("ETag")
                if not actual:
                    raise error_type("S3 did not return an ETag. Check the storage endpoint.")
                if actual != etag:
                    raise conflict_type("Content was changed in another window. Reload it or save a copy.")
            # The condition was checked inside the shared lock. The OCI compatibility
            # API is not relied on to enforce conditional headers in this mode.
            result = store.request("PUT", key, body=data, headers={"Content-Type": mime})[1]
            confirm()
            if not result:
                raise error_type("S3 did not return an ETag after writing. Reload the object before retrying.")
            return result
  dr_errors.py: |
    """Errors that may be shown to the export owner."""
    
    
    class ExportError(Exception):
        pass
  dr_storage.py: |
    """Private S3 storage using SigV4 and existing requests dependency."""
    import hashlib
    import hmac
    import json
    import logging
    import os
    from datetime import datetime, timezone
    from urllib.parse import quote, urlsplit
    from xml.etree import ElementTree
    
    import requests
    from flask import current_app, g
    
    from customsso.dr_errors import ExportError
    from customsso.reporting_s3_lock import guarded_put, write_mode
    
    LOG = logging.getLogger("hanas.dashboard_export")
    
    
    class StoreError(ExportError):
        pass
    
    
    class Conflict(StoreError):
        pass
    
    
    class Missing(StoreError):
        pass
    
    
    def setting(name, fallback=""):
        own = current_app.config.get("DASHBOARD_EXPORT_S3_" + name)
        return str(own if own is not None else os.environ.get("DASHBOARD_EXPORT_S3_" + name,
                   os.environ.get("ATTEST_S3_" + name, fallback))).strip()
    
    
    class Store:
        def __init__(self, user_id=None):
            self.endpoint = setting("ENDPOINT").rstrip("/")
            self.bucket = setting("BUCKET", "superset-attestation")
            self.access = setting("ACCESS_KEY")
            self.secret = setting("SECRET_KEY")
            self.token = setting("SESSION_TOKEN")
            self.region = setting("REGION", "us-east-1")
            self.verify = setting("VERIFY_TLS", "true").lower() not in ("0", "false", "no")
            self.timeout = min(60, max(3, int(setting("TIMEOUT", "15"))))
            # Never inherit ATTEST_S3_PREFIX: these objects have a different schema.
            self.prefix = str(current_app.config.get("DASHBOARD_EXPORT_S3_PREFIX", "dashboard-export/v1")).strip("/")
            self.user = str(g.user.id if user_id is None else user_id)
            parsed = urlsplit(self.endpoint)
            if parsed.scheme not in ("http", "https") or not parsed.netloc or parsed.query or parsed.fragment or parsed.username or not self.access or not self.secret:
                raise StoreError("S3 is not configured for Dashboard Export. Check the server endpoint, bucket and credentials.")
            self.host = parsed.netloc
            self.path = parsed.path.rstrip("/")
            self.write_mode = write_mode(self.endpoint, StoreError)
    
        def user_key(self, kind, identifier, extension="json"):
            return f"{self.prefix}/users/{self.user}/{kind}/{identifier}.{extension}"
    
        def snapshot_key(self, identifier):
            return f"{self.prefix}/snapshots/{self.user}/{identifier}.json"
    
        def open(self, method, key, body=b"", query=None, headers=None, allow_range_error=False):
            # File uploads are hashed in chunks, then streamed by requests.
            digest = hashlib.sha256()
            if hasattr(body, "read"):
                body.seek(0)
                for chunk in iter(lambda: body.read(1024 * 1024), b""):
                    digest.update(chunk)
                body.seek(0)
            else:
                digest.update(body)
            now = datetime.now(timezone.utc)
            amzdate, day = now.strftime("%Y%m%dT%H%M%SZ"), now.strftime("%Y%m%d")
            path = quote(self.path + "/" + self.bucket + ("/" + key if key else ""), safe="/-_.~")
            qs = "&".join(quote(str(k), safe="-_.~") + "=" + quote(str(v), safe="-_.~") for k,v in sorted((query or {}).items()))
            outgoing = {"host":self.host, "x-amz-date":amzdate,
                        "x-amz-content-sha256":digest.hexdigest()}
            if self.token:
                outgoing["x-amz-security-token"] = self.token
            outgoing.update({k.lower(): str(v).strip() for k,v in (headers or {}).items()})
            signed = ";".join(sorted(outgoing))
            canonical_headers = "".join(k + ":" + outgoing[k] + "\n" for k in sorted(outgoing))
            canonical = "\n".join((method, path, qs, canonical_headers, signed, outgoing["x-amz-content-sha256"]))
            scope = f"{day}/{self.region}/s3/aws4_request"
            to_sign = "\n".join(("AWS4-HMAC-SHA256", amzdate, scope, hashlib.sha256(canonical.encode()).hexdigest()))
            signing_key = ("AWS4" + self.secret).encode()
            for part in (day, self.region, "s3", "aws4_request"):
                signing_key = hmac.new(signing_key, part.encode(), hashlib.sha256).digest()
            signature = hmac.new(signing_key, to_sign.encode(), hashlib.sha256).hexdigest()
            outgoing["Authorization"] = f"AWS4-HMAC-SHA256 Credential={self.access}/{scope}, SignedHeaders={signed}, Signature={signature}"
            origin = urlsplit(self.endpoint).scheme + "://" + self.host
            try:
                response = requests.request(method, origin + path + ("?" + qs if qs else ""), data=body,
                                            headers=outgoing, timeout=(5, self.timeout), verify=self.verify,
                                            allow_redirects=False, stream=True)
                code = response.status_code
                if 200 <= code < 300 or (allow_range_error and code == 416):
                    return response
                response.close()
                if code == 404:
                    raise Missing("The S3 object or bucket was not found.")
                if code in (409, 412):
                    raise Conflict("Content was changed in another window. Reload it or save a copy.")
                LOG.error("Report storage %s failed: HTTP %s", method, code)
                raise StoreError(f"S3 returned {code}. Check connectivity and GET/PUT/LIST permissions on the dashboard-export prefix.")
            except requests.RequestException as ex:
                raise StoreError("Unable to connect to S3. Check the endpoint and pod network access.") from ex
    
        def request(self, method, key, body=b"", query=None, headers=None, limit=24 * 1024 * 1024):
            try:
                with self.open(method, key, body, query, headers) as response:
                    chunks, size = [], 0
                    for chunk in response.iter_content(65536):
                        size += len(chunk)
                        if size > limit:
                            raise StoreError("The S3 object exceeds the allowed size.")
                        chunks.append(chunk)
                    return b"".join(chunks), response.headers.get("ETag", "")
            except requests.RequestException as ex:
                LOG.warning("Report storage network failure: %s", type(ex).__name__)
                raise StoreError("Unable to connect to S3. Check the endpoint and pod network access.") from ex
    
        def get(self, key, limit=24 * 1024 * 1024):
            return self.request("GET", key, limit=limit)
    
        def head(self, key):
            with self.open("HEAD", key) as response:
                return response.headers.copy()
    
        def keys(self, prefix):
            """Paginate the durable export queue, independently of UI catalog limits."""
            query = {"list-type":"2", "prefix":prefix, "max-keys":"1000"}
            while True:
                content, _ = self.request("GET", "", query=query, limit=2000000)
                if b"<!DOCTYPE" in content or b"<!ENTITY" in content:
                    raise StoreError("Invalid S3 response.")
                root = ElementTree.fromstring(content)
                ns = {"s":"http://s3.amazonaws.com/doc/2006-03-01/"}
                for node in root.findall("s:Contents/s:Key", ns):
                    if node.text and node.text.startswith(prefix):
                        yield node.text
                if root.findtext("s:IsTruncated", namespaces=ns) != "true":
                    return
                token = root.findtext("s:NextContinuationToken", namespaces=ns)
                if not token or token == query.get("continuation-token"):
                    raise StoreError("Invalid S3 pagination token.")
                query["continuation-token"] = token
    
        def put(self, key, data, mime, etag=None, create=False):
            if self.write_mode == "postgres_advisory":
                return guarded_put(self, key, data, mime, etag, create, StoreError, Conflict, Missing)
            headers = {"Content-Type":mime}
            if create:
                headers["If-None-Match"] = "*"
            elif etag:
                headers["If-Match"] = etag
            else:
                raise StoreError("Missing ETag for a safe update. Reload this item from S3.")
            return self.request("PUT", key, body=data, headers=headers)[1]
    
        def get_json(self, key):
            content, etag = self.get(key)
            if not etag:
                raise StoreError("S3 did not return an ETag. Check the reverse proxy before editing data.")
            return json.loads(content), etag
    
        def put_json(self, key, value, etag=None, create=False):
            data = json.dumps(value, ensure_ascii=False, allow_nan=False).encode("utf-8")
            return self.put(key, data, "application/json; charset=utf-8", etag=etag, create=create)
    
  dr_format.py: |
    """Print formats selected from Superset chart/dataset metadata.
    
    Uses Decimal, as Report Builder does. Raw records are never changed. Unsupported
    display formats retain the original value and produce a visible report note.
    """
    import json
    import math
    import re
    from datetime import date, datetime, timezone
    from decimal import Decimal, InvalidOperation, ROUND_HALF_UP, localcontext
    from functools import lru_cache
    from zoneinfo import ZoneInfo
    
    NUMBER = re.compile(r'(?P<sign>[+ (\-])?(?P<currency>\$)?(?P<comma>,)?(?:\.(?P<precision>\d{1,2}))?(?P<trim>~)?(?P<kind>[dfge%rsp])?')
    DATE_TOKEN = re.compile(r'%([-_0]?)([%aAbBdeHImMpQqLsSUwWyYjZf])')
    CURRENCIES = {'USD': '$', 'VND': '₫', 'EUR': '€', 'GBP': '£', 'JPY': '¥', 'CNY': 'CN¥',
                  'KRW': '₩', 'AUD': 'A$', 'CAD': 'CA$', 'SGD': 'SGD', 'THB': 'THB'}
    SI = {-24:'y', -21:'z', -18:'a', -15:'f', -12:'p', -9:'n', -6:'µ', -3:'m',
          0:'', 3:'k', 6:'M', 9:'G', 12:'T', 15:'P', 18:'E', 21:'Z', 24:'Y'}
    
    
    def pivot_header_rows(table, group):
        """Build merged headers over ONLY the leaf columns in this print group.
    
        Starts/spans include the separate No. column. Prefix comparison prevents
        identically named children of different parents from merging together.
        """
        paths = table.get('pivot_column_paths', {})
        depth = max((len(paths[col]) for col in group if col in paths), default=1)
        headers = []
        for level in range(depth):
            cells = []
            position = 0
            while position <= len(group):
                col = group[position - 1] if position else None
                if col not in paths:
                    label = table.get('labels', {}).get(col, col) if position else 'No.'
                    cells.append({'text': label if level == 0 else '', 'start': position, 'span': 1,
                                  'vmerge': ('restart' if level == 0 else 'continue') if depth > 1 else None})
                    position += 1
                    continue
                path = tuple(paths[col]) + ('',) * (depth - len(paths[col]))
                span = 1
                # Keep bottom-level cells distinct even when their labels match.
                while level < depth - 1 and position + span <= len(group):
                    next_col = group[position + span - 1]
                    if next_col not in paths:
                        break
                    next_path = tuple(paths[next_col]) + ('',) * (depth - len(paths[next_col]))
                    if next_path[:level + 1] != path[:level + 1]:
                        break
                    span += 1
                cells.append({'text': path[level], 'start': position, 'span': span, 'vmerge': None})
                position += span
            headers.append(cells)
        return headers
    
    
    def pivot_row_spans(table, group):
        """Merge adjacent row dimensions only within the same complete parent path.
    
        Omitted dimensions still take part in the comparison, so splitting columns
        never merges identical branch labels that belong to different regions.
        """
        dimensions = table.get('pivot_row_columns', [])
        rows = table['rows']
        spans = {}
        for level, col in enumerate(dimensions):
            if col not in group:
                continue
            lengths = [0] * len(rows)
            previous, start = None, 0
            for index, record in enumerate(rows):
                path = tuple((type(record.get(key)).__name__, raw_text(record.get(key)))
                             for key in dimensions[:level + 1])
                if index == 0 or path != previous:
                    if index:
                        lengths[start] = index - start
                    start = index
                    previous = path
            if rows:
                lengths[start] = len(rows) - start
            spans[col] = lengths
        return spans
    
    
    def raw_text(value):
        if value is None or isinstance(value, float) and not math.isfinite(value):
            return ''
        if isinstance(value, (datetime, date)):
            return value.isoformat()
        if isinstance(value, (list, tuple, dict)):
            return json.dumps(value, ensure_ascii=False, default=str)
        return str(value)
    
    
    def metric_name(metric):
        return metric if isinstance(metric, str) else metric.get('label', '') if isinstance(metric, dict) else ''
    
    
    @lru_cache(maxsize=256)
    def number_spec(pattern):
        if len(pattern) > 80:
            raise ValueError('number format too long')
        result = NUMBER.fullmatch(pattern)
        if not result or int(result['precision'] or 6) > 20:
            raise ValueError('unsupported number format')
        return result.groupdict()
    
    
    def number_text(value, pattern, decimal='.', thousands=','):
        if isinstance(value, bool):
            raise ValueError('boolean is not numeric')
        number = Decimal(str(value))
        if not number.is_finite() or abs(number.adjusted()) > 100:
            raise ValueError('not a bounded finite number')
        # Adaptive chart abbreviations are expanded on paper to preserve the full
        # value; an explicit D3 specifier still applies the requested precision.
        if pattern in ('', 'SMART_NUMBER', 'SMART_NUMBER_SIGNED'):
            text = format(abs(number), ',f')
            sign = '-' if number < 0 else '+' if pattern == 'SMART_NUMBER_SIGNED' else ''
            return sign + text.translate(str.maketrans({',': thousands, '.': decimal}))
        spec = number_spec(pattern)
        kind = spec['kind'] or 'g'
        precision = int(spec['precision']) if spec['precision'] is not None else 6
        suffix = '%' if kind in ('%', 'p') else ''
        with localcontext() as context:
            context.prec = 140
            context.rounding = ROUND_HALF_UP
            magnitude = abs(number) * (100 if kind in ('%', 'p') else 1)
            if kind == 's':
                exponent = min(24, max(-24, magnitude.adjusted() // 3 * 3)) if magnitude else 0
                magnitude /= Decimal(10) ** exponent
                places = max(0, max(1, precision) - magnitude.adjusted() - 1) if magnitude else max(1, precision) - 1
                rounded = magnitude.quantize(Decimal(1).scaleb(-places))
                if rounded >= 1000 and exponent < 24:
                    exponent += 3
                    magnitude /= 1000
                suffix = SI[exponent]
            if kind in ('s', 'r', 'p'):
                places = max(1, precision) - magnitude.adjusted() - 1 if magnitude else max(1, precision) - 1
                magnitude = magnitude.quantize(Decimal(1).scaleb(-places))
                places = max(0, max(1, precision) - magnitude.adjusted() - 1) if magnitude else max(0, places)
                text = format(magnitude, (',' if spec['comma'] else '') + f'.{places}f')
            elif kind == 'd':
                text = format(magnitude.quantize(Decimal(1)), ',f' if spec['comma'] else 'f')
            elif kind in ('f', '%'):
                text = format(magnitude, (',' if spec['comma'] else '') + f'.{precision}f')
            else:
                text = format(magnitude, (',' if spec['comma'] else '') + f'.{max(1, precision)}{kind}')
            if spec['trim']:
                pieces = re.split('([eE].*)', text, maxsplit=1)
                if '.' in pieces[0]:
                    pieces[0] = pieces[0].rstrip('0').rstrip('.')
                text = ''.join(pieces)
        text = text.translate(str.maketrans({',': thousands, '.': decimal}))
        text = ('$' if spec['currency'] else '') + text + suffix
        if number < 0:
            return '(' + text + ')' if spec['sign'] == '(' else '-' + text
        return (spec['sign'] if spec['sign'] in ('+', ' ') else '') + text
    
    
    def date_text(value, pattern, tz='UTC'):
        if isinstance(value, datetime):
            parsed = value
        elif isinstance(value, date):
            parsed = datetime.combine(value, datetime.min.time())
        elif isinstance(value, (int, float, Decimal)) and not isinstance(value, bool):
            # Superset chart JSON temporal values use epoch milliseconds.
            parsed = datetime.fromtimestamp(float(value) / 1000, timezone.utc)
        else:
            parsed = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
        parsed = parsed.replace(tzinfo=timezone.utc) if parsed.tzinfo is None else parsed
        parsed = parsed.astimezone(ZoneInfo(tz))
        if not pattern or pattern in ('smart_date', 'DATABASE_DATETIME'):
            return parsed.isoformat(sep=' ', timespec='seconds')
        if len(pattern) > 120 or '%' in DATE_TOKEN.sub('', pattern):
            raise ValueError('unsupported time format')
        def token(match):
            flag, key = match.groups()
            special = {'L': f'{parsed.microsecond // 1000:03d}', 'Q': str(int(parsed.timestamp() * 1000)),
                       's': str(int(parsed.timestamp())), 'q': str((parsed.month - 1) // 3 + 1), '%': '%',
                       'e': f'{parsed.day:2d}'}
            text = special[key] if key in special else parsed.strftime('%' + key)
            if flag == '-':
                text = text.lstrip('0 ') or '0'
            elif flag == '_':
                text = text.lstrip('0').rjust(len(text))
            return text
        return DATE_TOKEN.sub(token, pattern)
    
    
    def table_rules(columns, query, form, datasource):
        data = datasource.data if datasource else {}
        types = dict(zip(query.get('colnames') or columns, query.get('coltypes') or []))
        dataset_columns = {col['column_name']: col for col in data.get('columns', [])}
        formats = data.get('column_formats') or {}
        currencies = dict(data.get('currency_formats') or {})
        for metric in data.get('metrics', []):
            currency = metric.get('currency')
            if isinstance(currency, str):
                try:
                    currency = json.loads(currency)
                except ValueError:
                    currency = None
            if isinstance(currency, dict):
                currencies[metric.get('metric_name')] = currency
        metrics = {metric_name(m) for m in (form.get('metrics') or [])}
        metrics.update(metric_name(form.get(name)) for name in ('metric', 'secondary_metric'))
        percentages = {'%' + metric_name(m) for m in (form.get('percent_metrics') or [])}
        rules = {}
        for col in columns:
            config = (form.get('column_config') or {}).get(col) or {}
            source = dataset_columns.get(col, {})
            temporal = types.get(col) == 2 or source.get('is_dttm') or bool(config.get('d3TimeFormat'))
            numeric = types.get(col) == 0 or col in metrics or col in percentages
            fallback = ',.3%' if col in percentages else (form.get('number_format') or form.get('y_axis_format') or '') if col in metrics else ''
            pattern = config.get('d3NumberFormat') or formats.get(col) or fallback
            if temporal:
                pattern = config.get('d3TimeFormat') or formats.get(col) or form.get('table_timestamp_format') or ''
            rules[col] = {'kind': 'date' if temporal else 'number' if numeric or config.get('d3NumberFormat') else 'raw',
                          'pattern': str(pattern or ''), 'currency': config.get('currencyFormat') or currencies.get(col),
                          'align': config.get('horizontalAlign')}
        return rules
    
    
    def formatted_cell(value, rule, options):
        raw = raw_text(value)
        if value is None or raw == '' or not rule or rule.get('kind') == 'raw':
            return raw, ''
        try:
            if rule['kind'] == 'date':
                return date_text(value, rule['pattern'], options.get('date_timezone', 'UTC')), ''
            # Numeric-looking strings can be identifiers. Keep them exact unless
            # the column has an explicit number/currency format.
            if isinstance(value, str) and not rule['pattern'] and not rule.get('currency'):
                return value, ''
            pattern = rule['pattern']
            currency = rule.get('currency') or {}
            if currency.get('symbol'):
                pattern = pattern.replace('$', '').replace('%', '')
            text = number_text(value, pattern, options.get('decimal', '.'), options.get('thousands', ','))
            if currency.get('symbol'):
                symbol = CURRENCIES.get(currency['symbol'], str(currency['symbol']))
                text = symbol + ' ' + text if currency.get('symbolPosition') == 'prefix' else text + ' ' + symbol
            return text, ''
        except (ValueError, TypeError, InvalidOperation, OverflowError, ArithmeticError):
            return raw, 'Kept the original value because the format or data type is not supported yet: ' + rule.get('pattern', '')
