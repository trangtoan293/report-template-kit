  dashboard_export.css: |
    .dre-dialog button{font:inherit;cursor:pointer;border-radius:5px;padding:8px 14px;border:1px solid #1d91b1;background:white;color:#087792}
    .dre-menu-item{cursor:pointer}.dre-menu-item:hover{background:rgba(0,0,0,.04)}.dre-menu-item:focus-visible,.dre-dialog button:focus-visible,.dre-dialog select:focus-visible{outline:3px solid #77bada;outline-offset:2px}
    .dre-dialog{box-sizing:border-box;width:620px;max-width:calc(100vw - 32px);max-height:85vh;overflow:auto;border:0;border-radius:12px;padding:26px;color:#24374a;background:#fff;box-shadow:0 18px 70px #0004;font:14px/1.6 Arial,sans-serif}
    .dre-dialog::backdrop{background:#12223577}.dre-dialog .dre-top{display:flex;align-items:center;justify-content:space-between;gap:16px}.dre-dialog h2{font-size:22px;margin:0;font-weight:600}
    .dre-dialog .dre-close{border:0;font-size:26px;color:#526779;padding:0 8px}.dre-dialog label{display:block;font-weight:600;margin:16px 0}
    .dre-dialog select{display:block;box-sizing:border-box;width:100%;margin-top:6px;padding:10px;border:1px solid #c4ced8;border-radius:5px;background:#fff;color:#24374a;font:inherit}
    .dre-dialog [hidden]{display:none!important}
    .dre-dialog select:disabled{background:#f3f5f7;color:#536879;cursor:default}
    .dre-dialog .dre-latest:not(:empty){margin-top:16px;padding:16px;border:1px solid #dbe4ed;border-radius:6px;background:#f3f7fb;overflow-x:auto}
    .dre-dialog .dre-latest-table{width:100%;margin-top:10px;border-collapse:collapse;text-align:left;font-size:12px}
    .dre-dialog .dre-latest-table th,.dre-dialog .dre-latest-table td{padding:8px;border-bottom:1px solid #dbe4ed;vertical-align:top;overflow-wrap:anywhere}
    .dre-dialog .dre-latest-table button{white-space:nowrap;font-size:12px}
    .dre-dialog .dre-hint{font-size:12px;color:#536879}.dre-dialog .dre-primary{background:#087f9b;border-color:#087f9b;color:white;font-weight:600}
    .dre-dialog .dre-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0}.dre-dialog .dre-actions button{margin:0}
