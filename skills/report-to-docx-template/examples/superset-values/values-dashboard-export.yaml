          const style=doc.createElement('style');
          style.textContent='mark[data-key]{cursor:pointer}mark[data-key]:focus-visible{outline:2px solid #087f9c;outline-offset:2px}mark.dt-variable-selected{background:#d6f1f6;outline:2px solid #087f9c;outline-offset:2px}';
          doc.head.appendChild(style);
          for(const mark of doc.querySelectorAll('[data-key]')){
            mark.tabIndex=0;mark.setAttribute('role','button');
            mark.setAttribute('aria-label',mark.dataset.key==='dashboard'?'Show dashboard binding':'Edit template variable '+mark.dataset.key);
          }
          doc.addEventListener('click',event=>{
            const mark=event.target.closest?.('[data-key]');
            if(mark){event.preventDefault();selectVariable(mark.dataset.key,true);}
