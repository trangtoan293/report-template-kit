    """Offline font bundle loader, matching Report Builder's bounded ZIP handling."""
    import base64
    import hashlib
    import io
    import json
    import os
    from pathlib import Path
    import zipfile
    
    ROOT = Path('/app/dashboard-pdf')
    MAX_BUNDLE = 128 * 1024 * 1024
    MAX_EXPANDED = 256 * 1024 * 1024
    
    
    def install_bundle(content, destination, expected=''):
        if len(content) > MAX_BUNDLE:
            raise ValueError('PDF font bundle exceeds 128 MB.')
        if expected and hashlib.sha256(content).hexdigest() != expected.lower():
            raise ValueError('PDF font bundle SHA-256 mismatch.')
        with zipfile.ZipFile(io.BytesIO(content)) as archive:
            items = [item for item in archive.infolist() if not item.is_dir()]
            if not 1 <= len(items) <= 256 or sum(item.file_size for item in items) > MAX_EXPANDED:
                raise ValueError('PDF font bundle requires 1-256 fonts, at most 256 MB expanded.')
            for i, item in enumerate(items):
                suffix = Path(item.filename).suffix.lower()
                if suffix not in ('.ttf', '.otf', '.ttc') or item.file_size > 64 * 1024 * 1024:
                    raise ValueError('Only TTF/OTF/TTC fonts up to 64 MB are supported.')
                raw = archive.read(item)
                if raw[:4] not in (b'\x00\x01\x00\x00', b'OTTO', b'ttcf', b'true'):
                    raise ValueError('Invalid PDF font file.')
                # ZIP member paths are never used as destination paths.
                target = destination / f'font-{i}-{hashlib.sha256(raw).hexdigest()[:16]}{suffix}'
                target.write_bytes(raw)
                target.chmod(0o644)
        return len(items)
    
    
    def main():
        ROOT.mkdir(parents=True, exist_ok=True)
        overrides = json.loads(base64.b64decode(os.environ.pop('DASHBOARD_PDF_EXTRA_ENV_B64', 'e30='))) or {}
        for name, value in overrides.items():
            if name.startswith(('DASHBOARD_EXPORT_S3_', 'ATTEST_S3_')):
                os.environ[name] = str(value)
        key = os.environ.get('DASHBOARD_PDF_FONT_KEY', '').strip()
        if key:
            from flask import Flask
            from customsso.dr_storage import Store
            with Flask('dashboard-export-fonts').app_context():
                content, _ = Store(user_id=0).get(key, limit=MAX_BUNDLE)
            count = install_bundle(content, ROOT, os.environ.get('DASHBOARD_PDF_FONT_SHA256', '').strip())
            print(f'Dashboard PDF font bundle installed: {count} files.', flush=True)
        else:
            print('Dashboard PDF uses bundled converter fonts.', flush=True)
        ROOT.chmod(0o755)
        os.chown(ROOT, 1001, 1001)
    
    
    if __name__ == '__main__':
        main()
