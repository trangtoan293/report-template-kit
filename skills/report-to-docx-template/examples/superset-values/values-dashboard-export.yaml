            from zoneinfo import ZoneInfo
            report_tz = setting('REPORT_TIMEZONE', 'Asia/Ho_Chi_Minh')
            created = datetime.now(ZoneInfo(report_tz)).isoformat(timespec='seconds')
            self.write(f'<p class="meta">Created at {created} · {escape(report_tz)}</p>')
            if snapshot['filter_labels']:
                self.write('<p style="break-after:avoid"><strong>Bộ lọc áp dụng:</strong></p><ul>')
                for label in snapshot['filter_labels']:
                    self.write(f'<li>{escape(label)}</li>')
                self.write('</ul>')
            self.write("<p>Data keeps the chart's conditions and the exporting user's access permissions. "
                       'Row numbers repeat in each column group of wide tables.</p>')
    
        def write(self, text):
            data = text.encode('utf-8')
            self.size += len(data)
            if self.size > self.max_bytes:
                raise ExportError('The report exceeds the allowed HTML size. A PDF with missing data will not be created; increase maxHtmlMb or narrow the filters.')
            self.file.write(data)
    
        def chart(self, item, tables):
            from customsso.dr_format import pivot_header_rows, pivot_row_spans
            self.write(f'<section class="section"><h2>{escape(item["title"])}</h2>')
            if item.get('image'):
                self.write(f'<img class="visual" alt="{escape(item["title"], quote=True)}" src="{item["image"]}">')
                self.write('<p class="meta">Illustrative image from the dashboard; the full data is in the tables below.</p>')
            for index, table in enumerate(tables):
                columns, rows = table['columns'], table['rows']
                width = self.options['columns']
                groups = [columns[start:start + width] for start in range(0, len(columns), width)] or [[]]
                for group_index, group in enumerate(groups):
                    cls = ' class="table-group"' if group_index else ''
                    name = table.get('name', '')
                    self.write(f'<div{cls}>')
                    if name:
                        self.write(f'<h3>{escape(name)}</h3>')
                    self.write('<table><colgroup><col style="width:34pt">' + '<col>' * len(group) + '</colgroup>')
                    self.write(f'<thead><tr><th class="table-title" colspan="{len(group) + 1}">'
                               f'{escape(item["title"])}' + (f' · {escape(name)}' if name else '')
                               + (f' · Columns {group_index * width + 1}–{group_index * width + len(group)}' if len(groups) > 1 else '') +
                               '</th></tr>')
                    is_pivot = 'pivot_column_paths' in table
                    spans = pivot_row_spans(table, group) if is_pivot else {}
                    if is_pivot:
                        headers = pivot_header_rows(table, group)
                        for cells in headers:
                            self.write('<tr>')
                            for cell in cells:
                                if cell['vmerge'] == 'continue':
                                    continue
                                attrs = f' colspan="{cell["span"]}"' if cell['span'] > 1 else ''
                                if cell['vmerge'] == 'restart':
                                    attrs += f' rowspan="{len(headers)}"'
                                self.write(f'<th{attrs}>{escape(str(cell["text"]))}</th>')
                            self.write('</tr>')
                    else:
                        self.write('<tr><th class="number">No.</th>')
                        for column in group:
                            rule = table.get('formats', {}).get(column, {})
                            align = rule.get('align') or ('right' if rule.get('kind') == 'number' else 'left')
                            css = f' class="align-{align}"' if align in ('right', 'center') else ''
                            self.write(f'<th{css}>{escape(table.get("labels", {}).get(column, column))}</th>')
                        self.write('</tr>')
                    self.write('</thead><tbody>')
                    for row_index, row in enumerate(rows):
                        self.write(f'<tr><td class="number">{row_index + 1}</td>')
                        for column in group:
                            if column in spans and spans[column][row_index] == 0:
                                continue
                            value = row.get(column)
                            rule = table.get('formats', {}).get(column, {})
                            rendered, note = formatted_cell(value, rule, self.options)
                            if note:
                                self.format_notes.add(f'{item["title"]} / {column}: {note}')
                            align = rule.get('align') or ('right' if rule.get('kind') == 'number' else 'left')
                            css = f' class="align-{align}"' if align in ('right', 'center') else ''
                            if column in spans and spans[column][row_index] > 1:
                                css += f' rowspan="{spans[column][row_index]}"'
                            self.write(f'<td{css}>{escape(rendered)}</td>')
                        self.write('</tr>')
                    if not rows:
                        self.write(f'<tr><td colspan="{len(group) + 1}">No matching data.</td></tr>')
                    self.write('</tbody></table></div>')
            self.write('</section>')
    
        def finish(self, counts):
            if self.format_notes:
                self.write('<section class="audit"><h2>Formatting notes</h2>')
                for note in sorted(self.format_notes):
                    self.write(f'<p>{escape(note)}</p>')
                self.write('</section>')
            self.write('</body></html>')
            self.file.flush()
    
    
    def direct_chart_limit_error(item, limit):
        return ExportError(
            f'Chart "{item["title"]}" exceeds the {limit:,}-row export limit. '
            'Please narrow your filters and try again. No PDF was generated.')
    
    
    def run_chart_query(context, command, item, limit):
        if limit is None:
            return command.run()
        # Scope this guard to this chart's datasource instance in the isolated
        # worker process. Superset time-comparison queries can override QueryObject
        # limits internally, so guard their actual datasource calls as well.
        datasource = context.datasource
        original = datasource.query
        missing = object()
        previous = datasource.__dict__.get('query', missing)
        consumed, exceeded = 0, False
    
        def bounded_query(query_obj):
            nonlocal consumed, exceeded
            if exceeded:
                raise direct_chart_limit_error(item, limit)
            bounded = dict(query_obj)
            requested = bounded.get('row_limit')
            if requested is not None and (type(requested) is not int or requested < 0):
                raise ExportError(f'Chart {item["id"]}: the Row limit is invalid.')
            probe = limit - consumed + 1
            bounded['row_limit'] = min(requested, probe) if requested else probe
            result = original(bounded)
            if result.df is not None:
                consumed += len(result.df.index)
                if consumed > limit:
                    exceeded = True
                    raise direct_chart_limit_error(item, limit)
            return result
    
        datasource.query = bounded_query
        try:
            try:
                result = command.run()
            except Exception as ex:
                if exceeded:
                    raise direct_chart_limit_error(item, limit) from ex
                raise
            if exceeded:
                raise direct_chart_limit_error(item, limit)
            return result
        finally:
            if previous is missing:
                del datasource.query
            else:
                datasource.query = previous
    
    
    def enforce_direct_chart_limit(result, item, limit):
        """Count all query results for one chart, including pre-pivot SQL rows."""
        if limit is None:
            return
        total = 0
        for query in result.get('queries', []):
            rows = query.get('data')
            if not isinstance(rows, list):
                raise ExportError("This plugin's data shape does not support a full export yet.")
            counts = [len(rows)]
            for field in ('sql_rowcount', 'rowcount'):
                count = query.get(field)
                if count is not None:
                    if type(count) is not int or count < 0:
                        raise ExportError('The query returned an invalid row count. No PDF was generated.')
                    counts.append(count)
            # Do not let a pivot/post-processing operation hide the probe row.
            total += max(counts)
            if total > limit:
                raise direct_chart_limit_error(item, limit)
    
    
    def tables_from_result(result, form, datasource):
        """Preserve row multiplicity and every returned column; no deduplication."""
        tables = []
        verbose = datasource.data.get('verbose_map', {}) if datasource else {}
        for query in result['queries']:
            if query.get('error') or str(query.get('status', '')).lower() in ('failed', 'stopped'):
                raise ExportError('A query did not complete. A report with missing data will not be created.')
            if query.get('rejected_filters') or query.get('rejected_filter_columns'):
                raise ExportError('A filter could not be applied to the dataset. A report with the wrong scope will not be exported.')
            rows = query.get('data')
            if not isinstance(rows, list) or any(not isinstance(row, dict) for row in rows):
                raise ExportError("This plugin's data shape does not support a full export yet.")
            if len(rows) > int(setting('MAX_ROWS', 500000)) or (query.get('sql_rowcount') or 0) > int(setting('MAX_ROWS', 500000)):
                raise ExportError('The query exceeds maxRowsPerQuery. Rows were not truncated; increase the limit or narrow the filters and export again.')
            if query.get('rowcount') is not None and query['rowcount'] != len(rows):
                raise ExportError('The reported row count does not match the data received.')
            columns = list(query.get('colnames') or (list(rows[0]) if rows else []))
            if len(columns) != len(set(columns)):
                raise ExportError('The result has duplicate column names; use different aliases to export the full data.')
            for row in rows:
                for col in row:
                    if col not in columns:
                        columns.append(col)
            labels = {str(col): str(verbose.get(col, col)) for col in columns}
            config = form.get('column_config') or {}
            for col in columns:
                if isinstance(config.get(col), dict) and config[col].get('display_name'):
                    labels[col] = str(config[col]['display_name'])
            tables.append({'columns': columns, 'rows': rows, 'labels': labels,
                           'formats': table_rules(columns, query, form, datasource)})
        if not tables:
            raise ExportError('The chart returned no results.')
        if form.get('viz_type') == 'pivot_table_v2' and tables[0]['rows']:
            # Use Superset's own pivot aggregation. Export the pivot result instead
            # of also appending its long-form source as a second table.
            import pandas as pd
            from superset.charts.client_processing import pivot_table_v2
            frame = pd.DataFrame(tables[0]['rows']).rename(columns=verbose)
            pivot = pivot_table_v2(frame, form, datasource)
            index_names = list(pivot.index.names)
            index_count = pivot.index.nlevels
            columns = [f'_index_{i}' for i in range(index_count)] + [f'_value_{i}' for i in range(len(pivot.columns))]
            labels = {f'_index_{i}': str(name or f'Group {i + 1}') for i, name in enumerate(index_names)}
            labels.update({f'_value_{i}': ' / '.join(map(str, col)) if isinstance(col, tuple) else str(col)
                           for i, col in enumerate(pivot.columns)})
            rows = []
            for idx, values in zip(pivot.index, pivot.itertuples(index=False, name=None)):
                keys = list(idx) if isinstance(idx, tuple) else [idx]
                rows.append(dict(zip(columns, keys + list(values))))
            base_formats = tables[0]['formats']
            pivot_formats, identity_columns = {}, {}
            for i, name in enumerate(index_names):
                original = next((key for key in base_formats if verbose.get(key, key) == name), name)
                pivot_formats[f'_index_{i}'] = base_formats.get(original, {'kind': 'raw'})
                identity_columns[original] = f'_index_{i}'
            for i, column in enumerate(pivot.columns):
                parts = column if isinstance(column, tuple) else (column,)
                matches = [rule for key, rule in base_formats.items()
                           if rule['kind'] == 'number' and (key in parts or verbose.get(key, key) in parts)]
                pivot_formats[f'_value_{i}'] = matches[0] if len(matches) == 1 else {
                    'kind': 'number', 'pattern': str(form.get('number_format') or '')}
            tables[0] = {'name': '', 'columns': columns, 'rows': rows,
                         'labels': labels, 'formats': pivot_formats, 'identity_columns': identity_columns,
                         'pivot_row_columns': columns[:index_count],
                         'pivot_column_paths': {f'_value_{i}': tuple(map(str, col)) if isinstance(col, tuple) else (str(col),)
                                                for i, col in enumerate(pivot.columns)}}
        return tables
    
    
    def convert_pdf(html_file, output):
        font = escape(print_options()['font'], quote=True)
        # Chromium inserts the template inside its own print document. Body styles
        # do not survive this insertion; put font sizing on an actual child node.
        footer = '<html><head><meta charset="utf-8"></head><body>' \
                 f'<div style="font-family:&quot;{font}&quot;,Arial;font-size:9px;width:100%;color:#486176;text-align:center">' \
                 'Page <span class="pageNumber"></span> / <span class="totalPages"></span></div></body></html>'
        html_file.seek(0)
        session = requests.Session()
        session.trust_env = False
        try:
            with session.post(setting('PDF_URL', 'http://127.0.0.1:3001/forms/chromium/convert/html'),
                               files=[('files', ('index.html', html_file, 'text/html')),
                                      ('files', ('footer.html', footer.encode(), 'text/html'))],
                               data={'preferCssPageSize': 'true', 'printBackground': 'true',
                                     'marginBottom': '0.59', 'landscape': 'true'},
                               timeout=(5, 1210), allow_redirects=False, stream=True) as response:
                if response.status_code != 200:
                    raise ExportError(f'The PDF generator returned HTTP {response.status_code}; no complete file is available.')
                size = 0
                for chunk in response.iter_content(65536):
                    if not size and chunk and not chunk.startswith(b'%PDF-'):
                        raise ExportError('The converter did not return a valid PDF.')
                    size += len(chunk)
                    if size > int(setting('MAX_PDF_MB', 200)) * 1024 * 1024:
                        raise ExportError('The PDF exceeds maxPdfMb; a truncated file will not be provided.')
                    output.write(chunk)
                if size < 100:
                    raise ExportError('The PDF is empty or incomplete.')
        except requests.RequestException as ex:
            raise ExportError('Could not connect to the PDF generator, or the conversion timed out.') from ex
        finally:
            session.close()
        output.flush()
        output.seek(0)
    
    
    def claim(store, job, etag):
        now = time.time()
        if job['state'] in TERMINAL or now >= job['expires']:
            return None
        if job['state'] == 'running' and now < job.get('lease_until', 0):
            return None
        attempts = int(job.get('attempts', 0))
        if attempts >= int(setting('MAX_ATTEMPTS', 3)):
            job.update(state='failed', lease_until=0, error_type='WorkerRecoveryLimit',
                       error='The worker stopped repeatedly. Check export worker logs and submit a new report.')
            store.put_json(key(store, job['id']), job, etag=etag)
            return None
        token = str(uuid4())
        job.update(state='running', lease=token, lease_until=now + int(setting('LEASE_SECONDS', 180)),
                   attempts=attempts + 1, worker_id=os.environ.get('HOSTNAME', 'export-worker'),
                   completed=0, row_count=0, counts=[], error='', stage='starting',
                   chart_id=None, error_type=None, worker_version=VERSION)
        store.put_json(key(store, job['id']), job, etag=etag)
        return token
    
    
    def checkpoint(store, job_id, token, **changes):
        # Heartbeats and child progress can update the same object concurrently.
        # Re-read on CAS conflict, but never revive an expired/replaced lease.
        for _ in range(8):
            job, etag = load_job(store, job_id)
            if (job['state'] != 'running' or job.get('lease') != token
                    or job.get('lease_until', 0) <= time.time()):
                raise Conflict('The job was cancelled or handed off to another worker.')
            job.update(changes)
            try:
                store.put_json(key(store, job_id), job, etag=etag)
                return job
            except Conflict:
                continue
        raise Conflict('Could not update the job lease safely.')
    
    
    def run_job(store, job_id, token):
        from superset import security_manager
        from flask_login import login_user
        def stage(name, chart_id=None):
            value = checkpoint(store, job_id, token, stage=name, chart_id=chart_id)
            LOG.info('Export progress job=%s stage=%s chart_id=%s version=%s', job_id, name, chart_id, VERSION)
            return value
    
        job = stage('authenticating')
        # Match Superset's async-query worker: find_user searches username/email,
        # whereas queued exports retain the immutable owner primary key.
        g.user = security_manager.get_user_by_id(job['owner_id'])
        if not g.user or not g.user.is_active:
            raise ExportError('The exporting account is no longer active.')
        login_user(g.user)
        stage('loading_snapshot')
        snapshot, _ = store.get_json(input_key(store, job_id))
        from customsso.dr_templates import template_access
        office = template_access(snapshot)
        stage('validating_access')
        dashboard = check_job_access(job, snapshot, check_fingerprints=True,
                                     on_chart=lambda chart_id: stage('validating_access', chart_id))
        available = {chart.id: chart for chart in dashboard.slices}
        counts, total_rows = [], 0
        if snapshot.get('direct_row_limit') is not None:
            LOG.info('Direct export row limit job=%s rows_per_chart=%s version=%s',
                     job_id, snapshot['direct_row_limit'], VERSION)
        stage('preparing_report')
        with tempfile.TemporaryFile() as html_file, tempfile.TemporaryFile() as pdf_file, ExitStack() as cleanup:
            maximum = int(setting('MAX_HTML_MB', 100)) * 1024 * 1024
            if office:
                from customsso.dr_docx import DocxReport
                maximum = int(setting('MAX_DOCX_XML_MB', setting('MAX_HTML_MB', 100))) * 1024 * 1024
                report = DocxReport(html_file, snapshot, maximum, office)
                cleanup.callback(report.close)
            else:
                report = HtmlReport(html_file, snapshot, maximum)
            for item in snapshot['charts']:
                stage('building_query', item['id'])
                context, command = create_context(available[item['id']], item['query_context'], dashboard.id,
                                                  row_limit_cap=snapshot.get('direct_row_limit'))
                if context_fingerprint(context) != item['fingerprint']:
                    raise ExportError('The data scope changed during export. Please export again.')
                # One execution within each chart query's configured limits.
                # Superset applies RLS, ordering and post-processing before export.
                stage('querying', item['id'])
                result = run_chart_query(context, command, item, snapshot.get('direct_row_limit'))
                stage('formatting', item['id'])
                if len(result.get('queries', [])) != len(context.queries):
                    raise ExportError('The chart returned fewer query results than expected. A PDF with missing data will not be created.')
                enforce_direct_chart_limit(result, item, snapshot.get('direct_row_limit'))
                tables = tables_from_result(result, context.form_data, context.datasource)
                limit = snapshot.get('direct_row_limit')
                if limit is not None and sum(len(table['rows']) for table in tables) > limit:
                    raise ExportError(
                        f'Chart "{item["title"]}" exceeds the {limit:,}-row export limit after formatting. '
                        'Please narrow your filters and try again. No PDF was generated.')
                LOG.info('Export table sizes job=%s chart_id=%s rows=%s columns=%s version=%s',
                         job_id, item['id'], [len(table['rows']) for table in tables],
                         [len(table['columns']) for table in tables], VERSION)
                report.chart(item, tables)
                rows = [len(table['rows']) for table in tables]
                counts.append({'id': item['id'], 'title': item['title'], 'rows': rows})
                total_rows += sum(rows)
                checkpoint(store, job_id, token, completed=len(counts), row_count=total_rows, counts=counts)
                del result, tables, context, command
            stage('finishing_report')
            report.finish(counts)
            if office:
                LOG.info('Export DOCX layout job=%s xml_bytes=%s table_blocks=%s rows_per_block=%s block_page_break=%s version=%s',
                         job_id, report.size, report.table_blocks,
                         setting('DOCX_TABLE_ROWS_PER_BLOCK', 200), setting('DOCX_BLOCK_PAGE_BREAK', True), VERSION)
            stage('converting_pdf')
            if office:
                from customsso.dr_templates import convert_docx
                convert_docx(html_file, pdf_file)
            else:
                convert_pdf(html_file, pdf_file)
            stage('rechecking_access')
            check_job_access(job, snapshot, check_fingerprints=True,
                             on_chart=lambda chart_id: stage('rechecking_access', chart_id))
            template_access(snapshot)
            stage('saving_pdf')
            output_key = f'{store.prefix}/data/{store.user}/{job_id}/{token}.pdf'
            store.put(output_key, pdf_file, 'application/pdf', create=True)
            checkpoint(store, job_id, token, state='ready', result_key=output_key,
                       completed=len(counts), row_count=total_rows, counts=counts, lease_until=0,
                       stage='complete', chart_id=None, completed_at=time.time())
    
    
    def fail_job(store, job_id, token, error):
        message = str(error) if isinstance(error, ExportError) else 'The report export failed. Check the worker log; no PDF with missing data was produced.'
        try:
            error_type = re.sub(r'[^A-Za-z0-9_]', '', type(error).__name__)[:80] or 'Exception'
            job = checkpoint(store, job_id, token, state='failed', error=message, lease_until=0,
                             error_type=error_type)
            LOG.error('Export failure job=%s stage=%s chart_id=%s error_type=%s version=%s',
                      job_id, job.get('stage'), job.get('chart_id'), error_type, VERSION)
        except Conflict:
            pass
    
    
    def read_payload():
        data = request.stream.read(12 * 1024 * 1024 + 1)
        if len(data) > 12 * 1024 * 1024:
            raise ExportError('The export request exceeds 12 MB.')
        try:
            payload = json.loads(data)
        except (ValueError, UnicodeDecodeError) as ex:
            raise ExportError('The export request is not valid JSON.') from ex
        if not isinstance(payload, dict):
            raise ExportError('The request is invalid.')
        return payload
    
    
    def enqueue_snapshot(snapshot, store):
        converter = 'LIBREOFFICE_ENABLED' if snapshot.get('template') else 'CHROMIUM_ENABLED'
        if not setting(converter, True):
            raise ExportError('This PDF export mode is disabled by the administrator.')
        job_id, now = str(uuid4()), time.time()
        # Capture once so queued jobs/retries print the same system export date.
        snapshot['export_created_at'] = now
        job = {'id':job_id, 'owner_id':g.user.id, 'dashboard_id':snapshot['dashboard_id'],
               'title':snapshot.get('template', {}).get('options', {}).get('title') or snapshot['title'],
               'state':'queued', 'created':now, 'expires':now + int(setting('RETENTION_HOURS', 24)) * 3600,
               'completed':0, 'chart_count':len(snapshot['charts']), 'row_count':0,
               'error':'', 'counts':[], 'lease_until':0}
        if snapshot.get('template'):
            job['export_context'] = {
                'template_id': snapshot['template']['id'], 'scope': snapshot['scope'],
                'chart_ids': [chart['id'] for chart in snapshot['charts']]}
        store.put_json(input_key(store, job_id), snapshot, create=True)
        store.put_json(key(store, job_id), job, create=True)
        return job
    
    
    def decode_response(response):
        encoding = (response.headers.get('Content-Encoding') or '').lower().strip()
        data = response.get_data()
        if encoding in ('', 'identity'):
            return data, lambda value: value
        if encoding == 'gzip':
            return gzip.decompress(data), gzip.compress
        if encoding in ('deflate', 'zlib'):
            return zlib.decompress(data), zlib.compress
        if encoding == 'br':
            import brotli
            return brotli.decompress(data), brotli.compress
        if encoding == 'zstd':
            import zstandard
            return zstandard.ZstdDecompressor().decompressobj().decompress(data), zstandard.ZstdCompressor().compress
        raise ValueError('Unknown HTML encoding')
    
    
    def make_blueprint():
        bp = Blueprint('dashboard_export', __name__)
        from customsso.dr_templates import register_routes
        register_routes(bp)
        assets = Path(__file__).parent
        javascript = (assets / 'dashboard_export.js').read_bytes()
        stylesheet = (assets / 'dashboard_export.css').read_bytes()
        version = hashlib.sha256(javascript + stylesheet).hexdigest()[:16]
    
        @bp.get('/_hanas/dashboard-export.<extension>')
        def asset(extension):
            if extension not in ('js', 'css'):
                return Response(status=404)
            return Response(javascript if extension == 'js' else stylesheet,
                            mimetype='application/javascript' if extension == 'js' else 'text/css',
                            headers={'Cache-Control': 'no-cache', 'X-Content-Type-Options': 'nosniff'})
    
        @bp.get('/_hanas/dashboard-template.<extension>')
        def template_asset(extension):
            if extension not in ('js', 'css'):
                return Response(status=404)
            return Response((assets / ('dt_ui.' + extension)).read_bytes(),
                            mimetype='application/javascript' if extension == 'js' else 'text/css',
                            headers={'Cache-Control':'no-cache', 'X-Content-Type-Options':'nosniff'})
    
        @bp.after_app_request
        def inject_dashboard_export(response):
            if (not setting('ENABLED', True) or response.status_code != 200
                    or response.mimetype != 'text/html' or response.direct_passthrough or response.is_streamed):
                return response
            try:
                body, encode = decode_response(response)
                anchor = re.search(br'<head(?:\s[^>]*)?>', body, re.I)
                if anchor and b'id="dashboard-export-hook"' not in body:
                    src = escape(url_for('dashboard_export.asset', extension='js', v=version), quote=True)
                    css = escape(url_for('dashboard_export.asset', extension='css', v=version), quote=True)
                    api = escape((request.script_root or '') + API, quote=True)
