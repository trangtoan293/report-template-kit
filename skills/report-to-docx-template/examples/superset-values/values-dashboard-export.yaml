      function textFilter(key){
        return (source.text_filter_options||[]).find(item=>item.id===opts.text_filters?.[key]);
      }
      function variableValue(key){
        return opts.text_filters?.[key]?textFilter(key)?.value??'':opts.texts[key]||'';
      }
      function readVariableOrder(doc){
        const allowed=new Set(template.variables.filter(key=>key!=='dashboard'));
        // Follow the template's reading order (including tables/header/footer),
        // deduplicate repeats and retain fields omitted by the HTML preview.
        variableOrder=[...new Set([...Array.from(doc.querySelectorAll('[data-key]'),mark=>mark.dataset.key),...template.variables])]
          .filter(key=>allowed.has(key));
      }
      function selectVariable(key,navigate=false){
        if(key!=='dashboard'&&!template?.variables.includes(key))return;
        activeVariable=key;
        let target=null;
        for(const card of by('dt-texts').querySelectorAll('[data-variable]')){
          const selected=card.dataset.variable===key;
          card.classList.toggle('is-selected',selected);
          if(selected)target=card;
        }
        const binding=app.querySelector('.dt-binding');
        binding.classList.toggle('is-selected',key==='dashboard');
        if(key==='dashboard')target=binding;
        const doc=by('dt-preview').querySelector('iframe')?.contentDocument;
        if(doc)for(const mark of doc.querySelectorAll('[data-key]')){
          mark.classList.toggle('dt-variable-selected',mark.dataset.key===key);
        }
        if(!navigate||!target)return;
        const behavior=window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
        const side=target.closest('.editor-side');
        if(side&&side.scrollHeight>side.clientHeight){
          const top=side.scrollTop+target.getBoundingClientRect().top-side.getBoundingClientRect().top-12;
          side.scrollTo({top,behavior});
        }else target.scrollIntoView({block:'nearest',inline:'nearest',behavior});
        const value=target.querySelector('[data-variable-value]');
        const control=value&&!value.readOnly?value:target.querySelector('[data-variable-source]');
