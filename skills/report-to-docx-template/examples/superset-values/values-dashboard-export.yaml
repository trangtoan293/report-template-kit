          <main class="editor-layout dt-layout"><aside class="editor-side"><h2>Dashboard</h2><strong>${esc(source.title)}</strong><p class="muted">${source.charts.length} charts · ${source.scope==='active'?'Selected tab':'Entire dashboard'}</p>
          <hr><section aria-labelledby="dt-charts-heading"><h3 id="dt-charts-heading">Charts in the report</h3><p id="dt-selection-count" class="muted" role="status"></p><div class="dt-selection-actions"><button type="button" id="dt-select-all" class="tiny">Turn all on</button><button type="button" id="dt-select-none" class="tiny">Turn all off</button></div><div class="dt-chart-list">${source.charts.map(c=>`<label class="dt-chart-choice"><span class="dt-chart-label">${esc(c.title)}</span><span class="dt-switch-state" aria-hidden="true"></span><span class="dt-switch"><input type="checkbox" role="switch" data-include-chart="${c.id}" aria-label="Export chart ${esc(c.title)}"><span class="dt-switch-track" aria-hidden="true"></span></span></label>`).join('')}</div><p class="form-help">Turn a chart off to remove both its table and image from the export. The original dashboard is unchanged.</p><p id="dt-empty-selection" class="dt-selection-warning" role="status" hidden>Select at least one chart to preview and save the report.</p></section>
          <hr><h3>Data filters</h3><p>${source.filter_mode==='all'?'All — ignore dashboard filters':'Using the selected filters'}</p><ul class="dt-filters">${source.filter_labels.map(v=>`<li>${esc(v)}</li>`).join('')}</ul><button id="dt-edit-filters">Edit filters</button><p class="form-help">Filters and chart selection are saved separately for each report. Preview the PDF, then Save as new to keep the previous report too.</p>
          <hr><label>DOCX template<select id="dt-template"><option value="">Choose a template with {#dashboard#}</option>${templates.map(t=>`<option value="${esc(t.id)}"${template?.id===t.id?' selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label class="button dt-upload">Upload a DOCX template<input id="dt-upload" type="file" accept=".docx" hidden></label>
          <p class="form-help">Enabled charts keep their Row limit and the selected filters. The report merges data pages and repeats the column headers across pages.</p></aside>
          <section class="document-area"><div class="hint"><span id="dt-preview-label">Choose a template to see the layout</span><span class="preview-tools"><a id="dt-open-pdf" class="button" target="_blank" rel="noopener noreferrer" hidden>Open PDF in new tab</a><a id="dt-pdf" class="button" hidden>Download PDF</a></span></div><p id="dt-status" role="status" aria-live="polite"></p><div id="dt-progress"></div><div id="dt-preview" class="dt-preview"><div class="dt-empty"><h2>Dashboard report from a template</h2><p>Choose a DOCX template containing the <code>{#dashboard#}</code> variable.<br>Enabled charts will be placed at this position.</p></div></div></section>
          <aside class="editor-side right"><h2>Export layout</h2><p class="form-help">The options below apply when generating the PDF. The middle panel shows the DOCX template layout.</p><div class="dt-binding"><code>{#dashboard#}</code><span id="dt-binding-count"></span></div>
          <h3>Data table</h3><label>Table font size (pt)<select id="dt-font">${[8,9,10,11,12,14,16].map(n=>`<option${opts.font_size===n?' selected':''}>${n}</option>`).join('')}</select></label><label>Max data columns / group<select id="dt-columns" aria-describedby="dt-columns-help">${[3,4,5,6,7,8,10,12,13].map(n=>`<option${opts.columns_per_group===n?' selected':''}>${n}</option>`).join('')}</select></label><p id="dt-columns-help" class="form-help">Splits wide tables into multiple groups so all columns print; no data column is hidden. The No. column is not counted. A narrow page size may fit fewer columns than selected.</p>
          <h3>Included content</h3><div class="dt-content-options">${[['show_title','Print report title'],['show_filters','Print selected filters'],['include_images','Include available chart images']].map(([key,label])=>`<label class="dt-print-option"><span class="dt-option-label">${label}</span><span class="dt-switch-state" aria-hidden="true"></span><span class="dt-switch"><input type="checkbox" role="switch" data-option="${key}" aria-label="${label}"${opts[key]?' checked':''}><span class="dt-switch-track" aria-hidden="true"></span></span></label>`).join('')}</div><p id="dt-image-help" class="form-help"></p>
          <div id="dt-texts"></div><hr><h3>Per-chart settings</h3><p class="form-help">Set the PDF title and identifying columns for each chart. Column choices load only when requested. The original dashboard is unchanged.</p>${source.charts.map(c=>`<fieldset class="dt-chart-settings" data-chart-settings="${c.id}"><label>${esc(c.title)}<input data-chart="${c.id}" maxlength="200" aria-label="PDF chart title for ${esc(c.title)}" value="${esc(opts.chart_titles[c.id]||c.title)}"></label><p class="dt-chart-disabled form-help" hidden>Chart is off — not exported to the report.</p></fieldset>`).join('')}</aside></main>`;
        by('dt-binding-count').closest('.dt-binding').after(by('dt-texts'));
        by('dt-status').insertAdjacentHTML('afterend','<div id="dt-status-actions" class="hint" hidden><button id="dt-refresh-status" type="button" aria-describedby="dt-status" title="Check the existing report job without generating another PDF">Refresh status</button></div>');
        by('dt-refresh-status').onclick=()=>guard(async()=>{
