    def template_access(snapshot):
        if not snapshot.get('template'):
            return None
        config = snapshot['template']
        if config.get('source') == 'published':
            record, office, _ = published_office(config['id'], config.get('publication_id'))
        else:
            record, office = load_office(config['id'])
        if record['sha256'] != config['sha256']:
            raise ExportError('The DOCX template has changed. Reselect the template and preview the report.')
        return office
    
    
    def published_office(template_id, publication_id=None):
        permission(manage=False)
        from customsso.report_workflow import load_published_template
        from customsso.rt_storage import Store, Missing
        from customsso.report_builder import ReportError
        from customsso.rt_office import OfficeError
        from customsso.dr_docx import slot
        from customsso.dr_storage import Missing as ExportMissing
        try:
            record, office, version = load_published_template(Store(), template_id, publication_id)
            slot(office)
            return record, office, version
        except Missing as ex:
            raise ExportMissing() from ex
        except (ReportError, OfficeError) as ex:
            raise ExportError(str(ex)) from ex
    
    
    def applied_text_filters(snapshot):
        """Values from the report's captured filters, never from a live browser selection."""
        if snapshot.get('filter_mode') != 'current':
            return []
        masks = (snapshot.get('filter_state') or {}).get('data_mask', {})
        if not masks:
            return []
        names = snapshot.get('filter_names')
        if names is None:
            # Older saved reports captured masks but not the native filter names.
            from customsso.dashboard_export import dashboard_access
            dashboard = dashboard_access(snapshot['dashboard_id'])
            metadata = json.loads(dashboard.json_metadata or '{}')
            names = {item['id']:item.get('name') or item['id']
                     for item in (metadata.get('native_filter_configuration') or [])
                     if isinstance(item, dict) and isinstance(item.get('id'), str)}
    
        def display(value):
            if isinstance(value, list):
                parts = [display(item) for item in value]
                return ', '.join(part for part in parts if part)
            if isinstance(value, bool):
                return 'true' if value else 'false'
            if isinstance(value, (str, int, float)):
                return str(value).strip()
            return ''
    
        result = []
        for filter_id, mask in masks.items():
            extra = mask.get('extraFormData')
            if not isinstance(extra, dict) or not extra:
                continue
            state = mask.get('filterState') or {}
            if not isinstance(state, dict):
                continue
            value = display(state.get('label')) or display(state.get('value')) or display(extra.get('time_range'))
            if value:
                result.append({'id':filter_id, 'name':names.get(filter_id, 'Filter ' + filter_id), 'value':value})
        return result
    
    
    def identifying_columns(item, verbose=None):
        """Read captured query metadata only; never execute a data query for the picker."""
        context = item['query_context']
        form = context.get('form_data') or {}
        queries = [q for q in context.get('queries', []) if not q.get('is_rowcount')]
        query = queries[0] if queries else {}
        # Pivot value columns are generated from data and have positional keys.
        # Only stable row dimensions can identify records in the printed pivot.
        pivot = form.get('viz_type') == 'pivot_table_v2'
        fields = list(form.get('groupbyRows') or []) if pivot else list(query.get('columns') or []) + list(query.get('metrics') or [])
        if not pivot and query.get('is_timeseries'):
            fields.insert(0, '__timestamp')
        config, result, seen = form.get('column_config') or {}, [], set()
        for field in fields:
            name = field if isinstance(field, str) else (field.get('label') or field.get('column_name')) if isinstance(field, dict) else None
            if not isinstance(name, str) or not name or name in seen:
                continue
            seen.add(name)
            custom = config.get(name) or {}
            label = custom.get('display_name') if isinstance(custom, dict) else None
            result.append({'id':name, 'label':str(label or (verbose or {}).get(name) or name)})
        return result
    
    
    def options(raw, snapshot, office):
        if not isinstance(raw, dict):
            raise ExportError('The report configuration is invalid.')
        def label(value, maximum=200):
            if not isinstance(value, str) or not value.strip() or len(value) > maximum:
                raise ExportError('The report/chart name must be between 1 and 200 characters.')
            return value.strip()
        def number(name, default, low, high):
            value = raw.get(name, default)
            if type(value) is not int or not low <= value <= high:
                raise ExportError(f'{name} must be between {low} and {high}.')
            return value
        titles = raw.get('chart_titles') or {}
        texts = raw.get('texts') or {}
        if not isinstance(titles, dict) or not isinstance(texts, dict):
            raise ExportError('The variable configuration or chart name is invalid.')
        if set(texts) - (set(office.variables) - {'dashboard'}):
            raise ExportError("You cannot replace the dashboard variable's data with text.")
        if any(not isinstance(v, str) or len(v) > 2000 for v in texts.values()):
            raise ExportError('A text variable value must not exceed 2,000 characters.')
        bindings = raw.get('text_filters', {})
        if (not isinstance(bindings, dict) or set(bindings) - (set(office.variables) - {'dashboard'})
                or any(not isinstance(v, str) or not v or len(v) > 200 for v in bindings.values())):
            raise ExportError('The template variable filter mapping is invalid.')
        # datetime is reserved for the system export date, never a user/filter value.
        bindings = {key:value for key, value in bindings.items() if key != 'datetime'}
        resolved_texts = {key:texts.get(key, '') for key in office.variables if key not in ('dashboard', 'datetime')}
        if bindings:
            available_filters = {item['id']:item for item in applied_text_filters(snapshot)}
            for key, filter_id in bindings.items():
                if filter_id not in available_filters:
                    raise ExportError(f'Template variable "{key}": the selected filter has no applied value. Choose another filter or enter text manually.')
                value = available_filters[filter_id]['value']
                if len(value) > 2000:
                    raise ExportError(f'Template variable "{key}": the filter value exceeds 2,000 characters. Narrow the filter selection or enter text manually.')
                resolved_texts[key] = value
        available_ids = [c['id'] for c in snapshot['charts']]
        selected = raw.get('chart_ids', available_ids)
        if (not isinstance(selected, list) or not selected or len(selected) > len(available_ids)
                or any(type(value) is not int or value not in available_ids for value in selected)
                or len(set(selected)) != len(selected)):
            raise ExportError('Select at least one chart within the report scope; do not select duplicate charts.')
        width = number('columns_per_group', 8, 3, 13)
        identities = raw.get('chart_id_columns', {})
        if not isinstance(identities, dict) or set(identities) - {str(value) for value in available_ids}:
            raise ExportError('The identifying-column configuration is invalid.')
        normalized = {}
        for chart in snapshot['charts']:
            config = identities.get(str(chart['id']))
            if config is None:
                continue
            if not isinstance(config, dict) or type(config.get('enabled')) is not bool:
                raise ExportError('The identifying-column configuration is invalid.')
            columns = config.get('columns', [])
            if (not isinstance(columns, list) or len(columns) > 12
                    or any(not isinstance(value, str) or not value or len(value) > 1000 for value in columns)
                    or len(set(columns)) != len(columns)):
                raise ExportError('Select distinct identifying columns for each chart.')
            if config['enabled'] and chart['id'] in selected:
                if not columns or len(columns) >= width:
                    raise ExportError(f"{chart['title']}: select at least one identifying column and fewer than {width} columns, or turn repetition off.")
                available = {col['id'] for col in identifying_columns(chart)}
                if set(columns) - available:
                    raise ExportError(f"{chart['title']}: an identifying column is no longer available. Reload the column list and reselect it.")
            normalized[str(chart['id'])] = {'enabled':config['enabled'], 'columns':list(columns)}
        result = {'title': label(raw.get('title') or snapshot['title']),
                  'chart_ids': [value for value in available_ids if value in selected],
                  'font_size': number('font_size', 10, 8, 16),
                  'columns_per_group': width, 'chart_id_columns': normalized,
                  'chart_titles': {str(c['id']):label(titles.get(str(c['id']), c['title'])) for c in snapshot['charts']},
                  'texts': resolved_texts, 'text_filters': dict(bindings)}
        for name, default in (('show_title', True), ('show_filters', False), ('include_images', True)):
            value = raw.get(name, default)
            if type(value) is not bool:
                raise ExportError('The display configuration is invalid.')
            result[name] = value
        return result
    
    
    def signature(value):
        return hashlib.sha256(json.dumps(value, sort_keys=True, ensure_ascii=False).encode()).hexdigest()
    
    
    def path(store, kind, value):
        from customsso.dashboard_export import identifier
        return f'{store.prefix}/{kind}/{store.user}/{identifier(value)}.json'
    
    
    def verify_snapshot(snapshot):
        from customsso.dashboard_export import check_job_access
        check_job_access({'owner_id':g.user.id, 'dashboard_id':snapshot['dashboard_id'],
                          'expires':time.time() + 60}, snapshot, check_fingerprints=True)
    
    
    def read_source(store, payload):
        permission()
        if payload.get('draft_id'):
            source, _ = store.get_json(path(store, 'drafts', payload['draft_id']))
            if time.time() >= source['expires']:
                raise ExportError('The dashboard selection session has expired. Open the dashboard and choose Create with template again.')
        elif payload.get('report_id'):
            record, _ = load_record(report_store(), 'reports', payload['report_id'])
            if record.get('source') != 'dashboard':
                raise ExportError('This report does not use a dashboard source.')
            source, _ = store.get_json(path(store, 'report-definitions', record['definition_id']))
        else:
            source, _ = store.get_json(path(store, 'drafts', payload.get('draft_id')))
            if time.time() >= source['expires']:
                raise ExportError('The dashboard selection session has expired. Open the dashboard and choose Create with template again.')
        if source['owner_id'] != g.user.id:
            raise ExportError('No dashboard was found for this account.')
        verify_snapshot(source['snapshot'])
        return source
    
    
    def public_source(source):
        snapshot = source['snapshot']
        return {'id':source['id'], 'dashboard_id':snapshot['dashboard_id'], 'title':snapshot['title'],
                'scope':snapshot['scope'], 'filter_mode':snapshot['filter_mode'],
                'active_tabs':snapshot.get('active_tabs', []),
                'filter_state':snapshot.get('filter_state'),
                'legacy_filter_key':next((c['query_context'].get('form_data', {}).get('url_params', {}).get('native_filters_key')
                                          for c in snapshot['charts'] if c['query_context'].get('form_data', {}).get('url_params', {}).get('native_filters_key')), None),
                'filter_labels':snapshot['filter_labels'], 'text_filter_options':applied_text_filters(snapshot),
                'created':source['created'],
                'charts':[{'id':c['id'], 'title':c['title'], 'has_image':bool(c.get('image'))}
                          for c in snapshot['charts']]}
    
    
    def register_routes(bp):
        from customsso import dashboard_export as dr
        api = dr.API
    
        # Separate entry points for the end-user dialog. Reuse the same owner,
        # template, dashboard and dataset checks as the report editor.
        @bp.get(api + '/dashboard-templates')
        @dr.protected
        def dashboard_templates():
