  dt_ui.js: |
    /* Dashboard -> DOCX template -> full PDF review. Uses the existing report page. */
    (() => {
      'use strict';
      const cfg=JSON.parse(document.getElementById('rt-config').dataset.config);
      if(cfg.view!=='dashboard')return;
      const app=document.getElementById('rt-app'), params=new URLSearchParams(location.search);
      const api=cfg.root+'/api/v1/dashboard_export', rb=cfg.api;
      const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const by=id=>document.getElementById(id);
      let source,templates=[],template=null,record=null,job=null,timer,busy=false,revision=0,reviewRevision=-1;
      let previewTab=null,filterDialog=null,statusFailed=false,pollAttempt=null,reportName='';
      let variableOrder=[],activeVariable=null;
      const columnCache=new Map();
      const pdfUrl=id=>new URL(api+'/exports/'+encodeURIComponent(id)+'/view?report_name='+encodeURIComponent(reportName||opts.title||source.title),location.href).href;
      function tabMessage(message){
        try{
          if(!previewTab||previewTab.closed)return;
          const doc=previewTab.document;doc.title='PDF report preview';
          const heading=doc.createElement('h1');heading.textContent='PDF report';
          const status=doc.createElement('p');status.setAttribute('role','status');status.textContent=message;
          doc.body.replaceChildren(heading,status);
        }catch(_){}
      }
      function endTab(message){tabMessage(message);previewTab=null;}
      function reserveTab(){
        try{
          // Open during the click, before awaiting the export API, to avoid popup blocking.
          previewTab=window.open('about:blank','_blank');
          if(previewTab)previewTab.opener=null;
          tabMessage('Generating the full PDF. Keep the report screen open; this tab will show the PDF when it is ready.');
        }catch(_){previewTab=null;}
      }
      function openReadyTab(id){
        const tab=previewTab;previewTab=null;
        try{if(tab&&!tab.closed){tab.location.replace(pdfUrl(id));return true;}}catch(_){}
        return false;
      }
      window.addEventListener('pagehide',()=>{clearTimeout(timer);pollAttempt=null;endTab('The report screen was closed. Reopen the report to see the status and open the PDF.');});
      let draftId=params.get('dashboard_draft'), reportId=params.get('dashboard_report');
      let opts={title:'',font_size:10,columns_per_group:8,show_title:true,show_filters:false,include_images:true,chart_titles:{},texts:{}};
      async function call(root,path,method='GET',body) {
        const form=body instanceof FormData;
        let response;
        try{response=await fetch(root+path,{method,credentials:'same-origin',cache:'no-store',
          headers:{...(method==='GET'?{}:{'X-CSRFToken':cfg.csrf}),...(body&&!form?{'Content-Type':'application/json'}:{})},
          ...(body?{body:form?body:JSON.stringify(body)}:{})});
        }catch(error){error.retryable=true;throw error;}
        let value={};
        if((response.headers.get('Content-Type')||'').includes('application/json')){
          try{value=await response.json();}catch(error){if(response.ok)throw error;}
        }
        if(!response.ok){
          const error=new Error(value?.message||(response.status===401?'Your login session has expired. Sign in again, then retry.':response.status===403?'You do not have permission to access this report.':`Request failed (HTTP ${response.status}). Please retry.`));
          error.status=response.status;error.retryable=[408,429,502,503,504].includes(response.status);throw error;
        }
        if(!(response.headers.get('Content-Type')||'').includes('application/json'))throw new Error(`Unexpected server response (HTTP ${response.status}). Check your connection and login, then retry.`);
        return value;
      }
      function notice(value,error=false){by('dt-status').textContent=value;by('dt-status').className=error?'dt-error':'muted';}
      function payload(){return {draft_id:draftId,report_id:reportId,report_name:reportName,template_id:template?.id,options:opts,job_id:job?.id,etag:record?.etag};}
      function saveEnabled(enabled){by('dt-save').disabled=!enabled;by('dt-copy').disabled=!enabled;}
      function selectedCharts(){return source.charts.filter(c=>!Array.isArray(opts.chart_ids)||opts.chart_ids.includes(c.id));}
      function updateReviewButton(){
        by('dt-review').disabled=busy||!template||!selectedCharts().length||['queued','running'].includes(job?.state);
        by('dt-status-actions').hidden=!statusFailed||!job?.id;
        by('dt-refresh-status').disabled=busy||!!pollAttempt;
        by('dt-refresh-status').textContent=pollAttempt?'Refreshing...':'Refresh status';
      }
      function syncContentOptions(){
        app.querySelectorAll('[data-option]').forEach(input=>{
          const enabled=input.checked&&!input.disabled;
          const row=input.closest('.dt-print-option');
          row.classList.toggle('is-off',!enabled);
          row.classList.toggle('is-disabled',input.disabled);
          row.querySelector('.dt-switch-state').textContent=input.disabled?'Unavailable':enabled?'On':'Off';
        });
      }
      function syncSelection(){
        const selected=selectedCharts(),ids=selected.map(c=>c.id),images=selected.filter(c=>c.has_image).length;
        by('dt-selection-count').textContent=`${selected.length}/${source.charts.length} charts exported`;
        by('dt-binding-count').textContent=`${selected.length} charts will be inserted into the template`;
        by('dt-empty-selection').hidden=selected.length>0;
        app.querySelectorAll('[data-include-chart]').forEach(input=>{
          const included=ids.includes(Number(input.dataset.includeChart));input.checked=included;
          input.closest('.dt-chart-choice').classList.toggle('is-off',!included);
          input.closest('.dt-chart-choice').querySelector('.dt-switch-state').textContent=included?'On':'Off';
        });
        app.querySelectorAll('[data-chart-settings]').forEach(card=>{
          const included=ids.includes(Number(card.dataset.chartSettings));card.disabled=!included;
          card.querySelector('.dt-chart-disabled').hidden=included;
        });
        by('dt-image-help').textContent=images?`${images}/${selected.length} selected charts have an image. Data tables are still exported in full.`:'The selected charts do not have a snapshot yet; the report still exports data tables.';
        app.querySelector('[data-option="include_images"]').disabled=!images;
        syncContentOptions();
        const doc=by('dt-preview').querySelector('iframe')?.contentDocument;
        if(doc)for(const mark of doc.querySelectorAll('[data-key="dashboard"]'))mark.textContent=`Dashboard: ${source.title} · ${selected.length} chart`;
        updateReviewButton();
      }
      function changed(){revision++;endTab('The report settings changed. Go back to the report screen and click Preview PDF to generate a new version.');saveEnabled(false);by('dt-pdf').hidden=true;by('dt-open-pdf').hidden=true;notice('Settings changed. Preview again to generate a PDF with the new settings.');}
      function identityConfig(id){
        opts.chart_id_columns=opts.chart_id_columns||{};
        return opts.chart_id_columns[id]||{enabled:false,columns:[]};
      }
      function identityError(chart){
        const config=identityConfig(chart.id);
        if(!config.enabled)return '';
        if(!config.columns.length)return `${chart.title}: select at least one identifying column or turn repetition off.`;
        if(config.columns.length>=opts.columns_per_group)return `${chart.title}: select fewer than ${opts.columns_per_group} identifying columns to leave room for other data.`;
        return '';
      }
      function renderIdentityControls(){
        app.querySelectorAll('[data-chart-settings]').forEach(card=>{
          const id=Number(card.dataset.chartSettings),chart=source.charts.find(c=>c.id===id);
          let panel=card.querySelector('.dt-identifiers');
          if(!panel){panel=document.createElement('div');panel.className='dt-identifiers';card.appendChild(panel);}
          const key=source.id+':'+id;
          const draw=()=>{
            if(!panel.isConnected)return;
            const config=identityConfig(id),cached=columnCache.get(key);
            panel.innerHTML=`<label class="dt-print-option${config.enabled?'':' is-off'}"><span class="dt-option-label">Repeat identifying columns</span><span class="dt-switch-state" aria-hidden="true">${config.enabled?'On':'Off'}</span><span class="dt-switch"><input type="checkbox" role="switch" data-repeat-identifiers aria-label="Repeat identifying columns for ${esc(chart.title)}"${config.enabled?' checked':''}><span class="dt-switch-track" aria-hidden="true"></span></span></label><div data-identity-body${config.enabled?'':' hidden'}><p class="form-help">Repeated at the start of each column group when the table is too wide. Included in Max data columns / group.</p><p data-identity-summary class="form-help"></p><p data-identity-error class="dt-error" role="status"></p><div data-identity-picker></div></div>`;
            const summary=()=>{
              const value=identityConfig(id),available=cached?.columns;
              panel.querySelector('[data-identity-summary]').textContent=value.columns.length?'Selected: '+value.columns.map(name=>available?.find(c=>c.id===name)?.label||name).join(', '):'No identifying columns selected.';
              const missing=available&&value.columns.filter(name=>!available.some(c=>c.id===name));
              panel.querySelector('[data-identity-error]').textContent=identityError(chart)||(missing?.length?'Some saved columns are unavailable. Remove them and select available columns.':'');
            };
            summary();
            panel.querySelector('[data-repeat-identifiers]').onchange=e=>{
              opts.chart_id_columns[id]={...identityConfig(id),enabled:e.target.checked};changed();draw();
              if(e.target.checked&&!columnCache.get(key)?.columns)load();
            };
            if(!config.enabled)return;
            const picker=panel.querySelector('[data-identity-picker]');
            if(!cached?.columns){
              picker.innerHTML=`<p class="${cached?.error?'dt-error':'form-help'}" role="status">${esc(cached?.error|| (cached?.loading?'Loading columns for this chart...':'Column choices load only when requested. Saved selections are kept.'))}</p><button type="button" data-load-columns${cached?.loading?' disabled':''}>${cached?.loading?'Loading...':cached?.error?'Retry loading columns':'Choose columns'}</button>`;
              picker.querySelector('button').onclick=load;return;
            }
            const available=cached.columns,missing=config.columns.filter(name=>!available.some(c=>c.id===name));
            const choices=[...available,...missing.map(id=>({id,label:id+' (unavailable)'}))];
            picker.innerHTML=`${cached.pivot?'<p class="form-help">Pivot charts: choose row dimensions, which identify rows in both the pivot and its source table.</p>':''}<details class="dt-column-picker"><summary>Choose columns (${config.columns.length} selected)</summary><input type="search" data-column-search placeholder="Search columns" aria-label="Search identifying columns for ${esc(chart.title)}"><div class="dt-column-choices" role="group" aria-label="Identifying columns for ${esc(chart.title)}">${choices.map(col=>`<label class="dt-column-choice"><input type="checkbox" data-identity-column="${esc(col.id)}"${config.columns.includes(col.id)?' checked':''}><span>${esc(col.label)}${col.label!==col.id?`<small>${esc(col.id)}</small>`:''}</span></label>`).join('')}</div></details>${!choices.length?'<p class="form-help">No stable columns are available in this chart configuration. Turn repetition off for this chart.</p>':''}`;
            const updateChoices=()=>{
              const selected=identityConfig(id).columns,limit=opts.columns_per_group-1;
              picker.querySelectorAll('[data-identity-column]').forEach(input=>{input.disabled=!input.checked&&selected.length>=limit;});
              picker.querySelector('summary').textContent=`Choose columns (${selected.length} selected)`;
              summary();
            };
            picker.querySelector('[data-column-search]').oninput=e=>{
              const query=e.target.value.toLocaleLowerCase();
              picker.querySelectorAll('.dt-column-choice').forEach(row=>{row.hidden=!row.textContent.toLocaleLowerCase().includes(query);});
            };
            picker.querySelectorAll('[data-identity-column]').forEach(input=>input.onchange=()=>{
              const current=identityConfig(id),name=input.dataset.identityColumn;
              opts.chart_id_columns[id]={...current,columns:input.checked?[...current.columns,name]:current.columns.filter(col=>col!==name)};
              changed();updateChoices();
            });
            updateChoices();
          };
          const load=async()=>{
            if(columnCache.get(key)?.loading)return;
            columnCache.set(key,{loading:true});draw();
            try{
              const value=await call(api,'/template-chart-columns','POST',{draft_id:draftId,report_id:reportId,chart_id:id});
              if(!Array.isArray(value.columns))throw new Error('Invalid column response. Please retry.');
              columnCache.set(key,{columns:value.columns,pivot:value.pivot});
            }catch(e){columnCache.set(key,{error:e.message});}
            if(source.id+':'+id!==key||!panel.isConnected)return;
