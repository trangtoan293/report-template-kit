      async function preview(){
        if(!template)throw new Error('Choose a DOCX template before previewing.');
        if(!selectedCharts().length)throw new Error('Select at least one chart to generate the report.');
        for(const chart of selectedCharts()){
          const error=identityError(chart);if(error)throw new Error(error);
        }
        for(const key of Object.keys(opts.text_filters||{})){
          const filter=textFilter(key);
          if(!filter)throw new Error('Template variable "'+key+'": choose an applied filter or enter text manually.');
