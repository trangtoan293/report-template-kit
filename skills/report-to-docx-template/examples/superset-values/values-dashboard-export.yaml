            from customsso.rt_storage import Store
            from customsso.report_builder import ReportError
            try:
                templates = {t['id']:t for t in published_templates(Store())}
            except ReportError as ex:
                raise ExportError(str(ex)) from ex
            if dr.report_admin():
                templates.update({t['id']:t for t in report_store().listing('templates')
                                  if t['extension'] == 'docx' and 'dashboard' in t.get('variables', [])})
            return dr.reply({'templates':[{'id':t['id'], 'name':t['name'],
                                          'has_text_variables':any(v not in ('dashboard', 'datetime') for v in t.get('variables', []))}
                                         for t in templates.values()]})
    
        @bp.post(api + '/template-exports/latest')
        @dr.protected
        def latest_template_export():
            """Find one retained PDF for this owner, template and dashboard/chart scope."""
            from customsso.dr_storage import Missing
            from werkzeug.exceptions import Forbidden, NotFound
            permission(manage=False)
            payload = dr.read_payload()
            dashboard_id = dr.integer(payload.get('dashboard_id'), 'Dashboard ID')
            template_id = dr.identifier(payload.get('template_id'))
            dashboard = dr.dashboard_access(dashboard_id)
            scope = payload.get('scope')
            tabs = payload.get('active_tabs') or []
            if scope not in ('dashboard', 'active', 'chart'):
                raise ExportError('The report scope is invalid.')
            if not isinstance(tabs, list) or not all(isinstance(tab, str) for tab in tabs):
                raise ExportError('The tab list is invalid.')
            expected = dr.chart_order(json.loads(dashboard.position_json or '{}'), scope, tabs)
            if scope == 'chart':
                chart_id = dr.integer(payload.get('chart_id'), 'Chart ID')
                if chart_id not in expected:
                    raise ExportError('The selected chart is no longer in this dashboard.')
                expected = [chart_id]
            context = {'template_id':template_id, 'scope':scope, 'chart_ids':expected}
            store, candidates, now = dr.Store(), [], time.time()
            # Only list this user's metadata. Do not scan other users or load PDFs.
            for job_key in store.keys(f'{store.prefix}/jobs/{store.user}/'):
                if not job_key.endswith('.json'):
                    continue
                try:
                    job, _ = store.get_json(job_key)
                except Missing:
                    continue
                if (job.get('owner_id') != g.user.id or job.get('dashboard_id') != dashboard_id
                        or job.get('state') != 'ready' or job.get('expires', 0) <= now
                        or job.get('completed') != job.get('chart_count')
                        or not job.get('result_key')):
                    continue
                if job.get('export_context') is not None and job['export_context'] != context:
                    continue
                candidates.append(job)
            candidates.sort(key=lambda job: job.get('completed_at') or job['created'], reverse=True)
            for job in candidates:
                try:
                    snapshot, _ = store.get_json(dr.input_key(store, job['id']))
                    if (snapshot.get('template', {}).get('id') != template_id
                            or snapshot.get('scope') != scope
                            or [chart['id'] for chart in snapshot['charts']] != expected):
                        continue
                    # Reuse download checks, including publication revocation and RLS.
                    dr.check_job_access(job, snapshot, check_fingerprints=True)
                    template_access(snapshot)
                    store.head(job['result_key'])
                    return dr.reply({'result':dr.public(job)})
                except (Missing, ExportError, Forbidden, NotFound):
                    # Deleted, expired or no longer authorized: try the next PDF.
                    continue
            return dr.reply({'result':None})
    
        @bp.post(api + '/template-exports')
        @dr.protected
        def export_with_template():
            permission(manage=False)
            payload = dr.read_payload()
            raw = payload.get('snapshot')
            if not isinstance(raw, dict) or raw.get('filter_mode') != 'current':
                raise ExportError('Template export uses the currently applied dashboard filters.')
            if not dr.setting('LIBREOFFICE_ENABLED', True):
                raise ExportError('Template PDF export is disabled by the administrator.')
            publication = None
            if dr.report_admin():
                from customsso.dr_storage import Missing
                try:
                    template, office = load_office(payload.get('template_id'))
                except Missing:
                    template, office, publication = published_office(payload.get('template_id'))
            else:
                template, office, publication = published_office(payload.get('template_id'))
            snapshot = dr.prepare(raw, allow_single_chart=True, direct_export=True)
            snapshot['direct_export'] = True
            snapshot['template'] = {'id':template['id'], 'sha256':template['sha256'],
                                    'name':template['name'],
                                    'options':options({'font_size':8, 'columns_per_group':13,
                                                       'show_title':True}, snapshot, office)}
            if publication:
                snapshot['template'].update(source='published', publication_id=publication)
            if snapshot['scope'] != 'chart':
                # Number display headings only, in the exported dashboard/tab order.
                # Keep original chart names and the editor/single-chart flows intact.
                snapshot['template']['options']['chart_titles'] = {
                    str(chart['id']):f'{index}. {chart["title"]}'
                    for index, chart in enumerate(snapshot['charts'], 1)}
            job = dr.enqueue_snapshot(snapshot, dr.Store())
            return dr.reply({'result':dr.public(job)}, 202)
    
