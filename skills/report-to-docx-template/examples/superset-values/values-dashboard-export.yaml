    DASHBOARD_EXPORT_DOCX_BLOCK_PAGE_BREAK = {{ if not (kindIs "bool" .Values.dashboardExport.docxBlockPageBreak) }}{{ fail "dashboardExport.docxBlockPageBreak must be a boolean" }}{{ end }}{{ if .Values.dashboardExport.docxBlockPageBreak }}True{{ else }}False{{ end }}
