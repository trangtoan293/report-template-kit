    def permission(manage=True):
        from customsso.dashboard_export import export_permission, require_report_admin
        export_permission()
        if ('hanas_report_workflow' not in current_app.blueprints
                or not current_app.config.get('REPORT_BUILDER_ENABLED', True)):
            raise ExportError('Report Builder must be deployed together with Dashboard Export to use DOCX templates.')
        if manage:
            require_report_admin()
            roles = current_app.config.get('REPORT_BUILDER_ALLOWED_ROLES')
            if roles is not None and not set(roles).intersection(role.name for role in g.user.roles):
                raise ExportError('This account does not have permission to use Report Builder.')
    
    
    def report_store():
